name: sanvi

services:
  api: &api
    # The :latest fallback is only for an operator running `docker compose
    # up` by hand; the CI pipeline (.github/workflows/main.yml) always sets
    # API_IMAGE/WORKER_IMAGE explicitly to a specific sha-<commit> tag, both
    # on deploy and on rollback, so a real deploy never floats on :latest.
    image: ${API_IMAGE:-ghcr.io/sanvi/sanvi-backend-api:latest}
    init: true
    environment: &api_environment
      SANVI_ENV: production
      SANVI__SERVER__HOST: 0.0.0.0
      SANVI__SERVER__PORT: 8080
      # This replica's Snowflake node; set a unique override per replica.
      SANVI__IDS__NODE_ID: 201
      # All remaining secrets come from the host's secret manager:
      # SANVI__DATABASE__HOST / PORT / NAME / USER / PASSWORD
      # SANVI__REDIS__URL
      # SANVI__TELEMETRY__OTLP__AUTH_TOKEN (OpenObserve ingestion credential;
      # the API refuses to start without it once OTLP is enabled)
    expose: ["8080"]
    restart: unless-stopped
    # Both slots stay alive during a traffic switch. SIGTERM grace also
    # protects in-flight work when an already-drained slot is replaced.
    stop_grace_period: 45s
    healthcheck:
      # The runtime image is distroless (no shell, no curl); sanvi-cli
      # ships in the same image and speaks raw HTTP for exactly this.
      test: ["CMD", "/usr/local/bin/sanvi-cli", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  api_next:
    <<: *api
    environment:
      <<: *api_environment
      SANVI__IDS__NODE_ID: 203

  api_proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      # Directory mount: atomic replacement of active.conf is visible on reload.
      - ./.deploy/proxy:/etc/nginx/sanvi:ro
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 6

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/sanvi/sanvi-backend-api:latest}
    init: true
    command: /usr/local/bin/sanvi-worker
    environment:
      SANVI_ENV: production
      # This replica's Snowflake node; set a unique override per replica.
      SANVI__IDS__NODE_ID: 202
      # SANVI__DATABASE__* / SANVI__REDIS__URL / SANVI__TELEMETRY__OTLP__AUTH_TOKEN
      # from the host's secret manager
    restart: unless-stopped
    # TASK-023: the worker stops polling on SIGTERM and finishes its batch,
    # so the grace period covers the slowest sweep, not just signal
    # delivery. Unacked stream entries are reclaimed by XAUTOCLAIM and
    # redelivered (handlers are idempotent), so a worker restart loses no
    # work — it only replays a bounded tail.
    stop_grace_period: 90s
