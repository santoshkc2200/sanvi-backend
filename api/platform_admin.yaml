info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/platform/admin/tenants:
    get:
      operationId: search_tenant_admin_views
      parameters:
      - description: Substring match on slug/display name.
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: Tenant status filter.
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: 'Cursor: created_at of the last row.'
        in: query
        name: after_created_at
        required: false
        schema:
          format: date-time
          type: string
      - description: 'Cursor: tenant id of the last row.'
        in: query
        name: after_id
        required: false
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 25
          description: Page size, clamped to 1..=100; 25 when absent.
          examples:
          - 25
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminPageView'
          description: One page of tenant views
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid filter
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
      summary: '`GET /api/v1/platform/admin/tenants` — operator tenant search.'
      tags:
      - platform_admin
  /api/v1/platform/admin/tenants/{id}:
    get:
      operationId: get_tenant_admin_view
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminView'
          description: The tenant view
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Tenant not found
      summary: '`GET /api/v1/platform/admin/tenants/{id}` — one tenant admin view.'
      tags:
      - platform_admin
  /api/v1/platform/approvals:
    get:
      operationId: list_pending_approvals
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last approval of the previous page. Absent for
          the first page; the queue is ordered oldest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApprovalView'
                type: array
          description: Pending requests
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout — the request exceeded its budget
      summary: '`GET /api/v1/platform/approvals` — pending four-eyes requests.'
      tags:
      - platform_admin
  /api/v1/platform/approvals/{id}/approve:
    post:
      operationId: approve_request
      parameters:
      - description: Approval id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalView'
          description: Approved and executed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied, self-approval, or fresh MFA missing
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Approval not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Approval no longer pending
      summary: |-
        `POST /api/v1/platform/approvals/{id}/approve` — approve (executes the
        recorded action) and record both identities.
      tags:
      - platform_admin
  /api/v1/platform/approvals/{id}/reject:
    post:
      operationId: reject_request
      parameters:
      - description: Approval id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalView'
          description: Rejected
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied, self-approval, or fresh MFA missing
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Approval not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Approval no longer pending
      summary: '`POST /api/v1/platform/approvals/{id}/reject` — reject a request.'
      tags:
      - platform_admin
  /api/v1/platform/impersonations:
    get:
      operationId: list_impersonations
      parameters:
      - description: Restrict to one tenant.
        in: query
        name: tenant_id
        required: false
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Page size, clamped to 1..=100; 100 when absent.
          examples:
          - 100
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last grant of the previous page. Absent for the
          first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ImpersonationGrantView'
                type: array
          description: Active grants
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout — the request exceeded its budget
      summary: '`GET /api/v1/platform/impersonations` — active grants.'
      tags:
      - platform_admin
    post:
      operationId: create_impersonation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImpersonationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationGrantView'
          description: Grant created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied, target not a member, or fresh MFA missing
      summary: |-
        `POST /api/v1/platform/impersonations` — create a time-boxed grant
        (requires fresh MFA). Exchange the returned id via the
        `x-sanvi-impersonate` header.
      tags:
      - platform_admin
  /api/v1/platform/impersonations/{id}:
    delete:
      operationId: revoke_impersonation
      parameters:
      - description: Grant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationGrantView'
          description: Revoked grant
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied or fresh MFA missing
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Grant not found
      summary: '`DELETE /api/v1/platform/impersonations/{id}` — revoke (immediate).'
      tags:
      - platform_admin
  /api/v1/platform/tenants/{id}/application-fee:
    delete:
      operationId: disable_application_fee
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '204':
          description: Disabled
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied or fresh MFA missing
      summary: |-
        `DELETE /api/v1/platform/tenants/{id}/application-fee` — disable (the
        rollback path: data, no deploy; the numbers are retained for review).
      tags:
      - platform_admin
    get:
      operationId: get_application_fee
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationFeeView'
          description: The configuration (disabled when never configured)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
      summary: |-
        `GET /api/v1/platform/tenants/{id}/application-fee` — the stored
        configuration. A never-configured tenant renders the disabled default
        so the console has one shape to bind.
      tags:
      - platform_admin
    put:
      operationId: set_application_fee
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetApplicationFeeRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationFeeView'
          description: Configuration stored
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid configuration
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied or fresh MFA missing
      summary: |-
        `PUT /api/v1/platform/tenants/{id}/application-fee` — create or update
        the per-tenant fee configuration. Audited with actor + reason; takes
        effect on the next checkout creation with no deploy (rollback is a
        `DELETE` away).
      tags:
      - platform_admin
  /api/v1/platform/tenants/{id}/entitlements:
    get:
      operationId: list_entitlement_overrides
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OverrideView'
                type: array
          description: Override rows
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
      summary: |-
        `GET /api/v1/platform/tenants/{id}/entitlements` — a tenant's stored
        override rows.
      tags:
      - platform_admin
    post:
      operationId: grant_entitlement_override
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantEntitlementRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantEntitlementResultView'
          description: Granted (or approval required)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied or fresh MFA missing
      summary: |-
        `POST /api/v1/platform/tenants/{id}/entitlements` — grant an override.
        Overrides above the configured threshold require four-eyes approval and
        return `approval_required` with the pending request id.
      tags:
      - platform_admin
  /api/v1/platform/tenants/{id}/entitlements/{feature}:
    delete:
      operationId: revoke_entitlement_override
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Feature key
        in: path
        name: feature
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Revoked
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied or fresh MFA missing
      summary: |-
        `DELETE /api/v1/platform/tenants/{id}/entitlements/{feature}` — revoke
        an override (fresh MFA required).
      tags:
      - platform_admin
