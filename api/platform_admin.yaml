      summary: |-
        `PUT /api/v1/platform/tenants/{id}/application-fee` — create or update
        the per-tenant fee configuration. Audited with actor + reason; takes
        effect on the next checkout creation with no deploy (rollback is a
        `DELETE` away).
      tags:
      - platform_admin
