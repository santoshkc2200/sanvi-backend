components:
  schemas:
    ApplicationFeeView:
      description: One tenant's application-fee configuration (operator console).
      properties:
        basis_points:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        enabled:
          description: Off everywhere by default in 0.10.0.
          type: boolean
        fixed_amount_minor:
          format: int64
          type:
          - integer
          - 'null'
        fixed_currency:
          type:
          - string
          - 'null'
        minimum_minor:
          format: int64
          type: integer
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - tenant_id
      - enabled
      - minimum_minor
      type: object
    ApprovalStatus:
      enum:
      - pending
      - approved
      - rejected
      - executed
      type: string
    ApprovalView:
      description: One approval request as exposed by the API.
      properties:
        action_type:
          type: string
        decided_at:
          format: date-time
          type:
          - string
          - 'null'
        decided_by:
          type:
          - string
          - 'null'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        payload: {}
        requested_at:
          format: date-time
          type: string
        requested_by:
          type: string
        status:
          $ref: '#/components/schemas/ApprovalStatus'
      required:
      - id
      - requested_by
      - action_type
      - payload
      - status
      - requested_at
      type: object
    CreateImpersonationRequest:
      properties:
        duration_minutes:
          format: int32
          minimum: 0
          type: integer
        mode:
          $ref: '#/components/schemas/ImpersonationMode'
        reason:
          type: string
        target_user_id:
          type: string
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - tenant_id
      - target_user_id
      - reason
      - duration_minutes
      type: object
    FieldIssue:
      description: |-
        One field-addressed validation issue (TASK-027, FR-1127).

        A validation error that names the input it belongs to lets a client
        build an error summary that links back to the offending field instead
        of guessing from a flat string. `field` is the request-body path,
        root-relative, with bracketed indices for sequence elements
        (`hostname`, `budget.amount.currency`,
        `ad_groups[2].ads[0].creative.placement`) — the same grammar the
        advertising capability matrix already speaks.
      properties:
        field:
          description: Root-relative path to the offending request field.
          type: string
        message:
          description: |-
            Why this field was rejected. Human-readable; `detail` stays the
            request-level summary and is never a replacement for it.
          type: string
      required:
      - field
      - message
      type: object
    GrantEntitlementRequest:
      properties:
        enabled:
          type: boolean
        expires_at:
          format: date-time
          type:
          - string
          - 'null'
        feature_key:
          type: string
        limit:
          format: int64
          type:
          - integer
          - 'null'
        reason:
          type:
          - string
          - 'null'
      required:
      - feature_key
      type: object
    GrantEntitlementResultView:
      oneOf:
      - enum:
        - granted
        type: string
      - properties:
          approval_required:
            properties:
              approval_id:
                type: string
            required:
            - approval_id
            type: object
        required:
        - approval_required
        type: object
    ImpersonationGrantView:
      description: One grant as exposed by the API.
      properties:
        actor_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        mode:
          $ref: '#/components/schemas/ImpersonationMode'
        reason:
          type: string
        revoked_at:
          format: date-time
          type:
          - string
          - 'null'
        revoked_by:
          type:
          - string
          - 'null'
        target_user_id:
          type: string
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - id
      - actor_id
      - tenant_id
      - target_user_id
      - reason
      - mode
      - created_at
      - expires_at
      type: object
    ImpersonationMode:
      description: |-
        How much the impersonated session may do (mirrors the HTTP layer's
        mode; the adapter converts).
      enum:
      - read_only
      - read_write
      type: string
    OffboardingExportEvidence:
      properties:
        checksum:
          type: string
        path:
          type: string
      required:
      - path
      - checksum
      type: object
    OffboardingSnapshot:
      description: |-
        The operator-facing snapshot of one offboarding request (TASK-028,
        FR-1131). Mirrors the tenancy record without leaking the tenancy
        domain into this context; the composition adapter maps between them.
      properties:
        completed_at:
          format: date-time
          type:
          - string
          - 'null'
        created_at:
          format: date-time
          type: string
        error:
          type:
          - string
          - 'null'
        export:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/OffboardingExportEvidence'
            description: |-
              Present once the export verified: the artifact path and
              whole-archive checksum the purge step required.
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        idempotency_key:
          type: string
        purge_report:
          description: |-
            The purge report: removed per context, lawfully retained with
            reason and retention end date.
        status:
          description: pending | exporting | exported | purging | purged | failed.
          type: string
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - id
      - tenant_id
      - idempotency_key
      - status
      - created_at
      - updated_at
      type: object
    OverrideView:
      description: One stored override row (operator console).
      properties:
        enabled:
          type: boolean
        expires_at:
          format: date-time
          type:
          - string
          - 'null'
        feature:
          type: string
        granted_by:
          type:
          - string
          - 'null'
        granted_reason:
          type:
          - string
          - 'null'
        limit:
          format: int64
          type:
          - integer
          - 'null'
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - tenant_id
      - feature
      - enabled
      - updated_at
      type: object
    ProblemDetail:
      allOf:
      - description: |-
          RFC 9457 extension members for problem classes that carry
          structured extras (the disconnect conflict names its blockers,
          for example). Flattened onto the JSON object exactly as the RFC
          prescribes; carrying them here keeps the error-enrichment layer
          from stripping them. Absent otherwise.
        type:
        - object
        - 'null'
      - properties:
          detail:
            description: Human-readable explanation of this specific occurrence.
            type: string
          fields:
            description: |-
              The fields a validation rejection names (TASK-027, FR-1127), as an
              RFC 9457 extension member. Present only when the error is
              field-addressed; the human-readable `detail` is never removed from
              an error that grows field addressing.
            items:
              $ref: '#/components/schemas/FieldIssue'
            type:
            - array
            - 'null'
          instance:
            description: URI of the offending resource, if any.
            type:
            - string
            - 'null'
          reason:
            description: |-
              Machine-readable reason for statuses that carry one (e.g. tenant
              suspension); absent otherwise.
            type:
            - string
            - 'null'
          status:
            description: HTTP status code (mirrors the response code).
            format: int32
            minimum: 0
            type: integer
          title:
            description: Short, human-readable, stable title.
            type: string
          trace_id:
            description: |-
              Correlates with the trace in OpenObserve: the W3C trace id of the
              span serving the request (the same trace the `traceparent` response
              header references), falling back to the request id when the request
              ran outside any OpenTelemetry context.
            type:
            - string
            - 'null'
          type:
            description: Stable URI identifying the error class.
            example: https://sanvi.dev/problems/bad-request
            type: string
        required:
        - type
        - title
        - status
        - detail
        type: object
      description: RFC 9457 problem detail. This is the only error body the API produces.
    RequestOffboardingBody:
      description: The request body for starting an offboarding (TASK-028, FR-1131).
      properties:
        idempotency_key:
          description: |-
            Idempotency key: the same `(tenant, key)` returns the existing
            request instead of forking the record.
          type: string
      required:
      - idempotency_key
      type: object
    SetApplicationFeeRequest:
      properties:
        basis_points:
          description: Basis points of the charge total (1..=10000).
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        enabled:
          description: Master switch. Enabling without a component is a validation error.
          type: boolean
        fixed_amount_minor:
          description: Flat component in minor units, applied to charges in its currency.
          format: int64
          type:
          - integer
          - 'null'
        fixed_currency:
          type:
          - string
          - 'null'
        minimum_minor:
          description: |-
            Floor on the computed fee, minor units of the charge currency
            (currency-aware by interpretation: JPY minor units are whole yen;
            USD minor units are cents).
          format: int64
          type: integer
        reason:
          description: Why the change is being made — audited with the actor.
          type:
          - string
          - 'null'
      type: object
    TenantAdminPageView:
      description: One page of the operator tenant search.
      properties:
        next_after:
          description: Canonical cursor for the next request's after parameter.
          type:
          - string
          - 'null'
        next_cursor:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TenantViewCursorView'
        tenants:
          items:
            $ref: '#/components/schemas/TenantAdminView'
          type: array
      required:
      - tenants
      type: object
    TenantAdminView:
      description: One row of the platform admin tenant search.
      properties:
        active_impersonations:
          description: Active impersonation grants into this tenant.
          format: int32
          minimum: 0
          type: integer
        created_at:
          format: date-time
          type: string
        default_locale:
          type: string
        display_name:
          type: string
        member_count:
          description: Active members (identity projection).
          format: int32
          minimum: 0
          type: integer
        override_count:
          description: Non-expired entitlement overrides (access context).
          format: int32
          minimum: 0
          type: integer
        region:
          type: string
        slug:
          type: string
        status:
          type: string
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - tenant_id
      - slug
      - display_name
      - status
      - region
      - default_locale
      - created_at
      - member_count
      - override_count
      - active_impersonations
      type: object
    TenantViewCursorView:
      properties:
        created_at:
          format: date-time
          type: string
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - created_at
      - tenant_id
      type: object
info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/platform/admin/tenants:
    get:
      operationId: search_tenant_admin_views
      parameters:
      - description: Substring match on slug/display name.
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: Tenant status filter.
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Opaque next-page cursor returned as next_after; pass it unchanged.
        in: query
        name: after
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 25
          description: Page size, clamped to 1..=100; 25 when absent.
          examples:
          - 25
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminPageView'
          description: One page of tenant views
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid filter
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
      summary: |-
        `GET /api/v1/platform/admin/tenants` — operator tenant search.
        Ordered by created_at DESC, id DESC.
      tags:
      - platform_admin
  /api/v1/platform/admin/tenants/{id}:
    get:
      operationId: get_tenant_admin_view
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminView'
          description: The tenant view
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Tenant not found
      summary: '`GET /api/v1/platform/admin/tenants/{id}` — one tenant admin view.'
      tags:
      - platform_admin
  /api/v1/platform/approvals:
    get:
      operationId: list_pending_approvals
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last approval of the previous page. Absent for
          the first page; the queue is ordered oldest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApprovalView'
                type: array
          description: Pending requests
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout — the request exceeded its budget
      summary: |-
        `GET /api/v1/platform/approvals` — pending four-eyes requests.
        Ordered by id ASC.
      tags:
      - platform_admin
  /api/v1/platform/approvals/{id}/approve:
    post:
      operationId: approve_request
      parameters:
      - description: Approval id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalView'
          description: Approved and executed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied, self-approval, or fresh MFA missing
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Approval not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Approval no longer pending
      summary: |-
        `POST /api/v1/platform/approvals/{id}/approve` — approve (executes the
        recorded action) and record both identities.
      tags:
      - platform_admin
  /api/v1/platform/approvals/{id}/reject:
    post:
      operationId: reject_request
      parameters:
      - description: Approval id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalView'
          description: Rejected
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied, self-approval, or fresh MFA missing
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Approval not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Approval no longer pending
      summary: '`POST /api/v1/platform/approvals/{id}/reject` — reject a request.'
      tags:
      - platform_admin
  /api/v1/platform/impersonations:
    get:
      operationId: list_impersonations
      parameters:
      - description: Restrict to one tenant.
        in: query
        name: tenant_id
        required: false
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Page size, clamped to 1..=100; 100 when absent.
          examples:
          - 100
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last grant of the previous page. Absent for the
          first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ImpersonationGrantView'
                type: array
          description: Active grants
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout — the request exceeded its budget
      summary: |-
        `GET /api/v1/platform/impersonations` — active grants.
        Ordered by id DESC.
      tags:
      - platform_admin
    post:
      operationId: create_impersonation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImpersonationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationGrantView'
          description: Grant created
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid request
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied, target not a member, or fresh MFA missing
      summary: |-
        `POST /api/v1/platform/impersonations` — create a time-boxed grant
        (requires fresh MFA). Exchange the returned id via the
        `x-sanvi-impersonate` header.
      tags:
      - platform_admin
  /api/v1/platform/impersonations/{id}:
    delete:
      operationId: revoke_impersonation
      parameters:
      - description: Grant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationGrantView'
          description: Revoked grant
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied or fresh MFA missing
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Grant not found
      summary: '`DELETE /api/v1/platform/impersonations/{id}` — revoke (immediate).'
      tags:
      - platform_admin
  /api/v1/platform/tenants/{id}/application-fee:
    delete:
      operationId: disable_application_fee
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '204':
          description: Disabled
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied or fresh MFA missing
      summary: |-
        `DELETE /api/v1/platform/tenants/{id}/application-fee` — disable (the
        rollback path: data, no deploy; the numbers are retained for review).
      tags:
      - platform_admin
    get:
      operationId: get_application_fee
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationFeeView'
          description: The configuration (disabled when never configured)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
      summary: |-
        `GET /api/v1/platform/tenants/{id}/application-fee` — the stored
        configuration. A never-configured tenant renders the disabled default
        so the console has one shape to bind.
      tags:
      - platform_admin
    put:
      operationId: set_application_fee
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetApplicationFeeRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
