components:
  schemas:
    AcceptInvitationCommand:
      properties:
        token:
          example: 64-hex-chars
          type: string
      required:
      - token
      type: object
    CompleteLinkChallengeBody:
      properties:
        nonce:
          example: 64-hex-chars
          type:
          - string
          - 'null'
      type: object
    FieldIssue:
      description: |-
        One field-addressed validation issue (TASK-027, FR-1127).

        A validation error that names the input it belongs to lets a client
        build an error summary that links back to the offending field instead
        of guessing from a flat string. `field` is the request-body path,
        root-relative, with bracketed indices for sequence elements
        (`hostname`, `budget.amount.currency`,
        `ad_groups[2].ads[0].creative.placement`) — the same grammar the
        advertising capability matrix already speaks.
      properties:
        field:
          description: Root-relative path to the offending request field.
          type: string
        message:
          description: |-
            Why this field was rejected. Human-readable; `detail` stays the
            request-level summary and is never a replacement for it.
          type: string
      required:
      - field
      - message
      type: object
    GrantMembershipCommand:
      properties:
        email:
          example: alice@example.com
          type: string
        role_ids:
          items:
            examples:
            - '873698342314721281'
            format: snowflake-id
            pattern: ^[1-9][0-9]{0,18}$
            type: string
          type: array
      required:
      - email
      - role_ids
      type: object
    InvitationStatus:
      enum:
      - pending
      - accepted
      type: string
    InvitationView:
      properties:
        accepted_at:
          format: date-time
          type:
          - string
          - 'null'
        email:
          example: bob@example.com
          type: string
        expires_at:
          format: date-time
          type: string
        invitation_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        role_ids:
          items:
            examples:
            - '873698342314721281'
            format: snowflake-id
            pattern: ^[1-9][0-9]{0,18}$
            type: string
          type: array
        status:
          $ref: '#/components/schemas/InvitationStatus'
      required:
      - invitation_id
      - email
      - role_ids
      - status
      - expires_at
      type: object
    InviteMemberCommand:
      properties:
        email:
          example: bob@example.com
          type: string
        role_ids:
          items:
            examples:
            - '873698342314721281'
            format: snowflake-id
            pattern: ^[1-9][0-9]{0,18}$
            type: string
          type: array
      required:
      - email
      - role_ids
      type: object
    LinkCompleteResponse:
      properties:
        linked:
          type: boolean
        provider:
          type: string
        subject:
          type: string
      required:
      - provider
      - subject
      - linked
      type: object
    MeView:
      properties:
        created_at:
          format: date-time
          type: string
        email:
          example: alice@example.com
          type: string
        email_verified:
          type: boolean
        locale:
          example: en
          type:
          - string
          - 'null'
        memberships:
          items:
            $ref: '#/components/schemas/MembershipSummary'
          type: array
        status:
          $ref: '#/components/schemas/UserStatus'
        user_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - user_id
      - email
      - email_verified
      - status
      - created_at
      - memberships
      type: object
    MemberView:
      properties:
        created_at:
          format: date-time
          type: string
        email:
          example: alice@example.com
          type: string
        invited_by:
          type:
          - string
          - 'null'
        role_ids:
          items:
            examples:
            - '873698342314721281'
            format: snowflake-id
            pattern: ^[1-9][0-9]{0,18}$
            type: string
          type: array
        status:
          $ref: '#/components/schemas/MembershipStatus'
        user_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - user_id
      - email
      - role_ids
      - status
      - created_at
      type: object
    MembershipStatus:
      enum:
      - active
      - suspended
      type: string
    MembershipSummary:
      description: |-
        One tenant `GET /api/v1/me` reports the caller as a member of, with the
        roles/permissions they hold there — the single hydration call the
        frontend's session store and `can()`/`<Can>` are built on (see
        `sanvi-frontend/docs/phase-02-auth-ux`), so it carries everything a tenant
        switcher and permission-aware render need without a per-tenant follow-up
        request.
      properties:
        permissions:
          description: |-
            The union of every permission `role_ids` grants — a UX hint only; the
            backend enforces every mutation independently of what this list says.
          items:
            type: string
          type: array
        role_ids:
          items:
            examples:
            - '873698342314721281'
            format: snowflake-id
            pattern: ^[1-9][0-9]{0,18}$
            type: string
          type: array
        status:
          $ref: '#/components/schemas/MembershipStatus'
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        tenant_name:
          example: Acme Corporation
          type: string
        tenant_slug:
          example: acme
          type: string
      required:
      - tenant_id
      - tenant_slug
      - tenant_name
      - role_ids
      - permissions
      - status
      type: object
    ProblemDetail:
      allOf:
      - description: |-
          RFC 9457 extension members for problem classes that carry
          structured extras (the disconnect conflict names its blockers,
          for example). Flattened onto the JSON object exactly as the RFC
          prescribes; carrying them here keeps the error-enrichment layer
          from stripping them. Absent otherwise.
        type:
        - object
        - 'null'
      - properties:
          detail:
            description: Human-readable explanation of this specific occurrence.
            type: string
          fields:
            description: |-
              The fields a validation rejection names (TASK-027, FR-1127), as an
              RFC 9457 extension member. Present only when the error is
              field-addressed; the human-readable `detail` is never removed from
              an error that grows field addressing.
            items:
              $ref: '#/components/schemas/FieldIssue'
            type:
            - array
            - 'null'
          instance:
            description: URI of the offending resource, if any.
            type:
            - string
            - 'null'
          reason:
            description: |-
              Machine-readable reason for statuses that carry one (e.g. tenant
              suspension); absent otherwise.
            type:
            - string
            - 'null'
          status:
            description: HTTP status code (mirrors the response code).
            format: int32
            minimum: 0
            type: integer
          title:
            description: Short, human-readable, stable title.
            type: string
          trace_id:
            description: |-
              Correlates with the trace in OpenObserve: the W3C trace id of the
              span serving the request (the same trace the `traceparent` response
              header references), falling back to the request id when the request
              ran outside any OpenTelemetry context.
            type:
            - string
            - 'null'
          type:
            description: Stable URI identifying the error class.
            example: https://sanvi.dev/problems/bad-request
            type: string
        required:
        - type
        - title
        - status
        - detail
        type: object
      description: RFC 9457 problem detail. This is the only error body the API produces.
    SessionView:
      properties:
        aal:
          type: string
        authenticated_at:
          format: date-time
          type:
          - string
          - 'null'
        methods:
          items:
            type: string
          type: array
        session_id:
          type: string
      required:
      - session_id
      - aal
      - methods
      type: object
    StartLinkChallengeCommand:
      properties:
        email:
          example: alice@example.com
          type: string
        kratos_flow_id:
          description: The Kratos login flow that collided (correlation only).
          type:
          - string
          - 'null'
        provider:
          example: google
          type: string
        subject:
          example: sub-12345
          type: string
      required:
      - provider
      - subject
      - email
      type: object
    StartLinkChallengeResponse:
      properties:
        expires_in_secs:
          description: How long the challenge stays valid, in seconds.
          format: int64
          minimum: 0
          type: integer
        nonce:
          description: |-
            The nonce the frontend stores in the `sanvi_link_intent` cookie
            (`HttpOnly`, `SameSite=Lax`, TTL = the intent's).
          type: string
      required:
      - nonce
      - expires_in_secs
      type: object
    UpdateRolesCommand:
      properties:
        role_ids:
          items:
            examples:
            - '873698342314721281'
            format: snowflake-id
            pattern: ^[1-9][0-9]{0,18}$
            type: string
          type: array
      required:
      - role_ids
      type: object
    UserStatus:
      description: |-
        Lifecycle of a projected user. Deactivated is terminal; the email is
        released for reuse.
      enum:
      - active
      - deactivated
      type: string
info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/auth/link/challenge:
    post:
      operationId: start_link_challenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartLinkChallengeCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartLinkChallengeResponse'
          description: Challenge started
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid input
      summary: '`POST /api/v1/auth/link/challenge` — start the account-linking challenge.'
      tags:
      - identity
  /api/v1/auth/link/complete:
    post:
      operationId: complete_link_challenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteLinkChallengeBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCompleteResponse'
          description: Account linked
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '410':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Intent unavailable
      summary: |-
        `POST /api/v1/auth/link/complete` — complete the linking challenge
        (authenticated: the browser holds the nonce, the session proves
        ownership of the existing account).
      tags:
      - identity
  /api/v1/me:
    get:
      operationId: get_me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeView'
          description: The current user
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
      summary: '`GET /api/v1/me` — the signed-in user''s profile.'
      tags:
      - identity
  /api/v1/me/sessions:
    get:
      operationId: list_sessions
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SessionView'
                type: array
          description: The current session
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
      summary: |-
        `GET /api/v1/me/sessions` — the current session (self-management scope
        in phase 02).
      tags:
      - identity
  /api/v1/me/sessions/{session_id}:
    delete:
      operationId: revoke_session
      parameters:
      - description: Session id
        in: path
        name: session_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Session revoked
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Session not found
      summary: '`DELETE /api/v1/me/sessions/{session_id}` — revoke the current session.'
      tags:
      - identity
  /api/v1/tenant/invitations:
    get:
      operationId: list_invitations
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last invitation of the previous page. Absent
          for the first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InvitationView'
                type: array
          description: Invitations
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout — the request exceeded its budget
      summary: |-
        `GET /api/v1/tenant/invitations` — pending and accepted invitations.
        Ordered by id DESC.
      tags:
      - identity
    post:
      operationId: invite_member
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationView'
          description: Invitation created
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid input
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
      summary: '`POST /api/v1/tenant/invitations` — invite a member by email.'
      tags:
      - identity
  /api/v1/tenant/invitations/accept:
    post:
      operationId: accept_invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                default: null
          description: Invitation accepted
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation not found
        '410':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation expired
      summary: '`POST /api/v1/tenant/invitations/accept` — redeem an invitation token.'
      tags:
      - identity
  /api/v1/tenant/invitations/{invitation_id}:
    delete:
      operationId: revoke_invitation
      parameters:
      - description: Invitation id
        in: path
        name: invitation_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '204':
          description: Invitation revoked
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation not found
      summary: '`DELETE /api/v1/tenant/invitations/{invitation_id}` — revoke.'
      tags:
      - identity
  /api/v1/tenant/invitations/{invitation_id}/resend:
    post:
      operationId: resend_invitation
      parameters:
      - description: Invitation id
        in: path
        name: invitation_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationView'
          description: Invitation reissued
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation not found
      summary: '`POST /api/v1/tenant/invitations/{invitation_id}/resend` — reissue.'
      tags:
      - identity
  /api/v1/tenant/members:
    get:
      operationId: list_members
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the user id of the last member of the previous page. Absent
          for the first page; the page is ordered newest member first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MemberView'
                type: array
          description: Members
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout — the request exceeded its budget
      summary: |-
        `GET /api/v1/tenant/members` — the tenant's members.
        Ordered by created_at ASC, user_id ASC.
      tags:
      - identity
    post:
      operationId: grant_member
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantMembershipCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberView'
          description: Membership granted
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: User not found
      summary: '`POST /api/v1/tenant/members` — grant a membership.'
      tags:
      - identity
  /api/v1/tenant/members/{user_id}:
    delete:
      operationId: remove_member
      parameters:
      - description: User id
        in: path
        name: user_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '204':
          description: Membership revoked
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied or last-owner guard
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Membership not found
      summary: '`DELETE /api/v1/tenant/members/{user_id}` — revoke a membership.'
      tags:
      - identity
  /api/v1/tenant/members/{user_id}/roles:
    patch:
      operationId: update_member_roles
      parameters:
      - description: User id
        in: path
        name: user_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolesCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                default: null
          description: Roles updated
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Membership not found
      summary: '`PATCH /api/v1/tenant/members/{user_id}/roles` — replace a member''s roles.'
      tags:
      - identity
