info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/auth/link/challenge:
    post:
      operationId: start_link_challenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartLinkChallengeCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartLinkChallengeResponse'
          description: Challenge started
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid input
      summary: '`POST /api/v1/auth/link/challenge` — start the account-linking challenge.'
      tags:
      - identity
  /api/v1/auth/link/complete:
    post:
      operationId: complete_link_challenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteLinkChallengeBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCompleteResponse'
          description: Account linked
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Intent unavailable
      summary: |-
        `POST /api/v1/auth/link/complete` — complete the linking challenge
        (authenticated: the browser holds the nonce, the session proves
        ownership of the existing account).
      tags:
      - identity
  /api/v1/me:
    get:
      operationId: get_me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeView'
          description: The current user
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
      summary: '`GET /api/v1/me` — the signed-in user''s profile.'
      tags:
      - identity
  /api/v1/me/sessions:
    get:
      operationId: list_sessions
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SessionView'
                type: array
          description: The current session
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
      summary: |-
        `GET /api/v1/me/sessions` — the current session (self-management scope
        in phase 02).
      tags:
      - identity
  /api/v1/me/sessions/{session_id}:
    delete:
      operationId: revoke_session
      parameters:
      - description: Session id
        in: path
        name: session_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Session revoked
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Session not found
      summary: '`DELETE /api/v1/me/sessions/{session_id}` — revoke the current session.'
      tags:
      - identity
  /api/v1/tenant/invitations:
    get:
      operationId: list_invitations
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last invitation of the previous page. Absent
          for the first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InvitationView'
                type: array
          description: Invitations
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout — the request exceeded its budget
      summary: '`GET /api/v1/tenant/invitations` — pending and accepted invitations.'
      tags:
      - identity
    post:
      operationId: invite_member
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationView'
          description: Invitation created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid input
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
      summary: '`POST /api/v1/tenant/invitations` — invite a member by email.'
      tags:
      - identity
  /api/v1/tenant/invitations/accept:
    post:
      operationId: accept_invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                default: null
          description: Invitation accepted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation not found
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation expired
      summary: '`POST /api/v1/tenant/invitations/accept` — redeem an invitation token.'
      tags:
      - identity
  /api/v1/tenant/invitations/{invitation_id}:
    delete:
      operationId: revoke_invitation
      parameters:
      - description: Invitation id
        in: path
        name: invitation_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '204':
          description: Invitation revoked
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation not found
      summary: '`DELETE /api/v1/tenant/invitations/{invitation_id}` — revoke.'
      tags:
      - identity
  /api/v1/tenant/invitations/{invitation_id}/resend:
    post:
      operationId: resend_invitation
      parameters:
      - description: Invitation id
        in: path
        name: invitation_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationView'
          description: Invitation reissued
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invitation not found
      summary: '`POST /api/v1/tenant/invitations/{invitation_id}/resend` — reissue.'
      tags:
      - identity
  /api/v1/tenant/members:
    get:
      operationId: list_members
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the user id of the last member of the previous page. Absent
          for the first page; the page is ordered newest member first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MemberView'
                type: array
          description: Members
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout — the request exceeded its budget
      summary: '`GET /api/v1/tenant/members` — the tenant''s members.'
      tags:
      - identity
    post:
      operationId: grant_member
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantMembershipCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberView'
          description: Membership granted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: User not found
      summary: '`POST /api/v1/tenant/members` — grant a membership.'
      tags:
      - identity
  /api/v1/tenant/members/{user_id}:
    delete:
      operationId: remove_member
      parameters:
      - description: User id
        in: path
        name: user_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '204':
          description: Membership revoked
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied or last-owner guard
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Membership not found
      summary: '`DELETE /api/v1/tenant/members/{user_id}` — revoke a membership.'
      tags:
      - identity
  /api/v1/tenant/members/{user_id}/roles:
    patch:
      operationId: update_member_roles
      parameters:
      - description: User id
        in: path
        name: user_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolesCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                default: null
          description: Roles updated
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Membership not found
      summary: '`PATCH /api/v1/tenant/members/{user_id}/roles` — replace a member''s roles.'
      tags:
      - identity
