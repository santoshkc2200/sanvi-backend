              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No such order in an active store of the tenant, or no such payment of it
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: |-
