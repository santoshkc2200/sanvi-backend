          type: string
      responses:
        '200':
          description: Whatever ecommerce-service answered (any status it returns passes through)
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed path or oversized body
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Tenant lacks products.ecommerce.enabled, or the user holds no ecommerce.* permission
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ecommerce-service rejected the platform's credentials or answered unusably
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ecommerce-service is not configured or unreachable
      summary: |-
        Write through to ecommerce-service: `POST /api/v1/tenant/ecommerce/{tail}`
        becomes `POST /v1/{tail}`. `Idempotency-Key` is forwarded; the service
        requires it on every create.
      tags:
      - product_access
