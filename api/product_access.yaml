  /api/v1/tenant/ecommerce/stores/{store_id}/orders/{order_id}/cancel:
    post:
      description: |-
        An order with money paid on it is refunded first, and an order with any
        goods handed over cannot be cancelled at all — even fully refunded — because
        restoring its stock would sell handed-over goods twice; returned goods need
        the returns workflow. Cancelling a cancelled order returns it unchanged,
        whatever the version.
      operationId: ecommerce_cancel_order
      parameters:
      - description: An active store of the caller's tenant (decimal Snowflake)
        in: path
        name: store_id
        required: true
        schema:
          type: string
      - description: An order of that store (decimal Snowflake)
        in: path
        name: order_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBody'
          description: Cancelled
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid fields
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: |-
            Missing `ecommerce.order.manage` (the service's refusal), or the platform
            refused the request: the tenant lacks `products.ecommerce.enabled`, or the
            user holds no `ecommerce.*` permission
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No such order in an active store of the tenant
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: |-
            Based on an older version (`current_version`); money still stands paid on
            the order or is on its way back (`ecommerce/order-has-payments`, with
            `net_minor` and `pending_refund_minor`): refund it first; an online payment
            attempt is pending (`ecommerce/payment-in-progress`, with `attempt_id`):
            cancel it first; or any goods were handed over
            (`ecommerce/order-has-fulfillments`)
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ecommerce-service rejected the platform's credentials or answered unusably
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ecommerce-service is not configured or unreachable, or its database is unavailable
      summary: Cancel an order and put its stock back.
      tags:
      - product_access
