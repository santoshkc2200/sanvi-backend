components:
  schemas:
    AddressBody:
      description: A stored address. Erased addresses read with null fields.
      properties:
        archived_at:
          description: When it was archived.
          format: date-time
          type:
          - string
          - 'null'
        city:
          description: City.
          example: Shibuya-ku
          type:
          - string
          - 'null'
        country:
          description: ISO 3166-1 alpha-2 country code.
          example: JP
          type:
          - string
          - 'null'
        created_at:
          description: Creation time.
          format: date-time
          type: string
        customer_id:
          description: The customer it belongs to.
          example: '7401234567890120000'
          type: string
        erased_at:
          description: When it was erased.
          format: date-time
          type:
          - string
          - 'null'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        line1:
          description: Street line.
          example: 1-2-3 Shibuya
          type:
          - string
          - 'null'
        line2:
          description: Second street line.
          type:
          - string
          - 'null'
        phone:
          description: Delivery contact in E.164 form.
          type:
          - string
          - 'null'
        postal_code:
          description: Postal code.
          example: 150-0002
          type:
          - string
          - 'null'
        recipient:
          description: Who receives the parcel.
          example: Aiko Tanaka
          type:
          - string
          - 'null'
        region:
          description: State, prefecture or province.
          example: Tokyo
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/AddressStatusBody'
          description: Lifecycle status.
      required:
      - id
      - customer_id
      - status
      - created_at
      type: object
    AddressPageBody:
      description: One page of addresses, newest first.
      properties:
        items:
          description: Addresses on this page.
          items:
            $ref: '#/components/schemas/AddressBody'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page; absent on the last page.
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    AddressStatusBody:
      description: Address lifecycle status.
      enum:
      - active
      - archived
      - erased
      type: string
    ArchiveAddressRequest:
      additionalProperties: false
      description: An archive request has no fields; send `{}`.
      type: object
    CancelOrderRequest:
      additionalProperties: false
      description: A request to cancel an order.
      properties:
        reason:
          description: '`customer_request`, `out_of_stock`, `fraud_suspected` or `other`.'
          example: customer_request
          type: string
        version:
          description: The version the caller read.
          example: 1
          format: int64
          type: integer
      required:
      - version
      - reason
      type: object
    CreateAddressRequest:
      additionalProperties: false
      description: |-
        A new address. Addresses are never edited: to correct one, add the corrected
        address and archive the old one.
      properties:
        city:
          description: City, 1 to 100 characters.
          example: Shibuya-ku
          type:
          - string
          - 'null'
        country:
          description: ISO 3166-1 alpha-2 country code.
          example: JP
          type:
          - string
          - 'null'
        line1:
          description: Street line, 1 to 200 characters.
          example: 1-2-3 Shibuya
          type:
          - string
          - 'null'
        line2:
          description: Second street line, 1 to 200 characters.
          example: Room 401
          type:
          - string
          - 'null'
        phone:
          description: Delivery contact in E.164 form.
          example: '+819012345678'
          type:
          - string
          - 'null'
        postal_code:
          description: Postal code, 1 to 20 characters; stored uppercased.
          example: 150-0002
          type:
          - string
          - 'null'
        recipient:
          description: Who receives the parcel, 1 to 120 characters.
          example: Aiko Tanaka
          type:
          - string
          - 'null'
        region:
          description: State, prefecture or province, 1 to 100 characters.
          example: Tokyo
          type:
          - string
          - 'null'
      type: object
    CreateCustomerRequest:
      additionalProperties: false
      description: A new customer. At least one field is required.
      properties:
        email:
          description: Email address, unique among the tenant's active customers ignoring case.
          example: aiko@example.jp
          type:
          - string
          - 'null'
        name:
          description: Display name, 1 to 120 characters.
          example: Aiko Tanaka
          type:
          - string
          - 'null'
        phone:
          description: Phone number in E.164 form.
          example: '+819012345678'
          type:
          - string
          - 'null'
      type: object
    CreateProductRequest:
      additionalProperties: false
      description: A new product.
      properties:
        description:
          description: Long description, at most 10000 characters.
          type:
          - string
          - 'null'
        status:
          description: '`draft` (default) or `active`.'
          example: draft
          type:
          - string
          - 'null'
        tax_class:
          description: |-
            `standard` (default), `reduced` or `exempt`: the store rate orders
            charge on its sales.
          example: standard
          type:
          - string
          - 'null'
        title:
          description: Display title, 1 to 255 characters.
          example: Linen shirt
          type: string
        variants:
          description: 1 to 100 variants sharing the store's currency and one set of option names.
          items:
            $ref: '#/components/schemas/VariantRequest'
          type: array
      required:
      - title
      - variants
      type: object
    CreateStoreRequest:
      additionalProperties: false
      description: A new store.
      properties:
        currency:
          description: Upper-case ISO 4217 code every price in the store uses. Fixed once set.
          example: JPY
          type: string
        name:
          description: Display name, 1 to 120 characters.
          example: Tokyo flagship
          type: string
        slug:
          description: 3 to 63 lower-case letters, digits or hyphens, unique in the tenant.
          example: tokyo
          type: string
        timezone:
          description: IANA timezone name.
          example: Asia/Tokyo
          type: string
      required:
      - name
      - slug
      - currency
      - timezone
      type: object
    CustomerBody:
      description: A stored customer. Erased customers read with null contact fields.
      properties:
        created_at:
          description: Creation time.
          format: date-time
          type: string
        email:
          description: Email address as given.
          example: aiko@example.jp
          type:
          - string
          - 'null'
        erased_at:
          description: When the personal data was erased.
          format: date-time
          type:
          - string
          - 'null'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        name:
          description: Display name.
          example: Aiko Tanaka
          type:
          - string
          - 'null'
        phone:
          description: Phone number in E.164 form.
          example: '+819012345678'
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/CustomerStatusBody'
          description: Lifecycle status.
        updated_at:
          description: Time of the last change, or the creation time.
          format: date-time
          type: string
        version:
          description: Starts at 1 and grows with every change; edits send the version they read.
          example: 1
          format: int64
          type: integer
      required:
      - id
      - status
      - version
      - created_at
      - updated_at
      type: object
    CustomerExportBody:
      description: |-
        Everything held about a customer: the record, their addresses and a page
        of their orders.
      properties:
        addresses:
          description: |-
            Every address of the customer in every status, oldest first; the
            same on every page.
          items:
            $ref: '#/components/schemas/AddressBody'
          type: array
        customer:
          $ref: '#/components/schemas/CustomerBody'
          description: The customer.
        next_cursor:
          description: Pass as `cursor` for the next page of orders; absent on the last page.
          type:
          - string
          - 'null'
        orders:
          description: |-
            Their orders in every store of the tenant, archived stores included,
            oldest first.
          items:
            $ref: '#/components/schemas/OrderBody'
          type: array
      required:
      - customer
      - addresses
      - orders
      type: object
    CustomerPageBody:
      description: One page of customers, newest first.
      properties:
        items:
          description: Customers on this page.
          items:
            $ref: '#/components/schemas/CustomerBody'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page; absent on the last page.
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    CustomerStatusBody:
      description: Customer lifecycle status.
      enum:
      - active
      - erased
      type: string
    DiscountRequest:
      additionalProperties: false
      description: |-
        A staff-approved fixed merchandise discount. Quoting or placing with it
        requires the `ecommerce.order.discount` permission on the acting identity.
      properties:
        amount_minor:
          description: |-
            1 to 999999999999999 minor units, and no more than the reservation's
            locked merchandise subtotal. Zero is not a discount: leave the object
            out for none.
          example: 150
          format: int64
          type: integer
        reason:
          description: '`promotion`, `goodwill`, `price_match` or `other`.'
          example: promotion
          type: string
      required:
      - amount_minor
      - reason
      type: object
    EraseCustomerRequest:
      additionalProperties: false
      description: An erasure request has no fields; send `{}`.
      type: object
    FieldIssue:
      description: |-
        One field-addressed validation issue (TASK-027, FR-1127).

        A validation error that names the input it belongs to lets a client
        build an error summary that links back to the offending field instead
        of guessing from a flat string. `field` is the request-body path,
        root-relative, with bracketed indices for sequence elements
        (`hostname`, `budget.amount.currency`,
        `ad_groups[2].ads[0].creative.placement`) — the same grammar the
        advertising capability matrix already speaks.
      properties:
        field:
          description: Root-relative path to the offending request field.
          type: string
        message:
          description: |-
            Why this field was rejected. Human-readable; `detail` stays the
            request-level summary and is never a replacement for it.
          type: string
      required:
      - field
      - message
      type: object
    FulfillmentBody:
      description: |-
        Goods recorded as handed over for an order. Immutable: a mistaken
        handover needs a returns workflow, not an edit.
      properties:
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        lines:
          description: Lines in position order.
          items:
            $ref: '#/components/schemas/FulfillmentLineBody'
          type: array
        method:
          description: How the goods left.
          example: pickup
          type: string
        order_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        recorded_at:
          description: When the handover was recorded.
          format: date-time
          type: string
        store_id:
          description: Store identifier.
          example: '7401234567890120000'
          type: string
      required:
      - id
      - store_id
      - order_id
      - method
      - lines
      - recorded_at
      type: object
    FulfillmentLineBody:
      description: One line of a fulfillment.
      properties:
        line_position:
          description: Zero-based position of the order line.
          example: 0
          format: int32
          type: integer
        quantity:
          description: Units handed over.
          example: 2
          format: int64
          type: integer
      required:
      - line_position
      - quantity
      type: object
    FulfillmentLineRequest:
      additionalProperties: false
      description: One line of a handover.
      properties:
        line_position:
          description: Zero-based position of the order line, as the API returns it.
          example: 0
          format: int32
          type: integer
        quantity:
          description: Units handed over, 1 to 10000.
          example: 2
          format: int64
          type: integer
      required:
      - line_position
      - quantity
      type: object
    FulfillmentPageBody:
      description: One page of an order's fulfillments, newest first.
      properties:
        items:
          description: Fulfillments on this page.
          items:
            $ref: '#/components/schemas/FulfillmentBody'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page; absent on the last page.
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    LocationBody:
      description: A stored stock location.
      properties:
        created_at:
          description: Creation time.
          format: date-time
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        name:
          description: Display name.
          type: string
        store_id:
          description: Store identifier.
          example: '7401234567890120000'
          type: string
      required:
      - id
      - store_id
      - name
      - created_at
      type: object
    LocationPageBody:
      description: One page of locations.
      properties:
        items:
          description: Locations on this page.
          items:
            $ref: '#/components/schemas/LocationBody'
          type: array
        next_after:
          description: Cursor for the next page.
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    MoneyBody:
      additionalProperties: false
      description: An amount in minor units with its currency.
      properties:
        amount_minor:
          description: Non-negative amount in the currency's minor unit.
          example: 4500
          format: int64
          type: integer
        currency:
          description: Upper-case ISO 4217 code.
          example: JPY
          type: string
      required:
      - amount_minor
      - currency
      type: object
    OrderBody:
      description: A stored order.
      properties:
        billing_address_id:
          description: The customer's address it bills to; null when none was named.
          example: '7401234567890120000'
          type:
          - string
          - 'null'
        cancel_reason:
          description: Why it was cancelled.
          type:
          - string
          - 'null'
        cancelled_at:
          description: Cancellation time.
          format: date-time
          type:
          - string
          - 'null'
        channel:
          description: '`web` or `pos`.'
          example: pos
          type: string
        currency:
          description: The store currency.
          example: JPY
          type: string
        customer_id:
          description: The customer who bought it; null for an anonymous sale.
          example: '7401234567890120000'
          type:
          - string
          - 'null'
        discount_minor:
          description: |-
            Fixed merchandise discount fixed at placement; 0 when none was
            granted.
          example: 150
          format: int64
          type: integer
        discount_reason:
          description: |-
            Why the discount was granted: `promotion`, `goodwill`, `price_match` or
            `other`; null when none was granted.
          example: promotion
          type:
          - string
          - 'null'
        fulfillment:
          $ref: '#/components/schemas/OrderFulfillmentBody'
          description: |-
            Where the order stands with its goods, from its fulfillments. Fulfillments
            do not change the order's `version`.
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        lines:
          description: Sold lines with their prices at placement.
          items:
            $ref: '#/components/schemas/OrderLineBody'
          type: array
        payment:
          $ref: '#/components/schemas/OrderPaymentBody'
          description: Where the order stands with its money, from its payments and refunds.
        placed_at:
          description: Placement time.
          format: date-time
          type: string
        reservation_id:
          description: The reservation it committed.
          example: '7401234567890120000'
          type: string
        returns:
          $ref: '#/components/schemas/OrderReturnsBody'
          description: |-
            Where the order stands with its returned goods, from its fulfillments and
            returns. Returns do not change the order's `version` either.
        shipping:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/OrderShippingBody'
            description: Selected shipping service snapshotted at placement; null when no method was selected.
        shipping_address_id:
          description: |-
            The customer's address it ships to; null when none was named. Read it
            through the customer's address routes.
          example: '7401234567890120000'
          type:
          - string
          - 'null'
        shipping_minor:
          description: Flat shipping charge, or 0 when no method was selected.
          example: 500
          format: int64
          type: integer
        status:
          description: '`placed` or `cancelled`.'
          example: placed
          type: string
        store_id:
          description: Store identifier.
          example: '7401234567890120000'
          type: string
        subtotal_minor:
          description: Sum of line totals, in minor units.
          example: 3600
          format: int64
          type: integer
        tax_destination:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TaxDestinationBody'
            description: |-
              Where it was taxed; null when `tax_mode` is `none`. Kept after the
              customer's erasure as a tax record.
        tax_lines:
          description: |-
            Tax owed per class, `standard`, then `reduced`, then `exempt`; empty when
            `tax_mode` is `none`.
          items:
            $ref: '#/components/schemas/OrderTaxLineBody'
          type: array
        tax_minor:
          description: |-
            Tax owed, in minor units: added to the net subtotal when `tax_mode` is
            `exclusive`, already inside it when `inclusive`, 0 when `none`.
          example: 266
          format: int64
          type: integer
        tax_mode:
          description: '`none`, `exclusive` or `inclusive`: the store''s setting at placement.'
          example: inclusive
          type: string
        tax_rounding:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RoundingBody'
            description: The store's rounding rule at placement; null when `tax_mode` is `none`.
        terminal_ref:
          description: Opaque terminal reference, POS only.
          type:
          - string
          - 'null'
        total_minor:
          description: |-
            Amount due: the subtotal, less `discount_minor`, plus `shipping_minor`, plus
            `tax_minor` when `tax_mode` is `exclusive`.
          example: 3600
          format: int64
          type: integer
        updated_at:
          description: Time of the last change.
          format: date-time
          type: string
        version:
          description: Starts at 1; name it when cancelling. Payments do not change it.
          format: int64
          type: integer
      required:
      - id
      - store_id
      - reservation_id
      - status
      - channel
      - currency
      - subtotal_minor
      - shipping_minor
      - discount_minor
      - tax_minor
      - total_minor
      - tax_mode
      - tax_lines
      - lines
      - placed_at
      - payment
      - fulfillment
      - returns
      - version
      - updated_at
      type: object
    OrderFulfillmentBody:
      description: An order's fulfillment status, as `OrderBody` carries it.
      properties:
        lines:
          description: Progress per order line, in position order.
          items:
            $ref: '#/components/schemas/OrderFulfillmentLineBody'
          type: array
        status:
          description: |-
            `unfulfilled`, `partially_fulfilled`, `fulfilled`, or `not_required` (a
            cancelled order nothing was handed over for).
          example: partially_fulfilled
          type: string
      required:
      - status
      - lines
      type: object
    OrderFulfillmentLineBody:
      description: One order line's fulfillment progress.
      properties:
        fulfilled_quantity:
          description: Units handed over so far.
          example: 2
          format: int64
          type: integer
        line_position:
          description: Zero-based position of the order line.
          example: 0
          format: int32
          type: integer
        remaining_quantity:
          description: Units still to hand over; 0 once the order is cancelled.
          example: 1
          format: int64
          type: integer
      required:
      - line_position
      - fulfilled_quantity
      - remaining_quantity
      type: object
    OrderLineBody:
      description: One sold line, as the catalog read at placement.
      properties:
        discount_minor:
          description: The fixed discount allocated to this line; 0 when none was granted.
          example: 100
          format: int64
          type: integer
        line_total_minor:
          description: |-
            `unit_price_minor × quantity`, the gross merchandise amount before any
            discount and before exclusive tax.
          format: int64
          type: integer
        location_id:
          description: Location the stock left.
          example: '7401234567890120000'
          type: string
        net_line_total_minor:
          description: '`line_total_minor - discount_minor`, the amount tax was charged on.'
          example: 3500
          format: int64
          type: integer
        options:
          additionalProperties:
            type: string
          description: Options at placement.
          propertyNames:
            type: string
          type: object
        position:
          description: |-
            Zero-based position of the line in the order: name it when
            fulfilling part of the order.
          example: 0
          format: int32
          type: integer
        product_id:
          description: Product sold.
          example: '7401234567890120000'
          type: string
        product_title:
          description: Product title at placement.
          type: string
        quantity:
          description: Units sold.
          format: int64
          type: integer
        sku:
          description: SKU at placement.
          type:
          - string
          - 'null'
        tax_class:
          description: The product's tax class at placement; null when the store charged no tax.
          example: reduced
          type:
          - string
          - 'null'
        tax_rate_ppm:
          description: The class's rate in parts per million; null when the store charged no tax.
          example: 80000
          format: int32
          type:
          - integer
          - 'null'
        unit_price_minor:
          description: Unit price at placement, in minor units.
          format: int64
          type: integer
        variant_id:
          description: Variant sold.
          example: '7401234567890120000'
          type: string
      required:
      - position
      - product_id
      - variant_id
      - location_id
      - product_title
      - options
      - unit_price_minor
      - quantity
      - line_total_minor
      - discount_minor
      - net_line_total_minor
      type: object
    OrderPageBody:
      description: One page of orders, newest first.
      properties:
        items:
          description: Orders on this page.
          items:
            $ref: '#/components/schemas/OrderBody'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page; absent on the last page.
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    OrderPaymentBody:
      description: An order's payment state.
      properties:
        due_minor:
          description: |-
            Still owed: `total_minor` less payments net of refunds; 0 once the
            order is cancelled.
          example: 0
          format: int64
          type: integer
        overpaid_minor:
          description: |-
            Paid beyond the total; only an online payment that arrived late can cause
            it, and it is refunded automatically.
          example: 0
          format: int64
          type: integer
        paid_minor:
          description: Sum of payments, in minor units.
          example: 1800
          format: int64
          type: integer
        pending_minor:
          description: |-
            Of what is due, what a pending online payment attempt holds: no
            other payment may take it.
          example: 0
          format: int64
          type: integer
        pending_refund_minor:
          description: |-
            Money on its way back through the payment provider; it still stands paid
            until the provider confirms.
          example: 0
          format: int64
          type: integer
        refunded_minor:
          description: Sum of refunds, in minor units.
          example: 0
          format: int64
          type: integer
        status:
          description: |-
            `unpaid`, `partially_paid`, `paid` (the whole total stands paid, or nothing
            is owed), `partially_refunded` or `refunded` (every payment returned in
            full).
          example: paid
          type: string
      required:
      - status
      - paid_minor
      - refunded_minor
      - due_minor
      - pending_minor
      - pending_refund_minor
      - overpaid_minor
      type: object
    OrderReturnLineBody:
      description: One order line's return progress.
      properties:
        line_position:
          description: Zero-based position of the order line.
          example: 0
          format: int32
          type: integer
        restocked_quantity:
          description: Units of them back in saleable stock.
          example: 1
          format: int64
          type: integer
        returnable_quantity:
          description: |-
            Units still returnable: handed over but not yet returned; 0 once
            the order is cancelled.
          example: 1
          format: int64
          type: integer
        returned_quantity:
          description: Units received back so far.
          example: 2
          format: int64
          type: integer
      required:
      - line_position
      - returned_quantity
      - restocked_quantity
      - returnable_quantity
      type: object
    OrderReturnsBody:
      description: An order's return summary, as `OrderBody` carries it.
      properties:
        lines:
          description: Progress per order line, in position order.
          items:
            $ref: '#/components/schemas/OrderReturnLineBody'
          type: array
      required:
      - lines
      type: object
    OrderShippingBody:
      description: A selected shipping method snapshotted on an order or quote.
      properties:
        method_id:
          description: Selected method id.
          example: '7401234567890120000'
          type: string
        name:
          description: Display name at quote or placement.
          type: string
        tax_class:
          description: The method's tax class; null in untaxed mode.
          example: standard
          type:
          - string
          - 'null'
        tax_rate_ppm:
          description: The class's rate in parts per million; null in untaxed mode.
          example: 100000
          format: int32
          type:
          - integer
          - 'null'
      required:
      - method_id
      - name
      type: object
    OrderTaxLineBody:
      description: The tax an order owes on one class.
      properties:
        amount_minor:
          description: |-
            The class's line totals as priced, including any selected shipping charge in
            its class, tax included when `tax_mode` is `inclusive`.
          example: 3600
          format: int64
          type: integer
        rate_ppm:
          description: The rate in parts per million.
          example: 80000
          format: int32
          type: integer
        tax_class:
          description: '`standard`, `reduced` or `exempt`.'
          example: reduced
          type: string
        tax_minor:
          description: Tax owed on them.
          example: 266
          format: int64
          type: integer
      required:
      - tax_class
      - rate_ppm
      - amount_minor
      - tax_minor
      type: object
    PaymentBody:
      description: A recorded payment with the refunds taken from it.
      properties:
        amount_minor:
          description: Amount received, in minor units.
          example: 1800
          format: int64
          type: integer
        attempt_id:
          description: The payment attempt a provider payment settled; null for manual ones.
          type:
          - string
          - 'null'
        currency:
          description: The order's currency.
          example: JPY
          type: string
        external_ref:
          description: The reference given when it was recorded; null when none was.
          example: APPROVAL-123456
          type:
          - string
          - 'null'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        method:
          description: How it was taken.
          example: cash
          type: string
        order_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        pending_refund_minor:
          description: Of it, what is on its way back through the provider.
          example: 0
          format: int64
          type: integer
        recorded_at:
          description: When it was recorded.
          format: date-time
          type: string
        refund_requests:
          description: |-
            Refunds asked of the provider for a provider payment, in any status;
            a succeeded one is also in `refunds`.
          items:
            $ref: '#/components/schemas/RefundRequestBody'
          type: array
        refundable_minor:
          description: |-
            What may still be refunded from it, in minor units: its amount less
            its refunds and pending refund requests.
          example: 1800
          format: int64
          type: integer
        refunds:
          description: Refunds taken from it, oldest first.
          items:
            $ref: '#/components/schemas/RefundBody'
          type: array
        source:
          description: |-
            `manual` (a person recorded it) or `provider` (the payment provider
            reported it; method `online`).
          example: manual
          type: string
      required:
      - id
      - order_id
      - method
      - source
      - amount_minor
      - currency
      - recorded_at
      - refunds
      - refundable_minor
      - pending_refund_minor
      - refund_requests
      type: object
    PaymentListBody:
      description: |-
        Every payment of an order, oldest first. An order has at most 100, so
        the list is never paged.
      properties:
        items:
          description: The payments, each with its refunds.
          items:
            $ref: '#/components/schemas/PaymentBody'
          type: array
      required:
      - items
      type: object
    PlaceOrderRequest:
      additionalProperties: false
      description: |-
        A request to turn a held reservation into an order. Lines and prices come
        from the reservation and the catalog, never from the client.
      properties:
        billing_address_id:
          description: An active address of that customer to bill to; needs `customer_id`.
          example: '7401234567890120000'
          type:
          - string
          - 'null'
        channel:
          description: '`web` or `pos`.'
          example: pos
          type: string
        customer_id:
          description: |-
            An active customer of the tenant buying; leave out for an anonymous
            sale. Only the id is kept with the order.
          example: '7401234567890120000'
          type:
          - string
          - 'null'
        discount:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DiscountRequest'
            description: |-
              Staff-approved fixed merchandise discount to allocate across the
              reservation's lines before tax. Requires the
              `ecommerce.order.discount` permission. Leave out or send null for
              none; it never reduces shipping.
        expected_pricing_fingerprint:
          description: |-
            The `pricing_fingerprint` a quote returned for the same reservation
            and customer/address context. Leave it out or send null to place at
            current prices with no precondition, as before.
          example: v1:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          type:
          - string
          - 'null'
        reservation_id:
          description: A held, unexpired reservation of the store.
          example: '7401234567890120000'
          type: string
        shipping_address_id:
          description: |-
            An active address of that customer to ship to; needs `customer_id`.
            Only the id is kept with the order.
          example: '7401234567890120000'
          type:
          - string
          - 'null'
        shipping_method_id:
          description: |-
            An active shipping method of the store. Requires `customer_id` and
            `shipping_address_id`. Leave out or send null to place with no shipping.
          example: '7401234567890120000'
          type:
          - string
          - 'null'
        terminal_ref:
          description: Opaque terminal reference, 1 to 64 characters; `pos` only.
          example: till-1
          type:
          - string
          - 'null'
      required:
      - reservation_id
      - channel
      type: object
    ProblemDetail:
      allOf:
      - description: |-
          RFC 9457 extension members for problem classes that carry
          structured extras (the disconnect conflict names its blockers,
          for example). Flattened onto the JSON object exactly as the RFC
          prescribes; carrying them here keeps the error-enrichment layer
          from stripping them. Absent otherwise.
        type:
        - object
        - 'null'
      - properties:
          detail:
            description: Human-readable explanation of this specific occurrence.
            type: string
          fields:
            description: |-
              The fields a validation rejection names (TASK-027, FR-1127), as an
              RFC 9457 extension member. Present only when the error is
              field-addressed; the human-readable `detail` is never removed from
              an error that grows field addressing.
            items:
              $ref: '#/components/schemas/FieldIssue'
            type:
            - array
            - 'null'
          instance:
            description: URI of the offending resource, if any.
            type:
            - string
            - 'null'
          reason:
            description: |-
              Machine-readable reason for statuses that carry one (e.g. tenant
              suspension); absent otherwise.
            type:
            - string
            - 'null'
          status:
            description: HTTP status code (mirrors the response code).
            format: int32
            minimum: 0
            type: integer
          title:
            description: Short, human-readable, stable title.
            type: string
          trace_id:
            description: |-
              Correlates with the trace in OpenObserve: the W3C trace id of the
              span serving the request (the same trace the `traceparent` response
              header references), falling back to the request id when the request
              ran outside any OpenTelemetry context.
            type:
            - string
            - 'null'
          type:
            description: Stable URI identifying the error class.
            example: https://sanvi.dev/problems/bad-request
            type: string
        required:
        - type
        - title
        - status
        - detail
        type: object
      description: RFC 9457 problem detail. This is the only error body the API produces.
    ProductBody:
      description: A stored product.
      properties:
        created_at:
          description: Creation time.
          format: date-time
          type: string
        description:
          description: Long description.
          type:
          - string
          - 'null'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        import_overrides:
          description: |-
            Field paths a merchant changed that the next connector re-import will
            replace. Empty for first-party products.
          items:
            type: string
          type: array
        status:
          $ref: '#/components/schemas/ProductStatusBody'
          description: Lifecycle status.
        store_id:
          description: Store id (decimal Snowflake).
          example: '7401234567890120000'
          type: string
        tax_class:
          description: '`standard`, `reduced` or `exempt`.'
          example: standard
          type: string
        title:
          description: Display title.
          type: string
        updated_at:
          description: Time of the last change, or the creation time.
          format: date-time
          type: string
        variants:
          description: Variants in display order.
          items:
            $ref: '#/components/schemas/VariantBody'
          type: array
        version:
          description: Starts at 1 and grows with every change; edits send the version they read.
          example: 1
          format: int64
          type: integer
      required:
      - id
      - store_id
      - title
      - status
      - tax_class
      - variants
      - created_at
      - version
      - updated_at
      - import_overrides
      type: object
    ProductPageBody:
      description: One page of products, newest first.
      properties:
        items:
          description: Products on this page.
          items:
            $ref: '#/components/schemas/ProductBody'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page; absent on the last page.
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    ProductStatusBody:
      description: Product lifecycle status.
      enum:
      - draft
      - active
      - archived
      type: string
    PublicProductPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PublicProductView'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page; absent on the last page.
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    PublicProductView:
      properties:
        description:
          type:
          - string
          - 'null'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        price_max_minor:
          description: Most expensive sellable variant price, minor units.
          format: int64
          type: integer
        price_min_minor:
          description: Cheapest sellable variant price, minor units.
          format: int64
          type: integer
        title:
          type: string
        variants:
          description: Sellable variants (active product, non-archived variants).
