          example: order_cancelled
          type: string
        recorded_at:
          description: When it was recorded.
          format: date-time
          type: string
      required:
      - id
      - payment_id
      - order_id
      - amount_minor
      - currency
      - reason
      - recorded_at
      type: object
    RefundPaymentRequest:
      additionalProperties: false
      description: Money returned from one payment, the way it was taken.
      properties:
        amount_minor:
          description: |-
            Amount returned, in minor units of the order's currency; at most what
            is left of the payment.
          example: 1800
          format: int64
          type: integer
        reason:
          description: |-
            `customer_request`, `returned_goods`, `order_cancelled`, `duplicate`,
