    PublicStoreView:
      description: The public catalog surfaces one page of products.
      properties:
        currency:
          description: The store's single currency (ISO 4217); every price renders in it.
          type: string
        name:
          description: Display name of the published store.
          type: string
      required:
      - name
      - currency
      type: object
    PublicVariantView:
      properties:
        currency:
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        options:
          additionalProperties:
            type: string
          description: 'Option name to value (for example `size: m`).'
          propertyNames:
            type: string
          type: object
        purchasable:
          description: |-
            Whether the variant can be reserved right now (server-computed
