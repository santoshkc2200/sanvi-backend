          items:
            $ref: '#/components/schemas/ReturnLineRequest'
          type: array
        reason:
          description: '`customer_request`, `damaged`, `incorrect_item` or `other`.'
          example: customer_request
          type: string
      required:
      - reason
      - lines
      type: object
    RefundBody:
      description: Money returned from a payment, the way it was taken.
      properties:
        amount_minor:
          description: Amount returned, in minor units.
          example: 500
          format: int64
          type: integer
        currency:
          description: The order's currency.
          example: JPY
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        order_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        payment_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        reason:
          description: |-
            `customer_request`, `returned_goods`, `order_cancelled`, `duplicate`,
