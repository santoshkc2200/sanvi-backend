        amount_minor:
          description: Amount asked back, in minor units.
          example: 500
          format: int64
          type: integer
        created_at:
          description: When it was asked.
          format: date-time
          type: string
        currency:
          description: The order's currency.
          example: JPY
          type: string
        failure_code:
          description: Why the provider refused it, when it did.
          type:
          - string
          - 'null'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        order_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        payment_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        reason:
          description: Why.
          example: customer_request
          type: string
        settled_at:
          description: When the provider settled it.
          format: date-time
          type:
          - string
          - 'null'
        status:
          description: '`pending`, `succeeded` or `failed`.'
          example: pending
          type: string
      required:
      - id
      - payment_id
      - order_id
      - amount_minor
      - currency
      - reason
      - status
      - created_at
      type: object
    ReturnBody:
      description: |-
        Goods recorded as received back for an order. Immutable: what arrived
        is a fact; correcting a restock needs a manual stock adjustment, not an
        edit of the receipt.
      properties:
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        lines:
          description: Lines in position order.
          items:
            $ref: '#/components/schemas/ReturnLineBody'
          type: array
        order_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        reason:
          description: Why they came back.
          example: customer_request
          type: string
        recorded_at:
          description: When the receipt was recorded.
          format: date-time
          type: string
        store_id:
          description: Store identifier.
          example: '7401234567890120000'
          type: string
      required:
      - id
      - store_id
      - order_id
      - reason
      - lines
      - recorded_at
      type: object
    ReturnLineBody:
      description: One line of a return.
      properties:
        line_position:
          description: Zero-based position of the order line.
          example: 0
          format: int32
          type: integer
        quantity:
          description: Units received back.
          example: 2
          format: int64
          type: integer
        restock_location_id:
          description: Where the restocked units landed; absent when nothing was restocked.
          example: '7401234567890120000'
          type:
          - string
          - 'null'
        restock_quantity:
          description: Units of them back in saleable stock.
          example: 1
          format: int64
          type: integer
      required:
      - line_position
      - quantity
      - restock_quantity
      type: object
    ReturnLineRequest:
      additionalProperties: false
      description: One line of a receipt.
      properties:
        line_position:
          description: Zero-based position of the order line, as the API returns it.
          example: 0
          format: int32
          type: integer
        quantity:
          description: Units received back, 1 to 10000.
          example: 2
          format: int64
          type: integer
        restock_location_id:
          description: |-
            Where the restocked units land: any stock location of the store,
            not only the line's original one. Required when and only when
            `restock_quantity` is positive.
          example: '7401234567890120000'
          type:
          - string
          - 'null'
        restock_quantity:
          description: Units of them that go back into saleable stock, 0 to `quantity`.
          example: 1
          format: int64
          type: integer
      required:
      - line_position
      - quantity
      - restock_quantity
      type: object
    ReturnPageBody:
      description: One page of an order's returns, newest first.
      properties:
        items:
          description: Returns on this page.
          items:
            $ref: '#/components/schemas/ReturnBody'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page; absent on the last page.
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    RoundingBody:
      additionalProperties: false
      description: How tax is rounded.
      properties:
        level:
          description: '`line` rounds each line''s tax; `order` rounds once per tax class.'
          example: order
          type: string
        mode:
          description: '`half_up` or `down`.'
          example: down
          type: string
      required:
      - level
      - mode
      type: object
    SetStoreTaxRequest:
      additionalProperties: false
      description: A store's tax settings, replacing the stored ones.
      properties:
        mode:
          description: |-
            `none`, `exclusive` (tax added on top of prices) or `inclusive`
            (prices contain the tax).
          example: inclusive
          type: string
        rates_ppm:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TaxRatesBody'
            description: Required unless `mode` is `none`, and refused when it is.
        rounding:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RoundingBody'
            description: Required unless `mode` is `none`, and refused when it is.
        version:
          description: The `version` the change is based on, as last read.
          example: 1
          format: int64
          type: integer
      required:
      - version
      - mode
      type: object
    ShippingMethodBody:
      description: A stored shipping method.
      properties:
        amount_minor:
          description: Flat charge in minor units.
          example: 500
          format: int64
          type: integer
        created_at:
          description: Creation time.
          format: date-time
          type: string
        currency:
          description: Store's currency.
          example: USD
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        name:
          description: Display name.
          example: Standard delivery
          type: string
        status:
          $ref: '#/components/schemas/ShippingMethodStatusBody'
          description: Lifecycle status.
        store_id:
          description: Store id.
          example: '7401234567890120001'
          type: string
        tax_class:
          description: Tax class for rate application.
          example: standard
          type: string
        updated_at:
          description: Time of the last change, or the creation time.
          format: date-time
          type: string
        version:
          description: Starts at 1 and grows with every change.
          example: 1
          format: int64
          type: integer
      required:
      - id
      - store_id
      - name
      - currency
      - amount_minor
      - tax_class
      - status
      - version
      - created_at
      - updated_at
      type: object
    ShippingMethodPageBody:
      description: One page of shipping methods, newest first.
      properties:
        items:
          description: Methods on this page.
          items:
            $ref: '#/components/schemas/ShippingMethodBody'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page; absent on the last page.
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    ShippingMethodStatusBody:
      description: Shipping method lifecycle status.
      enum:
      - active
      - archived
      type: string
    ShopperCheckoutLineView:
      properties:
        line_total_minor:
          description: '`unit_price_minor * quantity` as the server priced it.'
          format: int64
          type: integer
        quantity:
          format: int64
          type: integer
        unit_price_minor:
          format: int64
          type: integer
        variant_id:
          type: string
      required:
      - variant_id
      - unit_price_minor
      - quantity
      - line_total_minor
      type: object
    ShopperCheckoutView:
      description: |-
        The checkout-start answer: the only pricing a checkout page may show,
        plus the opaque token that carries it to placement. Every amount is
        the service quote's (the approved terms), and `expires_at` is the
        reservation's server timestamp; the TTL is rendered from it, never
        assumed.
      properties:
        checkout:
          description: Opaque signed checkout summary; present it back at placement.
          type: string
        currency:
          type: string
        expires_at:
          description: RFC 3339 instant the hold expires at (server clock).
          format: date-time
          type: string
        lines:
          items:
            $ref: '#/components/schemas/ShopperCheckoutLineView'
          type: array
        shipping_method_name:
          description: |-
            The service's display name for the selected shipping method, when
            one was quoted. The fingerprint itself never travels outside the
            signed token.
          type:
          - string
          - 'null'
        shipping_minor:
          description: Quoted shipping charge, minor units (0 with no method selected).
          format: int64
          type: integer
        subtotal_minor:
          description: Quoted merchandise subtotal, minor units, in `currency`.
          format: int64
          type: integer
        tax_minor:
          description: Quoted tax owed, minor units.
          format: int64
          type: integer
        total_minor:
          description: 'Quoted amount due, minor units: what placement will charge.'
          format: int64
          type: integer
      required:
      - checkout
      - currency
      - expires_at
      - lines
      - subtotal_minor
      - shipping_minor
      - tax_minor
      - total_minor
      type: object
    ShopperGuestAddress:
      properties:
        city:
          type: string
        country:
          description: ISO 3166-1 alpha-2, upper-case.
          type: string
        line1:
          type: string
        line2:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        postal_code:
          type:
          - string
          - 'null'
        recipient:
          description: Who receives the order; defaults to the contact's name.
          type:
          - string
          - 'null'
        region:
          type:
          - string
          - 'null'
      required:
      - line1
      - city
      - country
      type: object
    ShopperGuestContact:
      properties:
        email:
          description: Contact email; order and customer of record.
          type: string
        name:
          description: Full name, 1–120 characters after trimming.
          type: string
        phone:
          type:
          - string
          - 'null'
      required:
      - name
      - email
      type: object
    ShopperGuestLine:
      properties:
        quantity:
          description: 1–10 000 (the reservation contract's bound).
          format: int64
          type: integer
        variant_id:
          description: Variant id (decimal Snowflake) from the catalog.
          type: string
      required:
      - variant_id
      - quantity
      type: object
    ShopperOrderConfirmationView:
      properties:
        credential:
          description: |-
            The purchase credential: short-lived, scoped to this order, the
            shopper's only durable access. Treat as a bearer secret.
          type: string
        credential_expires_at:
          description: RFC 3339 instant the credential expires (server clock).
          format: date-time
          type: string
        order:
          $ref: '#/components/schemas/ShopperOrderView'
      required:
      - order
      - credential
      - credential_expires_at
      type: object
    ShopperOrderLineView:
      properties:
        line_total_minor:
          format: int64
          type: integer
        options:
          additionalProperties:
            type: string
          propertyNames:
            type: string
          type: object
        position:
          format: int32
          type: integer
        product_title:
          type: string
        quantity:
          format: int64
          type: integer
        sku:
          type:
          - string
          - 'null'
        unit_price_minor:
          format: int64
          type: integer
      required:
      - position
      - product_title
      - options
      - unit_price_minor
      - quantity
      - line_total_minor
      type: object
    ShopperOrderPaymentView:
      properties:
        due_minor:
          format: int64
          type: integer
        paid_minor:
          format: int64
          type: integer
        refunded_minor:
          format: int64
          type: integer
        status:
          description: |-
            The ledger state: `unpaid | partially_paid | paid |
            partially_refunded | refunded`.
          type: string
      required:
      - status
      - paid_minor
      - due_minor
      - refunded_minor
      type: object
    ShopperOrderView:
      description: |-
        The shopper projection of a placed order — the summary of record.
        Internal bookkeeping (customer, addresses, reservation, versions,
        location ids) is projected out.
      properties:
        cancel_reason:
          type:
          - string
          - 'null'
        cancelled_at:
          format: date-time
          type:
          - string
          - 'null'
        currency:
          type: string
        fulfillment_status:
          description: |-
            `unfulfilled | partially_fulfilled | fulfilled | not_required` —
            the coarse state only; no tracking or delivery promise exists.
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        lines:
          description: Immutable lines as the service snapshot them at placement.
          items:
            $ref: '#/components/schemas/ShopperOrderLineView'
          type: array
        payment:
          $ref: '#/components/schemas/ShopperOrderPaymentView'
        placed_at:
          description: RFC 3339 instant the order was placed (server clock).
          format: date-time
          type: string
        status:
          description: '`placed | cancelled`.'
          type: string
        subtotal_minor:
          format: int64
          type: integer
        tax_minor:
          format: int64
          type: integer
        total_minor:
          format: int64
          type: integer
      required:
      - id
      - status
      - currency
      - lines
      - subtotal_minor
      - tax_minor
      - total_minor
      - payment
      - fulfillment_status
      - placed_at
      type: object
    ShopperPaymentAttemptView:
      properties:
        expires_at:
          description: RFC 3339 instant the pending attempt expires at, when pending.
          format: date-time
          type:
          - string
          - 'null'
        failure_code:
          description: Why an attempt failed (`card_declined`, …), when it did.
          type:
          - string
          - 'null'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        redirect_url:
          description: |-
            The hosted provider page to navigate to; present only while the
            attempt is pending and this view comes from a start (or a replay
            of one). Never sent by the status views.
          type:
          - string
          - 'null'
        status:
          description: '`pending | succeeded | failed | cancelled | expired`.'
          type: string
      required:
      - id
      - status
      type: object
    ShopperPaymentStartView:
      properties:
        attempt:
          $ref: '#/components/schemas/ShopperPaymentAttemptView'
      required:
      - attempt
      type: object
    ShopperPaymentStatusView:
      properties:
        attempt:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ShopperPaymentAttemptView'
            description: The latest attempt, or `None` before the first one starts.
      type: object
    ShopperPlaceOrderRequest:
      properties:
        checkout:
          description: The opaque checkout token checkout-start returned.
          type: string
      required:
      - checkout
      type: object
    ShopperReleaseCheckoutRequest:
      properties:
        checkout:
          description: The opaque checkout token to release the hold for.
          type: string
      required:
      - checkout
      type: object
    ShopperShippingMethodView:
      description: |-
        One shipping method a checkout may select: the store's active methods
        only, priced by the service for display. Selection prices through the
        quote; this list never carries approval.
      properties:
        amount_minor:
          description: Flat charge, minor units, in the store's currency.
          format: int64
          type: integer
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        name:
          type: string
        tax_class:
          description: Tax class for rate application (`standard`, `reduced`, `exempt`).
          type: string
      required:
      - id
      - name
      - amount_minor
      - tax_class
      type: object
    ShopperStartCheckoutRequest:
      description: |-
        Guest checkout start: contact + address + identifier lines. No prices,
        no totals — the server prices everything via the service's quote.
      properties:
        address:
          $ref: '#/components/schemas/ShopperGuestAddress'
        contact:
          $ref: '#/components/schemas/ShopperGuestContact'
        lines:
          items:
            $ref: '#/components/schemas/ShopperGuestLine'
          type: array
        shipping_method_id:
          description: |-
            Shipping method (decimal Snowflake) chosen from the checkout's
            shipping-method list, or absent for no shipping. The quote prices
            it against the guest's address; the fingerprint and amounts are
            signed into the checkout claims, never taken from the browser.
          type:
          - string
          - 'null'
      required:
      - contact
      - address
      - lines
      type: object
    StockLevelBody:
      description: Stock level for a variant at a location.
      properties:
        available:
          description: Available stock.
          format: int64
          type: integer
        held:
          description: Quantity held by active reservations.
          format: int64
          type: integer
        location_id:
          description: Location id.
          type: string
        on_hand:
          description: On-hand balance.
          format: int64
          type: integer
        safety_stock:
          description: Safety buffer.
          format: int64
          type: integer
        variant_id:
          description: Variant id.
          type: string
      required:
      - location_id
      - variant_id
      - on_hand
      - safety_stock
      - held
      - available
      type: object
    StockPageBody:
      description: One page of stock levels.
      properties:
        items:
          description: Stock levels on this page.
          items:
            $ref: '#/components/schemas/StockLevelBody'
          type: array
        next_after:
          description: Cursor for the next page.
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    StoreBody:
      description: A stored store.
      properties:
        created_at:
          description: Creation time.
          format: date-time
          type: string
        currency:
          description: Currency of every price in the store.
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        name:
          description: Display name.
          type: string
        slug:
          description: URL-safe handle, unique in the tenant.
          type: string
        status:
          $ref: '#/components/schemas/StoreStatusBody'
          description: Lifecycle status.
        tax:
          $ref: '#/components/schemas/StoreTaxBody'
          description: Tax settings orders are placed under.
        timezone:
          description: IANA timezone name.
          type: string
        updated_at:
          description: Time of the last change, or the creation time.
          format: date-time
          type: string
        version:
          description: Starts at 1 and grows with every change; edits send the version they read.
          example: 1
          format: int64
          type: integer
      required:
      - id
      - name
      - slug
      - currency
      - timezone
      - status
      - tax
      - created_at
      - version
      - updated_at
      type: object
    StorePageBody:
      description: One page of stores, newest first.
      properties:
        items:
          description: Stores on this page.
          items:
            $ref: '#/components/schemas/StoreBody'
          type: array
        next_cursor:
          description: Pass as `cursor` for the next page; absent on the last page.
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    StoreStatusBody:
      description: Store lifecycle status.
      enum:
      - active
      - archived
      type: string
    StoreTaxBody:
      description: A store's tax settings.
      properties:
        mode:
          description: '`none`, `exclusive` or `inclusive`.'
          example: inclusive
          type: string
        rates_ppm:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TaxRatesBody'
            description: Absent when `mode` is `none`.
        rounding:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RoundingBody'
            description: Absent when `mode` is `none`.
      required:
      - mode
      type: object
    StoreVersionRequest:
      additionalProperties: false
      description: The version an archive or restore is based on.
      properties:
        version:
          description: The `version` as last read.
          example: 1
          format: int64
          type: integer
      required:
      - version
      type: object
    TaxDestinationBody:
      description: Where an order was taxed.
      properties:
        country:
          description: The destination country; null when the order named no address.
          example: US
          type:
          - string
          - 'null'
        region:
          description: |-
            The region of the zone that decided the rates, as the store names it (never
            the address's own text); null unless a regional zone matched.
          example: CA
          type:
          - string
          - 'null'
        source:
          description: |-
            `shipping` or `billing`: the address whose place decided the rates; null
            when the order named none.
          example: shipping
          type:
          - string
          - 'null'
        zone:
          description: |-
            `zone` (a zone covered the destination), `outside` (none did; the store's
            `outside_zones` rule applied) or `store` (no address; the store's own rates
            applied).
          example: zone
          type: string
      required:
      - zone
      type: object
    TaxRatesBody:
      additionalProperties: false
      description: Tax rates in parts per million (10% is `100000`); `exempt` is always 0.
      properties:
        reduced:
          description: |-
            Rate of the `reduced` class, 0 to 500000; the standard rate when the
            store has no reduced rate.
          example: 80000
          format: int64
          type: integer
        standard:
          description: Rate of the `standard` class, 0 to 500000.
          example: 100000
          format: int64
          type: integer
      required:
      - standard
      - reduced
      type: object
    UpdateCustomerRequest:
      additionalProperties: false
      description: |-
        New contact fields for a customer. They replace all three stored ones: a
        field left out or null is cleared. At least one is required.
      properties:
        email:
          description: Email address, unique among the tenant's active customers ignoring case.
          example: aiko@example.jp
          type:
          - string
          - 'null'
        name:
          description: Display name, 1 to 120 characters.
          example: Aiko Tanaka
          type:
          - string
          - 'null'
        phone:
          description: Phone number in E.164 form.
          example: '+819012345678'
          type:
          - string
          - 'null'
        version:
          description: The `version` the edit is based on, as last read.
          example: 1
          format: int64
          type: integer
      required:
      - version
      type: object
    UpdateProductRequest:
      additionalProperties: false
      description: A full replacement of a product's editable fields.
      properties:
        acknowledge_import_overwrite:
          description: |-
            Apply changes to fields a connector re-import will replace. Without it,
            such an edit is refused with `ecommerce/import-overwrite-warning`.
          type: boolean
        description:
          description: Long description; leaving it out clears it.
          type:
          - string
          - 'null'
        status:
          description: '`draft`, `active` or `archived`.'
          example: active
          type: string
        tax_class:
          description: '`standard`, `reduced` or `exempt`; leaving it out keeps the current class.'
          example: reduced
          type:
          - string
          - 'null'
        title:
          description: Display title, 1 to 255 characters.
          type: string
        variants:
          description: Every existing variant by `id`, plus new ones without an `id`.
          items:
            $ref: '#/components/schemas/UpdateVariantRequest'
          type: array
        version:
          description: The `version` the edit is based on, as last read.
          example: 1
          format: int64
          type: integer
      required:
      - version
      - title
      - status
      - variants
      type: object
    UpdateStoreRequest:
      additionalProperties: false
      description: New values for a store's editable fields. The slug and currency are fixed.
      properties:
        name:
          description: Display name, 1 to 120 characters.
          example: Tokyo flagship
          type: string
        timezone:
          description: IANA timezone name.
          example: Asia/Tokyo
          type: string
        version:
          description: The `version` the edit is based on, as last read.
          example: 1
          format: int64
          type: integer
      required:
      - version
      - name
      - timezone
      type: object
    UpdateVariantRequest:
      additionalProperties: false
      description: An edited or new variant.
      properties:
        archived:
          description: Withdraw the variant from sale; existing holds still commit.
          type: boolean
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type:
          - string
          - 'null'
        options:
          additionalProperties:
            type: string
          description: Up to 3 option names mapped to values.
          propertyNames:
            type: string
          type: object
        price:
          $ref: '#/components/schemas/MoneyBody'
          description: Unit price, in the store's currency.
        sku:
          description: Up to 64 characters without whitespace, unique within the store.
          type:
          - string
          - 'null'
      required:
      - price
      type: object
    VariantBody:
      description: A stored variant.
      properties:
        archived:
          description: Withdrawn from sale; existing holds may still be committed.
          type: boolean
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        options:
          additionalProperties:
            type: string
          description: Option name to value.
          propertyNames:
            type: string
          type: object
        price:
          $ref: '#/components/schemas/MoneyBody'
          description: Unit price.
        sku:
          description: Stock-keeping unit.
          type:
          - string
          - 'null'
      required:
      - id
      - options
      - price
      - archived
      type: object
    VariantRequest:
      additionalProperties: false
      description: A new variant.
      properties:
        options:
          additionalProperties:
            type: string
          description: Up to 3 option names mapped to values.
          example:
            size: M
          propertyNames:
            type: string
          type: object
        price:
          $ref: '#/components/schemas/MoneyBody'
          description: Unit price.
        sku:
          description: Up to 64 characters without whitespace, unique within the store.
          example: SHIRT-M
          type:
          - string
          - 'null'
      required:
      - price
      type: object
info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/public/ecommerce/checkout:
    post:
      operationId: public_ecommerce_checkout_start
      parameters:
      - description: One key per checkout intent; reused across retries of the same intent, re-minted after a payload edit
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - description: Host override for server-side callers; defaults to the request Host
        in: query
        name: host
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopperStartCheckoutRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperCheckoutView'
          description: The held, quoted checkout summary
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Validation refusal (bounds, ids, duplicate lines)
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No store is available for this host
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stock unavailable on one or more lines (`lines` extension; nothing held), or the quote refused (reservation expired, address archived)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The quote refused (destination not served, total too large)
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service answered unexpectedly
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service is not configured or unreachable
      summary: |-
        `POST /api/v1/public/ecommerce/checkout` — guest checkout start with an
        `Idempotency-Key`: validates the guest contact + address, reuses or
        creates the guest customer and address, picks reservation locations
        from live stock, holds the reservation and then prices the hold with
        the service's quote. The response is the only pricing a checkout page
        may show — the quoted totals, with the fingerprint bound inside the
        opaque `checkout` token that dies with the hold. A failed quote
        releases the fresh hold best-effort. Refusals: 409
        `ecommerce/insufficient-stock` (with `lines` indexes; nothing is
        held), the quote's own typed 409/422 problems, 400 validation.
      tags:
      - product_access
  /api/v1/public/ecommerce/checkout/release:
    post:
      operationId: public_ecommerce_checkout_release
      parameters:
      - description: Host override for server-side callers; defaults to the request Host
        in: query
        name: host
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopperReleaseCheckoutRequest'
        required: true
      responses:
        '204':
          description: Released (or already released, committed, or expired)
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The checkout reference is not valid
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'Checkout terms need re-approval (`checkout-refresh-required`: a legacy pre-quote token cannot be released; its hold expires)'
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service answered unexpectedly
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service is not configured or unreachable
      summary: |-
        `POST /api/v1/public/ecommerce/checkout/release` — releases the hold a
        checkout token names (abandonment path). Idempotent; accepts tokens
        whose hold already expired.
      tags:
      - product_access
  /api/v1/public/ecommerce/orders:
    post:
      operationId: public_ecommerce_order_place
      parameters:
      - description: One key per placement intent; replayed intents return the original order
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - description: Host override for server-side callers; defaults to the request Host
        in: query
        name: host
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopperPlaceOrderRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperOrderConfirmationView'
          description: The placed order (a replayed intent returns the original)
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The checkout reference is not valid
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No store for this host
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'Checkout expired, checkout terms need re-approval (`checkout-refresh-required`: a legacy pre-quote token), prices changed, reservation expired or already ordered (typed problem)'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Upstream refusal (total too large, destination not served)
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service answered unexpectedly
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service is not configured or unreachable
      summary: |-
        `POST /api/v1/public/ecommerce/orders` — place the order from the held
        reservation the checkout token names, with an `Idempotency-Key`. The
        service snapshots lines, prices and tax; a price drift against the
        checkout summary is refused (`ecommerce/price-changed`) and the fresh
        order cancelled. Success returns the order summary of record plus the
        purchase credential.
      tags:
      - product_access
  /api/v1/public/ecommerce/orders/{order_id}:
    get:
      operationId: public_ecommerce_order_get
      parameters:
      - description: Order id (decimal Snowflake); authorizes nothing alone
        in: path
        name: order_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: The purchase credential minted at placement
        in: query
        name: credential
        required: true
        schema:
          type: string
      - description: Host override for server-side callers; defaults to the request Host
        in: query
        name: host
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperOrderView'
          description: The order summary of record
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The credential is absent, invalid or expired (distinguished by problem type)
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service answered unexpectedly
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service is not configured or unreachable
      summary: |-
        `GET /api/v1/public/ecommerce/orders/{order_id}` — the credential-
        scoped order summary. The credential travels in the `credential` query
        parameter (the status link is a plain URL); an absent, invalid or
        expired credential renders 401 and never reveals whether the order
        exists.
      tags:
      - product_access
  /api/v1/public/ecommerce/orders/{order_id}/cancel:
    post:
      operationId: public_ecommerce_order_cancel
      parameters:
      - description: Order id (decimal Snowflake)
        in: path
        name: order_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: The purchase credential minted at placement
        in: query
        name: credential
        required: true
        schema:
          type: string
      - description: Host override for server-side callers; defaults to the request Host
        in: query
        name: host
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperOrderView'
          description: The cancelled order (cancelling a cancelled order is idempotent)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The credential is absent, invalid or expired
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The order cannot be cancelled (typed upstream problem)
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service answered unexpectedly
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service is not configured or unreachable
      summary: |-
        `POST /api/v1/public/ecommerce/orders/{order_id}/cancel` — cancel
        while unpaid, with the purchase credential. The orchestration cancels
        a pending payment attempt first; upstream refusals (payment settled,
        fulfillment exists, provider cannot cancel yet) pass through typed.
      tags:
      - product_access
  /api/v1/public/ecommerce/orders/{order_id}/payment:
    get:
      operationId: public_ecommerce_payment_get
      parameters:
      - description: Order id (decimal Snowflake)
        in: path
        name: order_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: The purchase credential minted at placement
        in: query
        name: credential
        required: true
        schema:
          type: string
      - description: Host override for server-side callers; defaults to the request Host
        in: query
        name: host
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperPaymentStatusView'
          description: 'The latest attempt, or `attempt: null` before the first one'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The credential is absent, invalid or expired
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service answered unexpectedly
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service is not configured or unreachable
      summary: |-
        `GET /api/v1/public/ecommerce/orders/{order_id}/payment` — the latest
        payment attempt's state, for the return route's polling to webhook
        truth. `pending` means processing; a timeout here is never a verdict.
      tags:
      - product_access
    post:
      operationId: public_ecommerce_payment_start
      parameters:
      - description: Order id (decimal Snowflake)
        in: path
        name: order_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: The purchase credential minted at placement
        in: query
        name: credential
        required: true
        schema:
          type: string
      - description: One key per payment intent; replayed intents return the original attempt
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      - description: Host override for server-side callers; defaults to the request Host
        in: query
        name: host
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperPaymentStartView'
          description: The attempt (replayed intents return the original, with a fresh redirect_url while pending)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The credential is absent, invalid or expired
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: A payment attempt is already pending (`attempt_id` extension)
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The payment provider failed (`ecommerce/payment-provider-error`)
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Provider payments are not configured (`ecommerce/payments-unavailable`)
      summary: |-
        `POST /api/v1/public/ecommerce/orders/{order_id}/payment` — start (or
        replay) the hosted payment attempt with an `Idempotency-Key`. The
        amount is always the server's due amount; the response carries the
        hosted `redirect_url` while pending. A second start while one is
        pending answers 409 `ecommerce/payment-in-progress`.
      tags:
      - product_access
  /api/v1/public/ecommerce/orders/{order_id}/payment/cancel:
    post:
      operationId: public_ecommerce_payment_cancel
      parameters:
      - description: Order id (decimal Snowflake)
        in: path
        name: order_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: The purchase credential minted at placement
        in: query
        name: credential
        required: true
        schema:
          type: string
      - description: Host override for server-side callers; defaults to the request Host
        in: query
        name: host
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperPaymentStatusView'
          description: The latest attempt after the cancel
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The credential is absent, invalid or expired
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The provider cannot cancel the attempt yet
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The payment provider failed
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service is not configured or unreachable
      summary: |-
        `POST /api/v1/public/ecommerce/orders/{order_id}/payment/cancel` —
        cancel the pending attempt (the shopper walked away from the provider
        page). Settled attempts are returned unchanged; a provider that cannot
        cancel yet answers 409 `ecommerce/payment-in-progress`.
      tags:
      - product_access
  /api/v1/public/ecommerce/products:
    get:
      operationId: public_ecommerce_products
      parameters:
      - description: Host override for server-side callers; defaults to the request Host.
        in: query
        name: host
        required: false
        schema:
          type: string
      - description: Page size, 1-100 (default 50).
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int64
          maximum: 100
          minimum: 1
          type: integer
      - description: Opaque cursor from the previous page's `next_cursor`.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductPage'
          description: One page of sellable products
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No store is available for this host
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service answered unexpectedly
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service is not configured or unreachable
      summary: |-
        `GET /api/v1/public/ecommerce/products` — one page of active products
        with sellable variants, server-priced and server-availability-marked.
      tags:
      - product_access
  /api/v1/public/ecommerce/products/{product_id}:
    get:
      operationId: public_ecommerce_product
      parameters:
      - description: Product id (decimal Snowflake)
        in: path
        name: product_id
        required: true
        schema:
          type: string
      - description: Host override for server-side callers; defaults to the request Host
        in: query
        name: host
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductView'
          description: The product with sellable variants
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown product, or no store for this host
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service answered unexpectedly
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service is not configured or unreachable
      summary: |-
        `GET /api/v1/public/ecommerce/products/{product_id}` — one active
        product with its sellable variants.
      tags:
      - product_access
  /api/v1/public/ecommerce/shipping-methods:
    get:
      operationId: public_ecommerce_shipping_methods
      parameters:
      - description: Host override for server-side callers; defaults to the request Host
        in: query
        name: host
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ShopperShippingMethodView'
                type: array
          description: The store's active shipping methods
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No store is available for this host
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service answered unexpectedly
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service is not configured or unreachable
      summary: |-
        `GET /api/v1/public/ecommerce/shipping-methods` — the published
        store's active shipping methods, for the checkout's method picker.
        The service-side filter is hardcoded to active: a client-supplied
        `status` is ignored, and reading needs no store management. The
        answer is quote-derived pricing metadata and is always no-store.
      tags:
      - product_access
  /api/v1/public/ecommerce/store:
    get:
      operationId: public_ecommerce_store
      parameters:
      - description: Host override for server-side callers; defaults to the request Host
        in: query
        name: host
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStoreView'
          description: The published store
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No store is available for this host (unknown host, no published store, archived store, or the tenant does not have the product)
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service answered unexpectedly
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The store service is not configured or unreachable
      summary: |-
        `GET /api/v1/public/ecommerce/store` — the published store this host
        serves: name and currency. Unknown hosts, unbound tenants, archived
        stores and entitlement-off tenants all answer the same 404-shaped
        `store-unavailable` problem.
      tags:
      - product_access
  /api/v1/tenant/ecommerce-imports/stores/{store_id}/connections/{provider}/callback:
    get:
      operationId: proxy_import_callback
      parameters:
      - description: Destination ecommerce store id (canonical positive decimal)
        in: path
        name: store_id
        required: true
        schema:
          type: string
      - description: Connection provider (e.g. shopify or amazon)
        in: path
        name: provider
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Whatever ecommerce-connectors answered (any status it returns passes through)
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed path or oversized body
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Tenant lacks products.ecommerce.enabled, or the user lacks the ecommerce.import.* permission
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ecommerce-connectors rejected the platform's credentials or answered unusably
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ecommerce-connectors is not configured or unreachable
      summary: |-
        OAuth connection callback through to ecommerce-connectors: `GET /api/v1/tenant/ecommerce-imports/stores/{store_id}/connections/{provider}/callback`
        becomes `GET /v1/connections/{provider}/callback`.
      tags:
      - product_access
  /api/v1/tenant/ecommerce-imports/stores/{store_id}/{tail}:
    delete:
      operationId: proxy_import_delete
      parameters:
      - description: Destination ecommerce store id (canonical positive decimal)
        in: path
        name: store_id
        required: true
        schema:
          type: string
      - description: Path below ecommerce-connectors' /v1/
        in: path
        name: tail
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Whatever ecommerce-connectors answered (any status it returns passes through)
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed path or oversized body
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Tenant lacks products.ecommerce.enabled, or the user lacks the ecommerce.import.* permission
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ecommerce-connectors rejected the platform's credentials or answered unusably
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ecommerce-connectors is not configured or unreachable
      summary: |-
        Delete through to ecommerce-connectors: `DELETE /api/v1/tenant/ecommerce-imports/stores/{store_id}/{tail}`
        becomes `DELETE /v1/{tail}`.
      tags:
      - product_access
    get:
      operationId: proxy_import_get
      parameters:
      - description: Destination ecommerce store id (canonical positive decimal)
        in: path
        name: store_id
        required: true
        schema:
          type: string
      - description: Path below ecommerce-connectors' /v1/
        in: path
        name: tail
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Whatever ecommerce-connectors answered (any status it returns passes through)
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed path or oversized body
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Tenant lacks products.ecommerce.enabled, or the user lacks the ecommerce.import.* permission
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ecommerce-connectors rejected the platform's credentials or answered unusably
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ecommerce-connectors is not configured or unreachable
      summary: |-
