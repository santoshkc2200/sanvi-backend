    post:
      description: |-
        The money goes back the way the payment came. A manual payment's refund
        is recorded at once (201). A provider payment's refund is asked of the
        payment provider (202, a refund request); the refund is recorded when the
        provider confirms, and until then the money still stands paid. Retrying
        with the same `Idempotency-Key` and body returns what the first request
        did, with `Idempotency-Replayed: true`.
      operationId: ecommerce_refund_payment
      parameters:
      - description: An active store of the caller's tenant (decimal Snowflake)
        in: path
        name: store_id
        required: true
        schema:
          type: string
      - description: An order of that store (decimal Snowflake)
        in: path
        name: order_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: A payment of that order (decimal Snowflake)
        in: path
        name: payment_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: 1 to 255 visible ASCII characters, unique per store
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
