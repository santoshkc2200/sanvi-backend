    post:
      description: |-
        Commits the reservation and records the catalog's current prices in one
        transaction. With `expected_pricing_fingerprint` from a quote, the order
        commits only when the terms under the placement locks still match it; a
        mismatch is refused with nothing placed
        (`ecommerce/checkout-price-changed`) and the hold survives. Retrying with
        the same `Idempotency-Key` and body returns the order the first request
        placed, with `Idempotency-Replayed: true`.
      operationId: ecommerce_place_order
      parameters:
      - description: An active store of the caller's tenant (decimal Snowflake)
        in: path
        name: store_id
        required: true
        schema:
          type: string
      - description: 1 to 255 visible ASCII characters, unique per store
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBody'
          description: Placed, or replayed for a repeated key
          headers:
            Idempotency-Replayed:
              description: '`true` when replayed'
              schema:
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid fields or a missing Idempotency-Key
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: |-
            Missing `ecommerce.order.place`, or `ecommerce.order.discount` for a
            discounted order (the service's refusal), or the platform refused the
            request: the tenant lacks `products.ecommerce.enabled`, or the user
            holds no `ecommerce.*` permission
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No active store, no such reservation in it, no such customer in the tenant, or no such address of the customer (`ecommerce/address-not-found`)
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: |-
            Reservation expired, not held, or already ordered (`order_id`), the
            customer was erased, an address was archived
            (`ecommerce/address-archived`), or the approved pricing changed
            (`ecommerce/checkout-price-changed`)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: |-
            Idempotency-Key reused with a different body, a total too large, a
            discount larger than the merchandise subtotal
            (`ecommerce/discount-exceeds-subtotal`, with `subtotal_minor`), an
            address without `customer_id` (`ecommerce/address-needs-customer`), or
            a destination outside the zones of a store that blocks them
            (`ecommerce/destination-not-served`, naming `source` and `address_id`)
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ecommerce-service rejected the platform's credentials or answered unusably
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ecommerce-service is not configured or unreachable, or its database is unavailable
      summary: Turn a held reservation into an order.
      tags:
      - product_access
