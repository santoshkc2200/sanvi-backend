components:
  schemas:
    AddPriceRequest:
      properties:
        currency:
          type: string
        interval:
          $ref: '#/components/schemas/PriceInterval'
        stripe_price_id:
          type: string
        trial_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        unit_amount_minor:
          format: int64
          type: integer
      required:
      - stripe_price_id
      - currency
      - interval
      - unit_amount_minor
      type: object
    CheckoutSessionRequest:
      properties:
        cancel_url:
          type:
          - string
          - 'null'
        price_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        success_url:
          type:
          - string
          - 'null'
      required:
      - price_id
      type: object
    CheckoutSessionView:
      properties:
        session_id:
          type: string
        url:
          type: string
      required:
      - session_id
      - url
      type: object
    CollectionState:
      description: Our dunning machine, orthogonal to Stripe's status.
      enum:
      - ok
      - dunning
      - grace_expired
      type: string
    CreatePlanRequest:
      properties:
        key:
          type: string
        name:
          type: string
        sort_order:
          format: int32
          type: integer
        stripe_product_id:
          type: string
        tier:
          $ref: '#/components/schemas/PlanTier'
        visibility:
          $ref: '#/components/schemas/PlanVisibility'
      required:
      - key
      - name
      - tier
      - stripe_product_id
      type: object
    EntitlementGrant:
      description: |-
        One plan → feature grant. Feature keys reference the access context's
        catalog (validated at write time; no FK because the catalog is runtime
        data).
      properties:
        enabled:
          type: boolean
        feature_key:
          type: string
        limit:
          format: int64
          type:
          - integer
          - 'null'
      required:
      - feature_key
      - enabled
      type: object
    FieldIssue:
      description: |-
        One field-addressed validation issue (TASK-027, FR-1127).

        A validation error that names the input it belongs to lets a client
        build an error summary that links back to the offending field instead
        of guessing from a flat string. `field` is the request-body path,
        root-relative, with bracketed indices for sequence elements
        (`hostname`, `budget.amount.currency`,
        `ad_groups[2].ads[0].creative.placement`) — the same grammar the
        advertising capability matrix already speaks.
      properties:
        field:
          description: Root-relative path to the offending request field.
          type: string
        message:
          description: |-
            Why this field was rejected. Human-readable; `detail` stays the
            request-level summary and is never a replacement for it.
          type: string
      required:
      - field
      - message
      type: object
    InvoiceStatus:
      description: Mirrors Stripe's invoice status one-to-one.
      enum:
      - draft
      - open
      - paid
      - uncollectible
      - void
      type: string
    InvoiceView:
      description: An invoice row as served to the billing UI.
      properties:
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        hosted_url:
          type:
          - string
          - 'null'
        invoice_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        number:
          type:
          - string
          - 'null'
        paid_at:
          format: date-time
          type:
          - string
          - 'null'
        pdf_url:
          type:
          - string
          - 'null'
        period:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Period'
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        total_minor:
          format: int64
          type: integer
      required:
      - invoice_id
      - status
      - total_minor
      - currency
      - created_at
      type: object
    Period:
      description: A billing period (current or invoice period).
      properties:
        end:
          format: date-time
          type: string
        start:
          format: date-time
          type: string
      required:
      - start
      - end
      type: object
    PlanAdminPriceView:
      properties:
        active:
          type: boolean
        currency:
          type: string
        interval:
          $ref: '#/components/schemas/PriceInterval'
        price_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        stripe_price_id:
          type: string
        trial_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        unit_amount_minor:
          format: int64
          type: integer
      required:
      - price_id
      - stripe_price_id
      - currency
      - interval
      - unit_amount_minor
      - active
      type: object
    PlanAdminView:
      description: The operator view adds the Stripe ids and visibility.
      properties:
        entitlements:
          items:
            $ref: '#/components/schemas/EntitlementGrant'
          type: array
        key:
          type: string
        name:
          type: string
        plan_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        prices:
          items:
            $ref: '#/components/schemas/PlanAdminPriceView'
          type: array
        sort_order:
          format: int32
          type: integer
        stripe_product_id:
          type: string
        tier:
          $ref: '#/components/schemas/PlanTier'
        visibility:
          $ref: '#/components/schemas/PlanVisibility'
      required:
      - plan_id
      - key
      - name
      - tier
      - stripe_product_id
      - visibility
      - sort_order
      - prices
      - entitlements
      type: object
    PlanPriceView:
      description: One price on the public pricing page.
      properties:
        currency:
          type: string
        interval:
          $ref: '#/components/schemas/PriceInterval'
        price_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        trial_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        unit_amount_minor:
          format: int64
          type: integer
      required:
      - price_id
      - currency
      - interval
      - unit_amount_minor
      type: object
    PlanTier:
      description: |-
        One sellable tier. Each tier maps to exactly one Stripe Product so
        Checkout line items show a distinguishable name.
      enum:
      - starter
      - professional
      - enterprise
      type: string
    PlanVisibility:
      description: Whether a plan appears on the public pricing page.
      enum:
      - public
      - hidden
      type: string
    PortalSessionView:
      properties:
        url:
          type: string
      required:
      - url
      type: object
    PriceInterval:
      description: 'Billing variant of a plan: monthly vs annual, currency, amount.'
      enum:
      - month
      - year
      type: string
    ProblemDetail:
      allOf:
      - description: |-
          RFC 9457 extension members for problem classes that carry
          structured extras (the disconnect conflict names its blockers,
          for example). Flattened onto the JSON object exactly as the RFC
          prescribes; carrying them here keeps the error-enrichment layer
          from stripping them. Absent otherwise.
        type:
        - object
        - 'null'
      - properties:
          detail:
            description: Human-readable explanation of this specific occurrence.
            type: string
          fields:
            description: |-
              The fields a validation rejection names (TASK-027, FR-1127), as an
              RFC 9457 extension member. Present only when the error is
              field-addressed; the human-readable `detail` is never removed from
              an error that grows field addressing.
            items:
              $ref: '#/components/schemas/FieldIssue'
            type:
            - array
            - 'null'
          instance:
            description: URI of the offending resource, if any.
            type:
            - string
            - 'null'
          reason:
            description: |-
              Machine-readable reason for statuses that carry one (e.g. tenant
              suspension); absent otherwise.
            type:
            - string
            - 'null'
          status:
            description: HTTP status code (mirrors the response code).
            format: int32
            minimum: 0
            type: integer
          title:
            description: Short, human-readable, stable title.
            type: string
          trace_id:
            description: |-
              Correlates with the trace in OpenObserve: the W3C trace id of the
              span serving the request (the same trace the `traceparent` response
              header references), falling back to the request id when the request
              ran outside any OpenTelemetry context.
            type:
            - string
            - 'null'
          type:
            description: Stable URI identifying the error class.
            example: https://sanvi.dev/problems/bad-request
            type: string
        required:
        - type
        - title
        - status
        - detail
        type: object
      description: RFC 9457 problem detail. This is the only error body the API produces.
    PublicPlanView:
      description: |-
        A plan with its prices and entitlement grants (public pricing page; the
        Stripe price ids are omitted — they are integration details).
      properties:
        entitlements:
          items:
            $ref: '#/components/schemas/EntitlementGrant'
          type: array
        key:
          type: string
        name:
          type: string
        plan_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        prices:
          items:
            $ref: '#/components/schemas/PlanPriceView'
          type: array
        sort_order:
          format: int32
          type: integer
        tier:
          $ref: '#/components/schemas/PlanTier'
      required:
      - plan_id
      - key
      - name
      - tier
      - sort_order
      - prices
      - entitlements
      type: object
    SetEntitlementsRequest:
      properties:
        grants:
          items:
            $ref: '#/components/schemas/EntitlementGrant'
          type: array
      required:
      - grants
      type: object
    SubscriptionOverrideRequest:
      properties:
        plan_key:
          type: string
        reason:
          type: string
      required:
      - plan_key
      - reason
      type: object
    SubscriptionSource:
      description: Where the subscription came from.
      enum:
      - stripe
      - override
      type: string
    SubscriptionStatus:
      description: Mirrors Stripe's subscription status one-to-one.
      enum:
      - trialing
      - active
      - past_due
      - unpaid
      - canceled
      - incomplete
      - incomplete_expired
      - paused
      type: string
    SubscriptionView:
      description: The tenant's subscription as served to the billing UI.
      properties:
        cancel_at_period_end:
          type: boolean
        collection_state:
          $ref: '#/components/schemas/CollectionState'
        current_period:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Period'
        plan_key:
          type: string
        plan_name:
          type: string
        source:
          $ref: '#/components/schemas/SubscriptionSource'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        subscription_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        trial_end:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - subscription_id
      - plan_key
      - plan_name
      - source
      - status
      - collection_state
      - cancel_at_period_end
      type: object
    UpdatePlanRequest:
      properties:
        name:
          type: string
        sort_order:
          format: int32
          type: integer
        stripe_product_id:
          type:
          - string
          - 'null'
        visibility:
          $ref: '#/components/schemas/PlanVisibility'
      required:
      - name
      type: object
info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/platform/plans:
    get:
      operationId: list_plans
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PlanAdminView'
                type: array
          description: All plans
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
      summary: '`GET /api/v1/platform/plans` — the operator catalog (hidden plans too).'
      tags:
      - billing
    post:
      operationId: create_plan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAdminView'
          description: Created plan
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Plan key taken
      summary: |-
        `POST /api/v1/platform/plans` — create a plan (the Stripe Product must
        exist in the Dashboard first; its id goes into `stripe_product_id`).
      tags:
      - billing
  /api/v1/platform/plans/{id}:
    patch:
      operationId: update_plan
      parameters:
      - description: Plan id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAdminView'
          description: Updated plan
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Plan not found
      summary: '`PATCH /api/v1/platform/plans/{id}` — update a plan''s mutable fields.'
      tags:
      - billing
  /api/v1/platform/plans/{id}/entitlements:
    put:
      operationId: set_plan_entitlements
      parameters:
      - description: Plan id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEntitlementsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EntitlementGrant'
                type: array
          description: The new map
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown feature key
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Plan not found
      summary: |-
        `PUT /api/v1/platform/plans/{id}/entitlements` — replace the plan's
        entitlement map. Pricing changes never require a deploy; tenants get the
        new map on their next entitlement recompute.
      tags:
      - billing
  /api/v1/platform/plans/{id}/prices:
    post:
      operationId: add_plan_price
      parameters:
      - description: Plan id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPriceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAdminPriceView'
          description: Created price
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Plan not found
      summary: |-
        `POST /api/v1/platform/plans/{id}/prices` — attach a Stripe Price
        (billing variant of the plan).
      tags:
      - billing
  /api/v1/platform/tenants/{id}/subscription/override:
    delete:
      operationId: revoke_subscription_override
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '204':
          description: Override revoked
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not an operator override
      summary: |-
        `DELETE /api/v1/platform/tenants/{id}/subscription/override` — revoke an
        operator override.
      tags:
      - billing
    post:
      operationId: apply_subscription_override
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionOverrideRequest'
        required: true
      responses:
        '200':
          description: Override applied
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Plan not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Live Stripe subscription blocks an override
      summary: |-
        `POST /api/v1/platform/tenants/{id}/subscription/override` — grant a
        plan's entitlements without a Stripe subscription (audited operator
        action).
      tags:
      - billing
  /api/v1/public/plans:
    get:
      operationId: list_public_plans
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PublicPlanView'
                type: array
          description: Plans with prices and entitlement grants
      summary: |-
        `GET /api/v1/public/plans` — the pricing page catalog (localized by
        phase 06; hidden plans excluded).///
        Cache semantics (TASK-022, FR-1111): when `platform.ssr_cache` is
        enabled, the anonymous response is served from the server-side SSR cache
        keyed by (tenant, locale, theme revision, device class) with
        single-flight on miss; a theme publish or content change invalidates the
        affected entries within ~2 s (the entry TTL is a backstop only).
        Requests carrying an `Authorization` header are never served from or
        written to the cache, and responses carrying `Set-Cookie` are never
        stored. Varies on `Accept-Language`.
      tags:
      - billing
  /api/v1/tenant/billing/checkout-session:
    post:
      operationId: create_checkout_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutSessionRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionView'
          description: Checkout URL
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: A live subscription already exists
      summary: |-
        `POST /api/v1/tenant/billing/checkout-session` — start subscribing.
        Access is granted only when Stripe webhooks arrive, never from the
        redirect.
      tags:
      - billing
  /api/v1/tenant/billing/invoices:
    get:
      operationId: list_invoices
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Page size, clamped to 1..=100; 50 when absent.
          examples:
          - 50
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last invoice of the previous page. Absent for
          the first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InvoiceView'
                type: array
          description: Invoices, newest first (ordered by id, which encodes creation time)
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout — the request exceeded its budget
      summary: |-
        `GET /api/v1/tenant/billing/invoices` — the tenant's invoices.
        Ordered by id DESC.
      tags:
      - billing
  /api/v1/tenant/billing/portal-session:
    post:
      operationId: create_portal_session
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSessionView'
          description: Portal URL
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No subscription
      summary: |-
        `POST /api/v1/tenant/billing/portal-session` — open the Customer Portal
        (upgrades, downgrades, cancellation, payment methods).
      tags:
      - billing
  /api/v1/tenant/billing/subscription:
    get:
      operationId: get_subscription
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/SubscriptionView'
          description: The subscription, or null when none
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
      summary: '`GET /api/v1/tenant/billing/subscription` — the tenant''s subscription.'
      tags:
      - billing
