info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/public/track:
    post:
      operationId: public_track_conversion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackConversionRequest'
        required: true
      responses:
        '202':
          description: Always returned, regardless of outcome — see the module doc for why
      tags:
      - advertising
  /api/v1/tenant/ads/audiences:
    get:
      operationId: list_audiences
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Audience'
                type: array
          description: Every audience owned by the tenant
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
      tags:
      - advertising
    post:
      operationId: create_audience
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAudienceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audience'
          description: Draft audience created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid audience parameters
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission
      tags:
      - advertising
  /api/v1/tenant/ads/audiences/{id}/refresh:
    post:
      operationId: refresh_audience
      parameters:
      - description: The audience ID to refresh
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audience'
          description: Audience refreshed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Audience not found
      tags:
      - advertising
  /api/v1/tenant/ads/budget-alerts:
    get:
      operationId: get_budget_alerts
      parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - in: path
        name: unacknowledged_only
        required: true
        schema:
          type:
          - boolean
          - 'null'
      - in: path
        name: limit
        required: true
        schema:
          format: int64
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetAlertsView'
          description: Budget alerts history
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
      tags:
      - advertising
  /api/v1/tenant/ads/budget-alerts/{alert_id}/acknowledge:
    post:
      operationId: acknowledge_budget_alert
      parameters:
      - description: Target budget alert ID
        in: path
        name: alert_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetAlert'
          description: Acknowledged budget alert
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.budget.manage permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Budget alert not found
      tags:
      - advertising
  /api/v1/tenant/ads/budget-caps:
    get:
      operationId: get_budget_caps
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCapsView'
          description: All budget caps defined for this tenant
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
      tags:
      - advertising
    put:
      operationId: put_budget_cap
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutBudgetCapRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutBudgetCapResponse'
          description: Budget cap created or updated, or dry-run simulation result
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.budget.manage permission
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: New cap is below current period spend and confirmation is required
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns:
    get:
      operationId: list_campaigns
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignsView'
          description: Every campaign owned by the tenant, newest first
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
      tags:
      - advertising
    post:
      operationId: create_campaign
      parameters:
      - description: Required. A retry with the same key returns the original draft.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: Draft campaign created. Never touches the platform.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing/malformed Idempotency-Key or invalid campaign fields (advertising/campaign-invalid carries field violations)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission or platform entitlement
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Connection not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Connection is not active
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}:
    get:
      operationId: get_campaign
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: The campaign's current intent and revision
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign not found
      tags:
      - advertising
    patch:
      operationId: patch_campaign
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Required. The campaign's current revision; a stale value returns 409 with the current state.
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: Required. A retry with the same key returns the original result.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCampaignRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: Intent updated; if published, the edit was also pushed to the platform
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing/malformed headers, invalid creative id, or invalid fields (advertising/campaign-invalid carries field violations)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission or platform entitlement
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign or creative not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale revision or idempotency conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Platform adapter unavailable
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}/ad-groups:
    post:
      operationId: add_ad_group
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Required. The campaign's current revision.
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: Required. A retry with the same key returns the original result.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdGroupRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: Ad group appended; if published, pushed to the platform
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing/malformed headers or invalid fields (advertising/campaign-invalid carries field violations)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission or platform entitlement
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale revision or idempotency conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Platform adapter unavailable
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}/ad-groups/{ad_group_id}:
    patch:
      operationId: update_ad_group
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Ad group id
        in: path
        name: ad_group_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Required. The campaign's current revision.
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: Required. A retry with the same key returns the original result.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAdGroupRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: Ad group updated; if published, pushed to the platform
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing/malformed headers or invalid fields (advertising/campaign-invalid carries field violations)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission or platform entitlement
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign or ad group not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale revision or idempotency conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Platform adapter unavailable
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}/ad-groups/{ad_group_id}/ads:
    post:
      operationId: add_ad
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Ad group id
        in: path
        name: ad_group_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Required. The campaign's current revision.
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: Required. A retry with the same key returns the original result.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: Ad appended; if published, pushed to the platform
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing/malformed headers, invalid creative id, or invalid fields (advertising/campaign-invalid carries field violations)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission or platform entitlement
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign, ad group or creative not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale revision or idempotency conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Platform adapter unavailable
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}/ad-groups/{ad_group_id}/ads/{ad_id}:
    patch:
      operationId: update_ad
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Ad group id
        in: path
        name: ad_group_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Ad id
        in: path
        name: ad_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Required. The campaign's current revision.
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: Required. A retry with the same key returns the original result.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAdRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: Ad updated; if published, pushed to the platform
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing/malformed headers, invalid creative id, or invalid fields (advertising/campaign-invalid carries field violations)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission or platform entitlement
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign, ad group, ad or creative not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale revision or idempotency conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Platform adapter unavailable
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}/budget-cap:
    get:
      operationId: get_campaign_budget_cap
      parameters:
      - description: Target campaign ID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - in: path
        name: period
        required: true
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BudgetPeriod'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCap'
          description: Campaign budget cap
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No budget cap found for this campaign and period
      tags:
      - advertising
    put:
      operationId: put_campaign_budget_cap
      parameters:
      - description: Target campaign ID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutBudgetCapRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutBudgetCapResponse'
          description: Campaign budget cap created/updated or dry run result
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.budget.manage permission
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: New cap is below current period spend and confirmation is required
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}/changes:
    get:
      operationId: list_campaign_changes
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignChangesView'
          description: 'Newest-first attributed change log: actor, source (sanvi|platform), before/after state'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign not found
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}/drift:
    post:
      operationId: resolve_campaign_drift
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Required. A retry of this drift resolution returns its original result.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveCampaignDriftRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedCampaignDriftView'
          description: Drift resolution applied or replayed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing or malformed idempotency key, or invalid resolution
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission or platform entitlement
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale revision, idempotency conflict, or resolution in progress
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Platform adapter unavailable
      summary: |-
        Explicitly resolve a platform-observed campaign drift. The idempotency
        claim is durable and created before any provider write; the adapter also
        receives the same key for provider-side deduplication.
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}/pause:
    post:
      operationId: pause_campaign
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Required.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: Paused on the platform
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing/malformed Idempotency-Key
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission or platform entitlement
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign not found
        '409':
          content:
