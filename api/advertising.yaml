  /api/v1/tenant/ads/metrics:
    get:
      operationId: get_ads_metrics
      parameters:
      - description: Inclusive range start, `YYYY-MM-DD`.
        example: 2026-08-01
        in: query
        name: from
        required: true
        schema:
          type: string
      - description: Inclusive range end, `YYYY-MM-DD`.
        example: 2026-08-24
        in: query
        name: to
        required: true
        schema:
          type: string
      - description: '`campaign` (default), `platform`, or `tenant`.'
        example: campaign
        in: query
        name: group_by
        required: false
        schema:
          type: string
      - example: google_ads
        in: query
        name: platform
        required: false
        schema:
          type: string
      - in: query
        name: campaign_id
        required: false
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: |-
          Optional display-only currency for `rendered_spend`. Conversion is
          never persisted and never replaces the native `spend` — each rendered
          value carries its FX rate date. Omit to keep account currencies only.
        example: JPY
        in: query
        name: render_currency
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsQueryResponse'
          description: Rollup rows for the requested range and grain, both ROAS numbers labelled separately
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid date range, unknown group_by, or a span exceeding the configured maximum
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.metrics.read permission
      tags:
      - advertising
  /api/v1/tenant/ads/metrics/export:
