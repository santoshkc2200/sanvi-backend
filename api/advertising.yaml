    FieldIssue:
      description: |-
        One field-addressed validation issue (TASK-027, FR-1127).

        A validation error that names the input it belongs to lets a client
        build an error summary that links back to the offending field instead
        of guessing from a flat string. `field` is the request-body path,
        root-relative, with bracketed indices for sequence elements
        (`hostname`, `budget.amount.currency`,
        `ad_groups[2].ads[0].creative.placement`) — the same grammar the
        advertising capability matrix already speaks.
      properties:
        field:
          description: Root-relative path to the offending request field.
          type: string
        message:
          description: |-
            Why this field was rejected. Human-readable; `detail` stays the
            request-level summary and is never a replacement for it.
          type: string
      required:
      - field
      - message
      type: object
    HashedIdentifier:
      type: string
    MetricPoint:
      description: |-
        One rollup row (TASK-016, slice 10.7). The grain depends on the
        request's `group_by`: `campaign` populates both `platform` and
        `campaign_id`; `platform` populates only `platform`; `tenant` leaves
        both `None`. Tenant is supplied by the authenticated route scope.

        `conversion_value` (the platform's own attribution) and `sanvi_revenue`
        (Sanvi's order-based view) are always both present, always labelled
        separately — never blended into one number (NFR-1006). Same for
        `roas_platform`/`roas_sanvi`: each is `null` on zero spend, never `∞`.
      properties:
        campaign_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        clicks:
          format: int64
          type: integer
        conversion_value:
          $ref: '#/components/schemas/MoneyView'
          description: |-
            Platform-reported conversion value — attribution the ad platform's
            own model made.
        conversions:
          format: double
          type: number
        date:
          example: 2026-08-24
          format: date
          type: string
        impressions:
          format: int64
          type: integer
        platform:
          example: google_ads
          type:
          - string
          - 'null'
        rendered_spend:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RenderedMoneyView'
        restating:
          description: |-
            Still inside the platform's restatement window — this day's numbers
            may still change on a later ingest.
          type: boolean
        roas_platform:
          format: double
          type:
          - number
          - 'null'
        roas_sanvi:
          format: double
          type:
          - number
          - 'null'
        sanvi_revenue:
          $ref: '#/components/schemas/MoneyView'
          description: |-
            Sanvi's own order-based revenue view. Never summed with
            `conversion_value` — see the type's doc comment.
        spend:
          $ref: '#/components/schemas/MoneyView'
      required:
      - date
      - impressions
      - clicks
      - spend
      - conversions
      - conversion_value
      - sanvi_revenue
      - restating
      type: object
    MetricsFreshnessView:
      properties:
