  /api/v1/tenant/ads/campaigns/{campaign_id}/budget-cap:
    get:
      operationId: get_campaign_budget_cap
      parameters:
      - description: Target campaign ID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - in: query
        name: period
        required: false
        schema:
          $ref: '#/components/schemas/BudgetPeriod'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCap'
          description: Campaign budget cap (carries an `ETag` header with the cap version)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No budget cap found for this campaign and period
      tags:
      - advertising
    put:
      operationId: put_campaign_budget_cap
      parameters:
      - description: Target campaign ID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: 'Conditional. Required when updating an existing cap — a version-less update is rejected with 409 (`reason: cap_version_required`). Omitting it is valid only for creates (no cap exists yet for this scope and period) and for dry runs. The version is a quoted entity tag (e.g. "17") or the bare integer; `If-Match: *` is not accepted. A stale value returns 409 (`reason: stale_revision`).'
        in: header
        name: If-Match
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutBudgetCapRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutBudgetCapResponse'
          description: Campaign budget cap created/updated (an applied write carries an `ETag` header with the new version) or dry run result
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.budget.manage permission
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'Cap conflict, distinguished by the problem `reason` member: `cap_version_required` (update without If-Match), `stale_revision` (lost version race), `cap_below_current_spend` (lowering below period spend without confirmation)'
      tags:
      - advertising
