            - tenant_user
            type: string
          user_id:
            format: int64
            type: integer
        required:
        - user_id
        - kind
        type: object
      - description: |-
          Captured under an email-identified subject. No key material is
          stored; a later withdrawal re-check has nothing safe to query and
          must refuse rather than guess.
        properties:
          kind:
            enum:
            - contact
            type: string
        required:
        - kind
        type: object
    Targeting:
      description: Typed extension data. Arbitrary JSON is deliberately not admitted to the domain.
      properties:
        dimensions:
          additionalProperties:
            items:
              type: string
            type: array
          propertyNames:
            type: string
          type: object
        extension_fields:
          additionalProperties:
            type: string
          propertyNames:
            type: string
          type: object
      required:
      - dimensions
      - extension_fields
      type: object
    TargetingDimension:
      type: string
    TestTrackingEventResponse:
      properties:
        captured:
          $ref: '#/components/schemas/ConversionEvent'
        test:
          description: |-
            Always `true` — a marker so this synthetic call is never mistaken
            for a real event by anything reading the response.
          type: boolean
      required:
      - test
      - captured
      type: object
    TrackConversionRequest:
      properties:
        click_ids:
          $ref: '#/components/schemas/ClickIds'
        currency:
          type:
          - string
          - 'null'
        device_id:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        event_id:
          type: string
        event_name:
          type: string
        order_ref:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        value:
          format: int64
          type:
          - integer
          - 'null'
      required:
      - event_name
      - event_id
      type: object
    TrackingSettings:
      properties:
        mappings:
          additionalProperties:
            additionalProperties:
              type: string
            propertyNames:
              type: string
            type: object
          description: event name -> (platform key -> the platform's conversion action)
          propertyNames:
            type: string
          type: object
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - tenant_id
      - mappings
      type: object
    TrackingSiteKeyView:
      properties:
        origin:
          type: string
        site_key:
          type: string
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - site_key
      - tenant_id
      - origin
      type: object
    UnmatchedPlatformAds:
      description: |-
        What the platform listed that this campaign's tree cannot account for.
        A published campaign whose ads were never pushed (or whose platform ids
        were never recorded) can never match the platform's listings — surfacing
        the gap is what keeps an all-pending response from reading as a clean,
        successful poll when it is really "nothing correlated".
      properties:
        ads_without_platform_id:
          description: |-
            Ads in the campaign tree with no recorded platform id — these can
            never match anything until the platform's ids are persisted onto them.
          minimum: 0
          type: integer
        platform_ad_ids:
          description: Platform-listed ad ids that matched no ad in the campaign tree.
          items:
            type: string
          type: array
      required:
      - platform_ad_ids
      - ads_without_platform_id
      type: object
    UploadState:
      description: |-
        Per-platform upload progress. Suppression is deliberately absent: a
        directive suppresses the whole event, not one platform, and the frozen
        `ConsentSnapshot` already carries which purpose was denied and by which
        signal source. Duplicating that here would give suppression two homes
        that can disagree.
      oneOf:
      - properties:
          attempt_count:
            format: int32
            minimum: 0
            type: integer
          status:
            enum:
            - pending
            type: string
        required:
        - status
        type: object
      - properties:
          attempt_count:
            format: int32
            minimum: 0
            type: integer
          status:
            enum:
            - uploaded
            type: string
        required:
        - status
        type: object
      - properties:
          attempt_count:
            format: int32
            minimum: 0
            type: integer
          reason:
            type: string
          status:
            enum:
            - failed
            type: string
        required:
        - reason
        - status
        type: object
      - properties:
          attempts:
            format: int32
            minimum: 0
            type: integer
          reason:
            type: string
          status:
            enum:
            - parked
            type: string
        required:
        - reason
        - attempts
        - status
        type: object
      - properties:
          status:
            enum:
            - retracted
            type: string
        required:
        - status
        type: object
      - properties:
          reason:
            type: string
          status:
            enum:
            - unpropagated
            type: string
        required:
        - reason
        - status
        type: object
    ValidationResultView:
      properties:
        violations:
          description: Empty means valid. Same shape a failed create or patch would carry.
          items:
            $ref: '#/components/schemas/ValidationViolation'
          type: array
      required:
      - violations
      type: object
    ValidationViolation:
      properties:
        code:
          type: string
        field_path:
          type: string
        message:
          type: string
      required:
      - field_path
      - code
      - message
      type: object
    ValueSource:
      enum:
      - payment_record
      - client_reported
      type: string
info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/platform/ads/health:
    get:
      operationId: get_platform_ads_health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAdsHealthReport'
          description: Cross-tenant advertising connection health and freshness overview
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing platform.tenant.read permission
      tags:
      - advertising
  /api/v1/public/track:
    post:
      operationId: public_track_conversion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackConversionRequest'
        required: true
      responses:
        '202':
          description: Always returned, regardless of outcome — see the module doc for why
      tags:
      - advertising
  /api/v1/tenant/ads/audiences:
    get:
      operationId: list_audiences
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last audience of the previous page. Absent for
          the first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Audience'
                type: array
          description: One page of the tenant's audiences
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout - the request exceeded its budget
      summary: Ordered by id DESC.
      tags:
      - advertising
    post:
      operationId: create_audience
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAudienceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audience'
          description: Draft audience created
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid audience parameters
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission
      tags:
      - advertising
  /api/v1/tenant/ads/audiences/{id}/refresh:
    post:
      operationId: refresh_audience
      parameters:
      - description: The audience ID to refresh
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audience'
          description: Audience refreshed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Audience not found
      tags:
      - advertising
  /api/v1/tenant/ads/budget-alerts:
    get:
      operationId: get_budget_alerts
      parameters:
      - in: query
        name: campaign_id
        required: false
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - in: query
        name: unacknowledged_only
        required: false
        schema:
          type: boolean
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Page size, clamped to 1..=200; 50 when absent.
          examples:
          - 50
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last alert of the previous page. Absent for
          the first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetAlertsView'
          description: Budget alerts history
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout - the request exceeded its budget
      summary: Ordered by id DESC.
      tags:
      - advertising
  /api/v1/tenant/ads/budget-alerts/{alert_id}/acknowledge:
    post:
      operationId: acknowledge_budget_alert
      parameters:
      - description: Target budget alert ID
        in: path
        name: alert_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetAlert'
          description: Acknowledged budget alert
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.budget.manage permission
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Budget alert not found
      tags:
      - advertising
  /api/v1/tenant/ads/budget-caps:
    get:
      operationId: get_budget_caps
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last item of the previous page. Absent for the
          first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCapsView'
          description: One page of the budget caps defined for this tenant
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout - the request exceeded its budget
      summary: Ordered by id DESC.
      tags:
      - advertising
    put:
      operationId: put_budget_cap
      parameters:
      - description: 'Conditional. Required when updating an existing cap — a version-less update is rejected with 409 (`reason: cap_version_required`). Omitting it is valid only for creates (no cap exists yet for this scope and period) and for dry runs. The version is a quoted entity tag (e.g. "17") or the bare integer; `If-Match: *` is not accepted. A stale value returns 409 (`reason: stale_revision`).'
        in: header
        name: If-Match
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutBudgetCapRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutBudgetCapResponse'
          description: Budget cap created or updated (an applied write carries an `ETag` header with the new version), or dry-run simulation result
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.budget.manage permission
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'Cap conflict, distinguished by the problem `reason` member: `cap_version_required` (update without If-Match), `stale_revision` (lost version race), `cap_below_current_spend` (lowering below period spend without confirmation)'
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns:
    get:
      operationId: list_campaigns
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last item of the previous page. Absent for the
          first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignsView'
          description: One page of the tenant's campaigns, newest first
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout - the request exceeded its budget
      summary: Ordered by created_at DESC, id DESC.
      tags:
      - advertising
    post:
      operationId: create_campaign
      parameters:
      - description: Required. A retry with the same key returns the original draft.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: Draft campaign created. Never touches the platform.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing/malformed Idempotency-Key or invalid campaign fields (advertising/campaign-invalid carries field violations)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission or platform entitlement
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Connection not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Connection is not active
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}:
    get:
      operationId: get_campaign
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: The campaign's current intent and revision
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.read permission
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign not found
      tags:
      - advertising
    patch:
      operationId: patch_campaign
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Required. The campaign's current revision; a stale value returns 409 with the current state.
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: Required. A retry with the same key returns the original result.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCampaignRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: Intent updated; if published, the edit was also pushed to the platform
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing/malformed headers, invalid creative id, or invalid fields (advertising/campaign-invalid carries field violations)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission or platform entitlement
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign or creative not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale revision or idempotency conflict
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Platform adapter unavailable
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}/ad-groups:
    post:
      operationId: add_ad_group
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Required. The campaign's current revision.
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: Required. A retry with the same key returns the original result.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdGroupRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: Ad group appended; if published, pushed to the platform
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing/malformed headers or invalid fields (advertising/campaign-invalid carries field violations)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission or platform entitlement
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale revision or idempotency conflict
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Platform adapter unavailable
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}/ad-groups/{ad_group_id}:
    patch:
      operationId: update_ad_group
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Ad group id
        in: path
        name: ad_group_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Required. The campaign's current revision.
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      - description: Required. A retry with the same key returns the original result.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAdGroupRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignView'
          description: Ad group updated; if published, pushed to the platform
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing/malformed headers or invalid fields (advertising/campaign-invalid carries field violations)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing advertising.campaign.write permission or platform entitlement
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Campaign or ad group not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale revision or idempotency conflict
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Platform adapter unavailable
      tags:
      - advertising
  /api/v1/tenant/ads/campaigns/{campaign_id}/ad-groups/{ad_group_id}/ads:
    post:
      operationId: add_ad
      parameters:
      - description: Campaign UUID
        in: path
        name: campaign_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Ad group id
        in: path
        name: ad_group_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Required. The campaign's current revision.
