components:
  schemas:
    AccountView:
      properties:
        display_name:
          type: string
        external_id:
          type: string
      required:
      - external_id
      - display_name
      type: object
    Ad:
      properties:
        creative:
          $ref: '#/components/schemas/Creative'
        external_id:
          description: |-
            The platform's own id for this ad, once one has been recorded — the
            only key that correlates a review observation (which arrives keyed by
            platform id) back onto this ad. `None` for ads the platform has never
            echoed an id for; a platform that assigns ids at creation must persist
            them here, or its verdicts can never be matched.
          type:
          - string
          - 'null'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        landing_url:
          type: string
        review:
          $ref: '#/components/schemas/AdReview'
          description: |-
            Last review observation pulled from the platform. Absent (pending,
            never checked) until a poll happens — ads only get reviewed once they
            are published.
        tracking_template:
          type:
          - string
          - 'null'
      required:
      - id
      - creative
      - landing_url
      type: object
    AdGroup:
      properties:
        ads:
          items:
            $ref: '#/components/schemas/Ad'
          type: array
        bid:
          $ref: '#/components/schemas/BidSettings'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        name:
          type: string
        targeting:
          $ref: '#/components/schemas/Targeting'
      required:
      - id
      - name
      - targeting
      - bid
      - ads
      type: object
    AdReview:
      description: |-
        The platform's review verdict for one ad. `reasons` preserves the
        platform's own policy wording verbatim — a paraphrased rejection is worse
        than useless when the tenant has to fix the ad in the native tool.
      properties:
        checked_at:
          format: date-time
          type:
          - string
          - 'null'
        reasons:
          items:
            type: string
          type: array
        state:
          $ref: '#/components/schemas/AdReviewState'
      required:
      - state
      type: object
    AdReviewState:
      enum:
      - pending
      - approved
      - rejected
      type: string
    AdReviewStatusView:
      description: |-
        One ad's refreshed review state, addressed by its platform-facing id so a
        client can correlate against the campaign tree it already has.
      properties:
        ad_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        review:
          $ref: '#/components/schemas/AdReview'
      required:
      - ad_id
      - review
      type: object
    AdsFreshnessSummaryView:
      properties:
        stalled_connections:
          format: int32
          minimum: 0
          type: integer
        total_connections:
          format: int32
          minimum: 0
          type: integer
        worst_lag_hours:
          format: double
          type:
          - number
          - 'null'
      required:
      - total_connections
      - stalled_connections
      type: object
    AdvertisingConnectionView:
      properties:
        account_name:
          type:
          - string
          - 'null'
        currency:
          type: string
        external_account_id:
          type: string
        health:
          $ref: '#/components/schemas/ConnectionHealthView'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        platform:
          type: string
        status:
          type: string
        timezone:
          type: string
      required:
      - id
      - platform
      - external_account_id
      - currency
      - timezone
      - status
      - health
      type: object
    AdvertisingCreateConnectionRequest:
      properties:
        connection_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        currency:
          example: JPY
          type: string
        external_account_id:
          type: string
        timezone:
          example: Asia/Tokyo
          type: string
      required:
      - connection_id
      - external_account_id
      - currency
      - timezone
      type: object
    AdvertisingMoney:
      properties:
        amount_minor:
          format: int64
          type: integer
        currency:
          type: string
      required:
      - amount_minor
      - currency
      type: object
    AlertCondition:
      enum:
      - settled_breach
      - provisional_lower_bound_breach
      - provisional_warning
      - stale_data_warning
      - spend_anomaly
      - threshold80
      type: string
    AssetMetadata:
      properties:
        aspect_ratio:
          type: string
        duration_seconds:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        file_size_bytes:
          format: int64
          minimum: 0
          type: integer
        height_px:
          format: int32
          minimum: 0
          type: integer
        is_video:
          type: boolean
        width_px:
          format: int32
          minimum: 0
          type: integer
      required:
      - width_px
      - height_px
      - file_size_bytes
      - is_video
      - aspect_ratio
      type: object
    Audience:
      properties:
        created_at:
          format: date-time
          type: string
        external_ref:
          type:
          - string
          - 'null'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        included_identifiers:
          items:
            $ref: '#/components/schemas/HashedIdentifier'
          type: array
        last_synced_at:
          format: date-time
          type:
          - string
          - 'null'
        name:
          type: string
        platform:
          $ref: '#/components/schemas/PlatformKey'
        status:
          $ref: '#/components/schemas/AudienceStatus'
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - id
      - tenant_id
      - platform
      - name
      - status
      - included_identifiers
      - created_at
      type: object
    AudienceStatus:
      oneOf:
      - properties:
          status:
            enum:
            - building
            type: string
        required:
        - status
        type: object
      - properties:
          status:
            enum:
            - active
            type: string
        required:
        - status
        type: object
      - properties:
          reason:
            type: string
          status:
            enum:
            - failed
            type: string
        required:
        - reason
        - status
        type: object
    BidSettings:
      properties:
        maximum_bid:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AdvertisingMoney'
        strategy:
          type: string
      required:
      - strategy
      type: object
    Budget:
      properties:
        amount:
          $ref: '#/components/schemas/AdvertisingMoney'
        kind:
          $ref: '#/components/schemas/BudgetType'
      required:
      - kind
      - amount
      type: object
    BudgetActionsConfigured:
      properties:
        auto_pause:
          type: boolean
        auto_resume_on_rollover:
          type: boolean
        threshold_100:
          type: string
        threshold_80:
          type: string
      required:
      - threshold_80
      - threshold_100
      - auto_pause
      - auto_resume_on_rollover
      type: object
    BudgetAlert:
      properties:
        acknowledged_at:
          format: date-time
          type:
          - string
          - 'null'
        acknowledged_by:
          type:
          - string
          - 'null'
        auto_paused:
          type: boolean
        campaign_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        cap_amount:
          $ref: '#/components/schemas/AdvertisingMoney'
        cap_id:
          type:
          - string
          - 'null'
        condition:
          $ref: '#/components/schemas/AlertCondition'
        created_at:
          format: date-time
          type: string
        data_freshness:
          $ref: '#/components/schemas/DataFreshness'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        period:
          $ref: '#/components/schemas/BudgetPeriod'
        period_start:
          format: date
          type: string
        spend:
          $ref: '#/components/schemas/AdvertisingMoney'
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        threshold:
          format: int32
          minimum: 0
          type: integer
      required:
      - id
      - tenant_id
      - period
      - period_start
      - threshold
      - condition
      - spend
      - cap_amount
      - data_freshness
      - auto_paused
      - created_at
      type: object
    BudgetAlertsView:
      properties:
        alerts:
          items:
            $ref: '#/components/schemas/BudgetAlert'
          type: array
      required:
      - alerts
      type: object
    BudgetCap:
      properties:
        amount:
          $ref: '#/components/schemas/AdvertisingMoney'
        auto_pause:
          type: boolean
        auto_resume_on_rollover:
          type: boolean
        campaign_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        created_at:
          format: date-time
          type: string
        declared_fx_basis:
          type:
          - string
          - 'null'
        effective_currency:
          type: string
        fx_rate_date:
          format: date
          type:
          - string
          - 'null'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        period:
          $ref: '#/components/schemas/BudgetPeriod'
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
      - id
      - tenant_id
      - period
      - amount
      - effective_currency
      - auto_pause
      - auto_resume_on_rollover
      - version
      - created_at
      - updated_at
      type: object
    BudgetCapsView:
      properties:
        caps:
          items:
            $ref: '#/components/schemas/BudgetCap'
          type: array
      required:
      - caps
      type: object
    BudgetPeriod:
      enum:
      - daily
      - monthly
      type: string
    BudgetType:
      enum:
      - daily
      - lifetime
      - campaign_budget_optimization
      type: string
    Campaign:
      properties:
        ad_groups:
          items:
            $ref: '#/components/schemas/AdGroup'
          type: array
        budget:
          $ref: '#/components/schemas/Budget'
        drift:
          $ref: '#/components/schemas/DriftState'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        name:
          type: string
        objective:
          $ref: '#/components/schemas/Objective'
        schedule:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Schedule'
        status:
          $ref: '#/components/schemas/CampaignStatus'
      required:
      - id
      - name
      - status
      - objective
      - budget
      - ad_groups
      - drift
      type: object
    CampaignChange:
      properties:
        actor_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        after_state:
          $ref: '#/components/schemas/Campaign'
        attribution:
          type:
          - string
          - 'null'
        before_state:
          $ref: '#/components/schemas/Campaign'
        campaign_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        changed_fields:
          items:
            type: string
          type: array
        created_at:
          format: date-time
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        is_system:
          description: |-
            Explicit automated-actor marker (frontend TASK-018). Guardrail pauses
            set this to `true` with `actor_id: None` and
            `attribution: "system:budget_guardrail"`; every user action sets it
            to `false`. Derived from `attribution` (`system:` prefix) when reading
            rows written before this field existed, so old guardrail pauses
            resolve without a backfill migration.
          type: boolean
        metadata: {}
        mutation_id:
          format: uuid
          type:
          - string
          - 'null'
        revision:
          format: int64
          type: integer
        source:
          $ref: '#/components/schemas/ChangeSource'
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - id
      - tenant_id
      - campaign_id
      - revision
      - source
      - changed_fields
      - before_state
      - after_state
      - created_at
      type: object
    CampaignChangesView:
      properties:
        changes:
          items:
            $ref: '#/components/schemas/CampaignChange'
          type: array
      required:
      - changes
      type: object
    CampaignReviewStatusView:
      properties:
        ads:
          items:
            $ref: '#/components/schemas/AdReviewStatusView'
          type: array
        campaign_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        unmatched_platform_ads:
          $ref: '#/components/schemas/UnmatchedPlatformAds'
          description: |-
            What the platform listed that this campaign's tree cannot account
            for. Non-empty means the poll could not fully correlate — an
            all-pending `ads` list alongside platform-listed ids here is a
            correlation gap, not a clean "everything still in review".
      required:
      - campaign_id
      - ads
      - unmatched_platform_ads
      type: object
    CampaignStatus:
      enum:
      - draft
      - publishing
      - active
      - paused
      - ended
      - archived
      type: string
    CampaignView:
      description: |-
        One campaign plus the envelope fields the domain model does not carry:
        which connection it belongs to and the platform-assigned id once
        published.
      properties:
        campaign:
          $ref: '#/components/schemas/Campaign'
        connection_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        external_id:
          type:
          - string
          - 'null'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        platform:
          example: google_ads
          type: string
        revision:
          format: int64
          type: integer
      required:
      - id
      - connection_id
      - platform
      - revision
      - campaign
      type: object
    CampaignsView:
      properties:
        campaigns:
          items:
            $ref: '#/components/schemas/CampaignView'
          type: array
      required:
      - campaigns
      type: object
    CapabilityMatrix:
      description: Data consumed by both the validator and the frontend form engine.
      properties:
        budget_types:
          items:
            $ref: '#/components/schemas/BudgetType'
          type: array
          uniqueItems: true
        creative_placements:
          items:
            $ref: '#/components/schemas/CreativePlacement'
          type: array
        matrix_version:
          type: string
        minimum_budgets_minor:
          additionalProperties:
            additionalProperties:
              format: int64
              type: integer
            propertyNames:
              enum:
              - daily
              - lifetime
              - campaign_budget_optimization
              type: string
            type: object
          propertyNames:
            type: string
          type: object
        objectives:
          items:
            $ref: '#/components/schemas/Objective'
          type: array
          uniqueItems: true
        schedule_granularity:
          $ref: '#/components/schemas/ScheduleGranularity'
        targeting_dimensions:
          items:
            $ref: '#/components/schemas/TargetingDimension'
          type: array
          uniqueItems: true
        text_limits:
          additionalProperties:
            additionalProperties:
              minimum: 0
              type: integer
            propertyNames:
              type: string
            type: object
          description: Locale -> field name -> inclusive character limit.
          propertyNames:
            type: string
          type: object
      required:
      - matrix_version
      - objectives
      - budget_types
      - minimum_budgets_minor
      - schedule_granularity
      - targeting_dimensions
      - creative_placements
      - text_limits
      type: object
    ChangeSource:
      enum:
      - sanvi
      - platform
      type: string
    ClickIds:
      properties:
        capture_time:
          format: date-time
          type:
          - string
          - 'null'
        fbc:
          type:
          - string
          - 'null'
        fbp:
          type:
          - string
          - 'null'
        gbraid:
          type:
          - string
          - 'null'
        gclid:
          type:
          - string
          - 'null'
        landing_url:
          type:
          - string
          - 'null'
        wbraid:
          type:
          - string
          - 'null'
      type: object
    ConnectionAttentionView:
      properties:
        connection_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        last_error:
          type:
          - string
          - 'null'
        platform:
          type: string
        reconnect_required:
          type: boolean
        scopes_missing:
          items:
            type: string
          type: array
        stalled:
          type: boolean
        status:
          type: string
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - tenant_id
      - connection_id
      - platform
      - status
      - reconnect_required
      - scopes_missing
      - stalled
      type: object
    ConnectionFreshnessView:
      properties:
        connection_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        lag_hours:
          format: double
          type:
          - number
          - 'null'
        last_ingested_at:
          format: date-time
          type:
          - string
          - 'null'
        platform:
          type: string
        stalled:
          description: |-
            Ingestion is older than the configured freshness threshold — the
            dashboard's "sync failed" / "still updating" state, never presented
            as current.
          type: boolean
      required:
      - connection_id
      - platform
      - stalled
      type: object
    ConnectionHealthView:
      properties:
        can_sync:
          type: boolean
        can_upload_conversions:
          type: boolean
        last_error:
          type:
          - string
          - 'null'
        last_synced_at:
          format: date-time
          type:
          - string
          - 'null'
        reconnect_required:
          type: boolean
        scopes_missing:
          items:
            type: string
          type: array
        token_expires_at:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - can_sync
      - can_upload_conversions
      - scopes_missing
      - reconnect_required
      type: object
    ConnectionState:
      enum:
      - not_connected
      - connected
      type: string
    ConnectionsView:
      properties:
        connections:
          items:
            $ref: '#/components/schemas/AdvertisingConnectionView'
          type: array
      required:
      - connections
      type: object
    ConsentSnapshot:
      description: Capture-time directive proof required by every outbound upload.
      properties:
        answers:
          additionalProperties:
            type: string
          propertyNames:
            type: string
          type: object
        jurisdiction:
          type: string
        purposes_asked:
          items:
            type: string
          type: array
        resolver_version:
          type: string
        signal_source:
          type: string
      required:
      - resolver_version
      - jurisdiction
      - purposes_asked
      - answers
      - signal_source
      type: object
    ConversionDiagnostics:
      properties:
        captured_at:
          format: date-time
          type: string
        dedupe_key:
          description: |-
            The event's dedupe identity (frontend TASK-015). Duplicated from
            `event.dedupe_key` so clients need not reach into the event to find it.
          type: string
        dedupe_outcome:
          description: |-
            Per-event dedupe outcome: `"captured"` — this row won the immutable
            `(tenant_id, dedupe_key)` identity and any retry with the same key
            was dropped by the idempotent insert without creating a second row.
          type: string
        dedupe_source:
          description: |-
            How the identity was derived: `"order"` when `order_ref` is present
            (stable across webhook timing), `"client_event"` otherwise.
          type: string
        event:
          $ref: '#/components/schemas/ConversionEvent'
      required:
      - event
      - captured_at
      - dedupe_key
      - dedupe_source
      - dedupe_outcome
      type: object
    ConversionEvent:
      properties:
        click_ids:
          $ref: '#/components/schemas/ClickIds'
        consent:
          $ref: '#/components/schemas/ConsentSnapshot'
        dedupe_key:
          description: |-
            Immutable storage identity. For order-backed events this is derived
            from the order reference and event name, so a webhook state change
            cannot turn one purchase into two captured rows. Exposed so the
            diagnostics view (frontend TASK-015) renders the identity from data
            instead of re-deriving it with an explainer.
          type: string
        event_id:
          type: string
        hashed_identifiers:
          additionalProperties:
            $ref: '#/components/schemas/HashedIdentifier'
          propertyNames:
            type: string
          type: object
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        name:
          type: string
        occurred_at:
          format: date-time
          type: string
        order_ref:
          type:
          - string
          - 'null'
        subject_key:
          $ref: '#/components/schemas/SubjectKeyRef'
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        upload_states:
          additionalProperties:
            $ref: '#/components/schemas/UploadState'
          propertyNames:
            description: Adapter-owned identifier. Domain code never switches on a platform name.
            type: string
          type: object
        value:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AdvertisingMoney'
        value_source:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ValueSource'
      required:
      - id
      - tenant_id
      - event_id
      - dedupe_key
      - name
      - occurred_at
      - click_ids
      - hashed_identifiers
      - consent
      type: object
    CreateAdGroupRequest:
      properties:
        bid:
          $ref: '#/components/schemas/BidSettings'
        name:
          type: string
        targeting:
