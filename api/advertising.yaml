    get:
      operationId: get_tracking_site_key
      parameters:
      - description: |-
          Storefront origin to mint the site key for (must match the `Origin`
          header the pixel will later post with, e.g.
          `https://shop.example.com`).
        in: query
        name: origin
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
