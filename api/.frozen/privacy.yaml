components:
  schemas:
    AffectedSet:
      properties:
        jurisdictions:
          items:
            $ref: '#/components/schemas/JurisdictionRef'
          type: array
        subjects:
          format: int64
          minimum: 0
          type: integer
        tenants:
          format: int64
          minimum: 0
          type: integer
      required:
      - subjects
      - tenants
      - jurisdictions
      type: object
    AgeSignal:
      properties:
        birth_year:
          description: Declared birth year; `is_minor` wins when present.
          format: int32
          type:
          - integer
          - 'null'
        is_minor:
          type: boolean
      required:
      - is_minor
      type: object
    AgentInput:
      properties:
        agent_contact: {}
        agent_name:
          type: string
        authorization_evidence:
          description: 'Signed permission artifact: an opaque reference plus checksum.'
      required:
      - agent_name
      - authorization_evidence
      type: object
    Appeal:
      description: The appeal aggregate (US states with an appeal right).
      properties:
        authority_notice:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AuthorityContact'
        decided_at:
          format: date-time
          type:
          - string
          - 'null'
        decided_by:
          type:
          - string
          - 'null'
        decision_reason:
          type:
          - string
          - 'null'
        due_at:
          format: date-time
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        outcome:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AppealOutcome'
        reason:
          type: string
        received_at:
          format: date-time
          type: string
        request_id:
          type: string
      required:
      - id
      - request_id
      - reason
      - received_at
      - due_at
      type: object
    AppealOutcome:
      enum:
      - upheld
      - denied
      type: string
    AppealRequestOutput:
      properties:
        appeal_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        authority:
          $ref: '#/components/schemas/AuthorityContact'
          description: The state authority's complaint route, included up front.
        due_at:
          format: date-time
          type: string
      required:
      - appeal_id
      - due_at
      - authority
      type: object
    AppealRequestRequest:
      properties:
        reason:
          type: string
      required:
      - reason
      type: object
    AppealStatusView:
      properties:
        appeal_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        authority_notice:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AuthorityContact'
        decided_at:
          format: date-time
          type:
          - string
          - 'null'
        due_at:
          format: date-time
          type: string
        outcome:
          type:
          - string
          - 'null'
        reason:
          type: string
      required:
      - appeal_id
      - reason
      - due_at
      type: object
    ApplyLegalHoldCommand:
      properties:
        reason:
          type: string
        scope: {}
      required:
      - scope
      - reason
      type: object
    AuthorityContact:
      properties:
        complaint_url:
          type: string
        name:
          type: string
      required:
      - name
      - complaint_url
      type: object
    BreachIncident:
      description: A breach incident aggregate; obligations are computed per jurisdiction.
      properties:
        affected:
          $ref: '#/components/schemas/AffectedSet'
        contained_at:
          format: date-time
          type:
          - string
          - 'null'
        created_by:
          type:
          - string
          - 'null'
        data_classes:
          items:
            $ref: '#/components/schemas/DataClass'
          type: array
        discovered_at:
          format: date-time
          type: string
        encrypted_at_rest:
          type: boolean
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        notes:
          type:
          - string
          - 'null'
      required:
      - id
      - discovered_at
      - affected
      - data_classes
      - encrypted_at_rest
      type: object
    BreachRuleSet:
      description: |-
        Breach-notification rules per jurisdiction. jsonb in the database so a
        new law is a data change; typed here so the calculator cannot misparse.
      properties:
        authority_due_days:
          description: |-
            Deadline to notify the authority, in days (states without an
            hour-level rule).
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        authority_due_hours:
          description: Deadline to notify the supervisory authority, in hours.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        authority_threshold:
          description: |-
            Minimum number of affected subjects before the authority must be
            notified at all (several US states).
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        consumer_due_days:
          description: Deadline to notify consumers, in days.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        consumer_threshold:
          description: Minimum affected count before consumers must be notified.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        encryption_safe_harbour:
          description: |-
            Whether encryption-at-rest of the compromised data suppresses the
            obligations this rule set marks as encryption-exempt (safe harbour).
          type: boolean
      required:
      - encryption_safe_harbour
      type: object
    ConsentChangeRequest:
      properties:
        granted:
          type: boolean
        locale:
          type:
          - string
          - 'null'
        method:
          type: string
        notice_version:
          type: string
        purpose:
          $ref: '#/components/schemas/ProcessingPurpose'
        signal_source:
          type:
          - string
          - 'null'
      required:
      - purpose
      - granted
      - notice_version
      - method
      type: object
    ConsentMethod:
      description: How consent was recorded (drives proof requirements).
      enum:
      - consent
      - opt_out
      - withdrawal
      - guardian_consent
      type: string
    ConsentModel:
      description: |-
        How non-essential processing may start: permission first (EU/UK/JP) or
        notice with an honoured refusal (US states).
      enum:
      - opt_in
      - notice_and_opt_out
      type: string
    ConsentRecord:
      description: A consent/directive ledger entry.
      properties:
        evidence: {}
        granted:
          type: boolean
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        jurisdiction:
          $ref: '#/components/schemas/JurisdictionRef'
        locale:
          type:
          - string
          - 'null'
        method:
          $ref: '#/components/schemas/ConsentMethod'
        notice_version:
          type: string
        purpose:
          $ref: '#/components/schemas/ProcessingPurpose'
        recorded_at:
          format: date-time
          type: string
        signal_source:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SignalSource'
        subject_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        subject_ref:
          $ref: '#/components/schemas/SubjectRef'
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        withdrawn_at:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - id
      - subject_ref
      - purpose
      - granted
      - notice_version
      - method
      - evidence
      - jurisdiction
      - recorded_at
      type: object
    ControllerRole:
      enum:
      - controller
      - processor
      - business
      - service_provider
      type: string
    Correction:
      description: One field correction (rectification).
      properties:
        context:
          type: string
        field:
          type: string
        value:
          type: string
      required:
      - context
      - field
      - value
      type: object
    DataClass:
      description: |-
        A data class: the granularity at which the data map, retention rules and
        breach classification operate. The registry below is the compile-time
        data map; every provider names its classes from it.
      enum:
      - identity_profile
      - authentication
      - membership
      - contact
      - billing
      - invoice
      - transaction_record
      - audit_log
      - consent_record
      - preference
      - communication
      - jurisdiction
      - request_record
      - advertising_conversion_event
      - advertising_metric
      - advertising_campaign_change
      - advertising_budget_cap
      - advertising_budget_alert
      - media_asset
      type: string
    DecideAppealOutput:
      properties:
        appeal_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        authority:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AuthorityContact'
        decided_at:
          format: date-time
          type: string
        outcome:
          $ref: '#/components/schemas/AppealOutcome'
      required:
      - appeal_id
      - outcome
      - decided_at
      type: object
    DecideAppealRequest:
      properties:
        outcome:
          $ref: '#/components/schemas/AppealOutcome'
        reason:
          type: string
      required:
      - outcome
      - reason
      type: object
    DirectiveSnapshot:
      description: The full resolved state for one subject.
      properties:
        directives:
          items:
            $ref: '#/components/schemas/PurposeDirective'
          type: array
        honours_universal_opt_out:
          type: boolean
        jurisdiction:
          $ref: '#/components/schemas/JurisdictionRef'
        minor_opt_in_age:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        subject:
          $ref: '#/components/schemas/SubjectRef'
      required:
      - subject
      - jurisdiction
      - directives
      - honours_universal_opt_out
      type: object
    DirectiveSource:
      description: |-
        Where a directive's state came from. The jurisdiction profile supplies
        the default; everything else is an explicit subject action or signal.
      enum:
      - consent
      - opt_out
      - signal
      - default
      - guardian
      type: string
    DirectiveState:
      description: The resolved answer for one purpose.
      enum:
      - allowed
      - denied
      type: string
    DsrKind:
      description: |-
        A DSR kind. `KnowCategories` is the CCPA "right to know" (categories
        only, no contents).
      enum:
      - access
      - export
      - erasure
      - rectification
      - restriction
      - objection
      - opt_out_sale_or_share
      - opt_out_targeted_advertising
      - opt_out_profiling
      - limit_sensitive_use
      - know_categories
      type: string
    DsrStatus:
      enum:
      - awaiting_verification
      - in_progress
      - partially_complete
      - completed
      - rejected
      - on_hold
      - under_appeal
      type: string
    EvidenceInput:
      properties:
        kind:
          type: string
        value:
          type: string
      required:
      - kind
      - value
      type: object
    GetDirectivesOutput:
      properties:
        snapshot:
          $ref: '#/components/schemas/DirectiveSnapshot'
      required:
      - snapshot
      type: object
    GetRequestStatusOutput:
      properties:
        acknowledged_at:
          format: date-time
          type:
          - string
          - 'null'
        appeal:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AppealStatusView'
        completed_at:
          format: date-time
          type:
          - string
          - 'null'
        due_at:
          format: date-time
          type: string
        export_available:
          type: boolean
        extended_to:
          format: date-time
          type:
          - string
          - 'null'
        jurisdiction:
          type: string
        kind:
          $ref: '#/components/schemas/DsrKind'
        received_at:
          format: date-time
          type: string
        rejection_reason:
          type:
          - string
          - 'null'
        request_id:
          type: string
        status:
          $ref: '#/components/schemas/DsrStatus'
        submitted_by:
          $ref: '#/components/schemas/Requester'
      required:
      - request_id
      - kind
      - status
      - received_at
      - due_at
      - jurisdiction
      - submitted_by
      - export_available
      type: object
    JurisdictionProfile:
      properties:
        ack_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        appeal_response_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        appeal_window_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        authority:
          $ref: '#/components/schemas/AuthorityContact'
        breach_rules:
          $ref: '#/components/schemas/BreachRuleSet'
        code:
          $ref: '#/components/schemas/JurisdictionRef'
        consent_model:
          $ref: '#/components/schemas/ConsentModel'
        effective_from:
          format: date
          type: string
        extension_days:
          format: int32
          minimum: 0
          type: integer
        honours_universal_opt_out:
          type: boolean
        minor_opt_in_age:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        opt_out_effective_business_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        regime:
          $ref: '#/components/schemas/Regime'
        response_days:
          format: int32
          minimum: 0
          type: integer
        risk_assessment_required:
          type: boolean
        sensitive_model:
          $ref: '#/components/schemas/SensitiveModel'
        source_note:
          type:
          - string
          - 'null'
      required:
      - code
      - regime
      - consent_model
      - sensitive_model
      - response_days
      - extension_days
      - honours_universal_opt_out
      - risk_assessment_required
      - breach_rules
      - authority
      - effective_from
      type: object
    JurisdictionRef:
      description: |-
        A jurisdiction code (`eu`, `uk`, `jp`, `us-ca`, …). Parsed, never
        free-form, so a typo fails at the boundary rather than silently falling
        back to the most protective profile.
      type: string
    LegalBasis:
      description: A legal basis for processing a data class.
      enum:
      - contract
      - legal_obligation
      - consent
      - legitimate_interest
      - notice_opt_out
      - statutory_retention
      type: string
    LegalHold:
      description: 'A legal hold: blocks erasure for the named scope until released.'
      properties:
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        reason:
          type: string
        released_at:
          format: date-time
          type:
          - string
          - 'null'
        released_by:
          type:
          - string
          - 'null'
        scope: {}
      required:
      - id
      - scope
      - reason
      - created_by
      - created_at
      type: object
    LimitSensitiveRequest:
      properties:
        source:
          type:
          - string
          - 'null'
      type: object
    MarkBreachNotifiedCommand:
      properties:
        artifact: {}
        audience:
          type: string
        jurisdiction:
          type: string
      required:
      - jurisdiction
      - audience
      type: object
    NoticeAtCollectionView:
      description: |-
        The notice at collection (served before any collection happens): the
        categories collected, the purposes, sale/share status and retention
        summary.
      properties:
        categories:
          items:
            type: string
          type: array
        notice_version:
          type: string
        opt_out_effective_business_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        purposes:
          items:
            type: string
          type: array
        retention_summary:
          items:
            $ref: '#/components/schemas/RetentionNoticeRow'
          type: array
        sale_or_share:
          type: boolean
        sensitive_pi:
          type: boolean
        targeted_advertising:
          type: boolean
      required:
      - notice_version
      - categories
      - purposes
      - sale_or_share
      - targeted_advertising
      - sensitive_pi
      - retention_summary
      type: object
    NoticeJurisdictionView:
      properties:
        appeal_window_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        code:
          type: string
        consent_model:
          type: string
        honours_universal_opt_out:
          type: boolean
        regime:
          type: string
        response_days:
          format: int32
          minimum: 0
          type: integer
      required:
      - code
      - regime
      - consent_model
      - response_days
      - honours_universal_opt_out
      type: object
    NotificationObligation:
      description: One computed notification obligation.
      properties:
        artifact: {}
        audience:
          $ref: '#/components/schemas/ObligationAudience'
        due_at:
          format: date-time
          type: string
        jurisdiction:
          $ref: '#/components/schemas/JurisdictionRef'
        notified_at:
          format: date-time
          type:
          - string
          - 'null'
        suppressed_by_encryption:
          type: boolean
      required:
      - jurisdiction
      - audience
      - due_at
      - suppressed_by_encryption
      type: object
    ObligationAudience:
      enum:
      - authority
      - consumer
      - tenant
      type: string
    PrivacyNoticeView:
      properties:
        backup_retention_days:
          format: int64
          type: integer
        jurisdictions:
          items:
            $ref: '#/components/schemas/NoticeJurisdictionView'
          type: array
        notice_version:
          type: string
        retention:
          items:
            $ref: '#/components/schemas/RetentionNoticeRow'
          type: array
        subprocessors:
          items:
            $ref: '#/components/schemas/SubProcessorNoticeRow'
          type: array
      required:
      - notice_version
      - jurisdictions
      - retention
      - subprocessors
      - backup_retention_days
      type: object
    ProblemDetail:
      allOf:
      - description: |-
          RFC 9457 extension members for problem classes that carry
          structured extras (the disconnect conflict names its blockers,
          for example). Flattened onto the JSON object exactly as the RFC
          prescribes; carrying them here keeps the error-enrichment layer
          from stripping them. Absent otherwise.
        type:
        - object
        - 'null'
      - properties:
          detail:
            description: Human-readable explanation of this specific occurrence.
            type: string
          instance:
            description: URI of the offending resource, if any.
            type:
            - string
            - 'null'
          reason:
            description: |-
              Machine-readable reason for statuses that carry one (e.g. tenant
              suspension); absent otherwise.
            type:
            - string
            - 'null'
          status:
            description: HTTP status code (mirrors the response code).
            format: int32
            minimum: 0
            type: integer
          title:
            description: Short, human-readable, stable title.
            type: string
          trace_id:
            description: |-
              Correlates with the trace in OpenObserve: the W3C trace id of the
              span serving the request (the same trace the `traceparent` response
              header references), falling back to the request id when the request
              ran outside any OpenTelemetry context.
            type:
            - string
            - 'null'
          type:
            description: Stable URI identifying the error class.
            example: https://sanvi.dev/problems/bad-request
            type: string
        required:
        - type
        - title
        - status
        - detail
        type: object
      description: RFC 9457 problem detail. This is the only error body the API produces.
    ProcessingActivity:
      description: |-
        An Art. 30 processing record (versioned; the active row describes the
        current processing).
      properties:
        active:
          type: boolean
        basis:
          type:
          - string
          - 'null'
        controller_role:
          $ref: '#/components/schemas/ControllerRole'
        created_at:
          format: date-time
          type: string
        created_by:
          type:
          - string
          - 'null'
        data_classes:
          items:
            $ref: '#/components/schemas/DataClass'
          type: array
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        name:
          type: string
        purpose:
          type: string
        supersedes:
          type:
          - string
          - 'null'
        version:
          format: int32
          type: integer
      required:
      - id
      - name
      - purpose
      - data_classes
      - controller_role
      - version
      - active
      - created_at
      type: object
    ProcessingPurpose:
      description: |-
        A processing purpose. `Essential` can never be denied and is never
        consentable; everything else resolves through the directive engine.
      enum:
      - essential
      - analytics
      - marketing_email
      - ads_personalisation
      - ads_measurement
      - session_replay
      - sale_or_share
      - targeted_advertising
      - profiling_significant_effects
      - sensitive_pi_use
      type: string
    PublicMetricsRow:
      properties:
        complied:
          format: int32
          type: integer
        denied:
          format: int32
          type: integer
        jurisdiction:
          type: string
        kind:
          type: string
        median_days:
          format: double
          type:
          - number
          - 'null'
        received:
          format: int32
          type: integer
        year:
          format: int32
          type: integer
      required:
      - year
      - jurisdiction
      - kind
      - received
      - complied
      - denied
      type: object
    PurposeDirective:
      description: |-
        One resolved answer per purpose, with the provenance the privacy centre
        renders.
      properties:
        effective_at:
          format: date-time
          type: string
        jurisdiction:
          $ref: '#/components/schemas/JurisdictionRef'
        notice_version:
          type:
          - string
          - 'null'
        purpose:
          $ref: '#/components/schemas/ProcessingPurpose'
        source:
          $ref: '#/components/schemas/DirectiveSource'
        state:
          $ref: '#/components/schemas/DirectiveState'
        superseded_at:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - purpose
      - state
      - source
      - jurisdiction
      - effective_at
      type: object
    RecordBreachIncidentCommand:
      properties:
        contained_at:
          format: date-time
          type:
          - string
          - 'null'
        data_classes:
          items:
            type: string
          type: array
        discovered_at:
          format: date-time
          type: string
        encrypted_at_rest:
          type: boolean
        jurisdictions:
          items:
            type: string
          type: array
        notes:
          type:
          - string
          - 'null'
        subjects:
          format: int64
          minimum: 0
          type: integer
        tenants:
          format: int64
          minimum: 0
          type: integer
      required:
      - discovered_at
      - subjects
      - tenants
      - jurisdictions
      - data_classes
      - encrypted_at_rest
      type: object
    RecordBreachIncidentOutput:
      properties:
        incident_id:
          type: string
        obligations:
          items:
            $ref: '#/components/schemas/NotificationObligation'
          type: array
      required:
      - incident_id
      - obligations
      type: object
    RecordConsentChangeOutput:
      properties:
        purpose:
          $ref: '#/components/schemas/ProcessingPurpose'
        source:
          $ref: '#/components/schemas/DirectiveSource'
        state:
          $ref: '#/components/schemas/DirectiveState'
      required:
      - purpose
      - state
      - source
      type: object
    RecordOptOutCommand:
      properties:
        device_ref:
          type:
          - string
          - 'null'
        purposes:
          items:
            $ref: '#/components/schemas/ProcessingPurpose'
          type: array
        source:
          description: '`ui` | `api` | `gpc` — the GPC header path supplies `gpc`.'
          type: string
      required:
      - purposes
      - source
      type: object
    RecordOptOutOutput:
      properties:
        directives:
          items:
            $ref: '#/components/schemas/PurposeDirective'
          type: array
        jurisdiction:
          type: string
      required:
      - directives
      - jurisdiction
      type: object
    RectifyRequest:
      properties:
        corrections:
          items:
            $ref: '#/components/schemas/Correction'
          type: array
      required:
      - corrections
      type: object
    Regime:
      description: |-
        The legal regime a jurisdiction belongs to; drives nothing by itself —
        every decision reads the profile's model fields instead.
      enum:
      - gdpr
      - uk_gdpr
      - appi
      - us_state
      type: string
    RejectRequestRequest:
      properties:
        reason:
          type: string
      required:
      - reason
      type: object
    RequestOperatorView:
      properties:
        completed_at:
          format: date-time
          type:
          - string
          - 'null'
        due_at:
          format: date-time
          type: string
        jurisdiction:
          type: string
        kind:
          $ref: '#/components/schemas/DsrKind'
        received_at:
          format: date-time
          type: string
        rejection_reason:
          type:
          - string
          - 'null'
        request_id:
          type: string
        status:
          $ref: '#/components/schemas/DsrStatus'
        subject_key:
          type: string
        submitted_by:
          $ref: '#/components/schemas/Requester'
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - request_id
      - subject_key
      - kind
      - status
      - received_at
      - due_at
      - jurisdiction
      - submitted_by
      type: object
    Requester:
      description: Who submitted a request.
      enum:
      - subject
      - authorized_agent
      - tenant_operator
      type: string
    RetentionAction:
      description: What the retention sweep does when a class's period expires.
      enum:
      - delete
      - anonymise
      - archive
      type: string
    RetentionNoticeRow:
      properties:
        action:
          type: string
        category:
          type: string
        period_days:
          format: int64
          type: integer
      required:
      - category
      - period_days
      - action
      type: object
    RetentionRule:
      description: A retention rule (one row of the data map's operational half).
      properties:
        action:
          $ref: '#/components/schemas/RetentionAction'
        basis:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LegalBasis'
        data_class:
          $ref: '#/components/schemas/DataClass'
        disclosed_in_notice:
          type: boolean
        period_days:
          format: int64
          type: integer
        sensitivity:
          $ref: '#/components/schemas/SensitivityClass'
      required:
      - data_class
      - sensitivity
      - period_days
      - action
      - disclosed_in_notice
      type: object
    RiskAssessment:
      description: A DPIA / US state data-protection assessment.
      properties:
        activity_id:
          type: string
        created_at:
          format: date-time
          type: string
        findings: {}
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        jurisdictions:
          items:
            $ref: '#/components/schemas/JurisdictionRef'
          type: array
        mitigations: {}
        next_review_at:
          format: date-time
          type:
          - string
          - 'null'
        reviewed_at:
          format: date-time
          type:
          - string
          - 'null'
        reviewed_by:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/RiskAssessmentStatus'
        trigger:
          $ref: '#/components/schemas/RiskAssessmentTrigger'
      required:
      - id
      - activity_id
      - jurisdictions
      - trigger
      - status
      - created_at
      type: object
    RiskAssessmentStatus:
      enum:
      - open
      - in_review
      - approved
      - superseded
      type: string
    RiskAssessmentTrigger:
      enum:
      - targeted_ads
      - sale
      - sensitive
      - profiling
      - large_scale
      - health_data
      type: string
    SensitiveModel:
      description: |-
        How sensitive-personal-information processing starts: permission first,
        a "limit my use" directive (CA), or notice only.
      enum:
      - opt_in
      - limit_on_request
      - notice_only
      type: string
    SensitivityClass:
      description: |-
        The sensitivity class of a mapped personal-data field. Drives the CA
        "limit use" right, the non-CA opt-in for sensitive data, and the flagged
        health-data and minors classes that trigger consent-first handling.
      enum:
      - standard
      - sensitive
      - special
      - flagged_health
      - minors
      type: string
    SignalSource:
      enum:
      - ui
      - api
      - gpc
      - uoom
      - guardian
      - import
      type: string
    SubProcessor:
      description: |-
        A sub-processor registry row. `role` is the field that turns an
        ad-platform upload into a "sale"/"share" under US law — it is required
        and asserted by phase 10's uploads.
      properties:
        added_at:
          format: date-time
          type: string
        contract_terms: {}
        dpa_url:
          type:
          - string
          - 'null'
        location:
          type: string
        name:
          type: string
        purpose:
          type: string
        removed_at:
          format: date-time
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/SubProcessorRole'
        transfer_mechanism:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TransferMechanism'
      required:
      - name
      - purpose
      - location
      - role
      - contract_terms
      - added_at
      type: object
    SubProcessorNoticeRow:
      properties:
        location:
          type: string
        name:
          type: string
        purpose:
          type: string
        role:
          type: string
        transfer_mechanism:
          type:
          - string
          - 'null'
      required:
      - name
      - purpose
      - location
      - role
      type: object
    SubProcessorRole:
      enum:
      - processor
      - service_provider
      - contractor
      - third_party
      type: string
    SubjectIdentifier:
      description: |-
        One identifier by which a subject can be looked up (email, platform user
        id, tenant-internal customer id, …).
      properties:
        type:
          type: string
        value:
          type: string
      required:
      - type
      - value
      type: object
    SubjectInput:
      description: The subject a request targets, as supplied by the requester.
      properties:
        age_signal:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AgeSignal'
            description: |-
              Age signal for the minor rules (e.g. declared age or a guardian
              attestation payload).
        email:
          type:
          - string
          - 'null'
        evidence:
          description: |-
            Jurisdiction evidence, most trusted first (country codes: `DE`,
            `GB`, `US-CA`, …).
          items:
            $ref: '#/components/schemas/EvidenceInput'
          type: array
        external_id:
          type:
          - string
          - 'null'
        kind:
          description: '`user` (authenticated), `end_user` (tenant customer), `email`.'
          type: string
      required:
      - kind
      - evidence
      type: object
    SubjectKind:
      description: Who the personal data belongs to, relative to the platform.
      enum:
      - tenant_user
      - end_user
      - contact
      - device
      type: string
    SubjectRef:
      description: |-
        The cross-context reference to a data subject. `key` is the canonical,
        stable key used for directive materialisation and crypto-shredding:
        `user:{snowflake}`, `end_user:{tenant_id}:{external_id}`, `email:{addr}` or
        `device:{device_ref}`.
      properties:
        identifiers:
          items:
            $ref: '#/components/schemas/SubjectIdentifier'
          type: array
        key:
          type: string
        kind:
          $ref: '#/components/schemas/SubjectKind'
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - kind
      - key
      - identifiers
      type: object
    SubmitDsrCommand:
      properties:
        agent:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AgentInput'
        kind:
          $ref: '#/components/schemas/DsrKind'
        note:
          type:
          - string
          - 'null'
        requester:
          $ref: '#/components/schemas/Requester'
        subject:
          $ref: '#/components/schemas/SubjectInput'
      required:
      - subject
      - kind
      - requester
      type: object
    SubmitDsrOutput:
      properties:
        challenge_id:
          type:
          - string
          - 'null'
        due_at:
          format: date-time
          type: string
        effective_immediately:
          description: |-
            Opt-out kinds take effect immediately and never require
            verification.
          type: boolean
        extended_to:
          format: date-time
          type:
          - string
          - 'null'
        jurisdiction:
          type: string
        request_id:
          type: string
        status:
          $ref: '#/components/schemas/DsrStatus'
        verification_required:
          description: Present when verification is required before disclosure/deletion.
          type: boolean
        verification_token:
          description: |-
            Opaque half of the verification credential. The OTP is delivered
            out-of-band, so neither response nor notification is sufficient alone.
          type:
          - string
          - 'null'
      required:
      - request_id
      - status
      - due_at
      - jurisdiction
      - verification_required
      - effective_immediately
      type: object
    TransferMechanism:
      enum:
      - sccs
      - uk_addendum
      - dpf
      - appi_equivalent
      - none
      type: string
    UpsertActivityCommand:
      properties:
        basis:
          type:
          - string
          - 'null'
        controller_role:
          type: string
        data_classes:
          items:
            type: string
          type: array
        name:
          type: string
        purpose:
          type: string
      required:
      - name
      - purpose
      - data_classes
      - controller_role
      type: object
    UpsertAssessmentCommand:
      properties:
        activity_id:
          type: string
        findings: {}
        jurisdictions:
          items:
            type: string
          type: array
        mitigations: {}
        next_review_at:
          format: date-time
          type:
          - string
          - 'null'
        status:
          type: string
        trigger:
          type: string
      required:
      - activity_id
      - jurisdictions
      - trigger
      - status
      type: object
    UpsertJurisdictionCommand:
      properties:
        ack_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        appeal_response_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        appeal_window_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        authority:
          $ref: '#/components/schemas/AuthorityContact'
        breach_rules:
          $ref: '#/components/schemas/BreachRuleSet'
        code:
          type: string
        consent_model:
          type: string
        extension_days:
          format: int32
          minimum: 0
          type: integer
        honours_universal_opt_out:
          type: boolean
        minor_opt_in_age:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        opt_out_effective_business_days:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        regime:
          type: string
        response_days:
          format: int32
          minimum: 0
          type: integer
        risk_assessment_required:
          type: boolean
        sensitive_model:
          type: string
        source_note:
          type:
          - string
          - 'null'
      required:
      - code
      - regime
      - consent_model
      - sensitive_model
      - response_days
      - extension_days
      - honours_universal_opt_out
      - risk_assessment_required
      - breach_rules
      - authority
      type: object
    UpsertRetentionRuleCommand:
      properties:
        action:
          type: string
        basis:
          type:
          - string
          - 'null'
        data_class:
          type: string
        disclosed_in_notice:
          type: boolean
        period_days:
          format: int64
          type: integer
        sensitivity:
          type: string
      required:
      - data_class
      - sensitivity
      - period_days
      - action
      - disclosed_in_notice
      type: object
    UpsertSubProcessorCommand:
      properties:
        contract_terms: {}
        dpa_url:
          type:
          - string
          - 'null'
        location:
          type: string
        name:
          type: string
        purpose:
          type: string
        role:
          type: string
        transfer_mechanism:
          type:
          - string
          - 'null'
      required:
      - name
      - purpose
      - location
      - role
      - contract_terms
      type: object
    VerifyRequestOutput:
      properties:
        due_at:
          format: date-time
          type: string
        request_id:
          type: string
        status:
          $ref: '#/components/schemas/DsrStatus'
      required:
      - request_id
      - status
      - due_at
      type: object
    VerifyRequestRequest:
      properties:
        code:
          type: string
        token:
          type: string
      required:
      - token
      - code
      type: object
info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/platform/privacy/activities:
    get:
      operationId: list_activities
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProcessingActivity'
                type: array
          description: Processing activities
      summary: '`GET /api/v1/platform/privacy/activities` — Art. 30 records.'
      tags:
      - privacy
    post:
      operationId: upsert_activity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertActivityCommand'
        required: true
      responses:
        '201':
          content:
            text/plain:
              schema:
                type: string
          description: Recorded
      summary: |-
        `POST /api/v1/platform/privacy/activities` — record a processing
        activity.
      tags:
      - privacy
  /api/v1/platform/privacy/appeals:
    get:
      operationId: list_appeals
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last item of the previous page. Absent for the
          first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Appeal'
                type: array
          description: One page of open appeals, oldest first
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout - the request exceeded its budget
      summary: '`GET /api/v1/platform/privacy/appeals` — open appeals.'
      tags:
      - privacy
  /api/v1/platform/privacy/appeals/{id}/decision:
    post:
      operationId: decide_appeal
      parameters:
      - description: The appeal id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideAppealRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideAppealOutput'
          description: Decision recorded
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Self-review refused
      summary: |-
        `POST /api/v1/platform/privacy/appeals/{id}/decision` — second-operator
        review.
      tags:
      - privacy
  /api/v1/platform/privacy/assessments:
    get:
      operationId: list_assessments
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last item of the previous page. Absent for the
          first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RiskAssessment'
                type: array
          description: One page of risk assessments, newest first
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout - the request exceeded its budget
      summary: |-
        `GET /api/v1/platform/privacy/assessments` — risk assessments (DPIA +
        US state data-protection assessments).
      tags:
      - privacy
    post:
      operationId: upsert_assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAssessmentCommand'
        required: true
      responses:
        '201':
          content:
            text/plain:
              schema:
                type: string
          description: Recorded
      summary: '`POST /api/v1/platform/privacy/assessments` — record an assessment.'
      tags:
      - privacy
  /api/v1/platform/privacy/holds:
    get:
      operationId: list_holds
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last item of the previous page. Absent for the
          first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LegalHold'
                type: array
          description: One page of legal holds, newest first
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout - the request exceeded its budget
      summary: '`GET /api/v1/platform/privacy/holds` — legal holds.'
      tags:
      - privacy
    post:
      operationId: apply_hold
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyLegalHoldCommand'
        required: true
      responses:
        '201':
          content:
            text/plain:
              schema:
                type: string
          description: Hold applied
      summary: |-
        `POST /api/v1/platform/privacy/holds` — apply a legal hold (blocks
        erasure; audited).
      tags:
      - privacy
  /api/v1/platform/privacy/holds/{id}/release:
    post:
      operationId: release_hold
      parameters:
      - description: The hold id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          description: Hold released
      summary: '`POST /api/v1/platform/privacy/holds/{id}/release` — release a hold.'
      tags:
      - privacy
  /api/v1/platform/privacy/incidents:
    get:
      operationId: list_incidents
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last item of the previous page. Absent for the
          first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BreachIncident'
                type: array
          description: One page of incidents, newest first
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout - the request exceeded its budget
      summary: '`GET /api/v1/platform/privacy/incidents` — breach incidents.'
      tags:
      - privacy
    post:
      operationId: record_incident
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordBreachIncidentCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordBreachIncidentOutput'
          description: Incident + obligations
      summary: |-
        `POST /api/v1/platform/privacy/incidents` — record an incident; the
        response includes the computed per-jurisdiction obligations.
      tags:
      - privacy
  /api/v1/platform/privacy/incidents/{id}/notify:
    post:
      operationId: mark_obligation_notified
      parameters:
      - description: The incident id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkBreachNotifiedCommand'
        required: true
      responses:
        '200':
          description: Recorded
      summary: |-
        `POST /api/v1/platform/privacy/incidents/{id}/notify` — record a
        discharged obligation.
      tags:
      - privacy
  /api/v1/platform/privacy/incidents/{id}/obligations:
    get:
      operationId: list_obligations
      parameters:
      - description: The incident id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
