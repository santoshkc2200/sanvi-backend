info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/system/build:
    get:
      operationId: build
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildDetails'
          description: Release stamp of the running binary
          headers:
            Cache-Control:
              description: public — the stamp is identical for every caller of a build
              schema:
                type: string
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: |-
        Build probe: `GET /api/v1/system/build` (FR-1102). Unauthenticated and
        cacheable so RUM, the error tracker and load tools can stamp a
        measurement with the exact build that produced it; carries no tenant
        data.
      tags:
      - system
  /api/v1/system/health:
    get:
      operationId: health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResult'
          description: Process is alive
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: |-
        Liveness under the versioned API: `GET /api/v1/system/health` (TASK-025).
        Identical semantics to `GET /healthz` — process aliveness only, never a
        database or cache touch — so an orchestrator that can only reach the
        API surface gets a probe that cannot turn a slow database into
        "every instance unhealthy".
      tags:
      - system
  /api/v1/system/ready:
    get:
      operationId: ready
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStates'
          description: All dependencies healthy
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStates'
          description: At least one dependency is degraded
      summary: |-
        Readiness as states: `GET /api/v1/system/ready` (TASK-025). The
        dependency checks run concurrently under their own budget and this
        handler wraps the fan-out in a response timeout of its own, so the
        endpoint answers within `budget + grace` no matter what a dependency
        does — and the body reports states only, never error strings.
      tags:
      - system
  /api/v1/system/version:
    get:
      operationId: version
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildInfo'
          description: Build information
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: 'Build/version info: `GET /api/v1/system/version`.'
      tags:
      - system
  /healthz:
    get:
      operationId: liveness
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResult'
          description: Process is alive
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: 'Liveness: `GET /healthz`. Never depends on anything else.'
      tags:
      - system
  /readyz:
    get:
      operationId: readiness
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: All dependencies healthy
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: At least one dependency is degraded
      summary: 'Readiness: `GET /readyz`. Degrades (503) when a dependency is down.'
      tags:
      - system
