components:
  schemas:
    AvailableThemeView:
      description: A theme in the tenant-facing catalog (entitlement-filtered).
      properties:
        capabilities:
          items:
            type: string
          type: array
        dark_mode:
          type: boolean
        key:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedName'
        preview_url:
          type:
          - string
          - 'null'
        required_feature:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/ThemeStatus'
        version:
          type: string
        visibility:
          $ref: '#/components/schemas/ThemeVisibility'
      required:
      - key
      - name
      - version
      - capabilities
      - visibility
      - status
      - dark_mode
      type: object
    AvailableThemesView:
      properties:
        themes:
          items:
            $ref: '#/components/schemas/AvailableThemeView'
          type: array
      required:
      - themes
      type: object
    BrandAsset:
      description: One validated, stored brand asset.
      properties:
        digest:
          description: The sha256 digest of the stored bytes (content-addressed file name).
          type: string
        ext:
          description: The stored extension, e.g. `png`.
          type: string
        kind:
          $ref: '#/components/schemas/BrandAssetKind'
        mime:
          type: string
        uploaded_at:
          format: date-time
          type: string
      required:
      - kind
      - digest
      - mime
      - ext
      - uploaded_at
      type: object
    BrandAssetKind:
      description: The brand asset kinds a tenant can upload.
      enum:
      - logo
      - favicon
      - og_image
      type: string
    BrandAssetUrls:
      description: Absolute URLs for a tenant's brand assets.
      properties:
        favicon:
          type:
          - string
          - 'null'
        logo:
          type:
          - string
          - 'null'
        og_image:
          type:
          - string
          - 'null'
      type: object
    BrandAssets:
      description: The tenant's brand assets.
      properties:
        favicon:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BrandAsset'
        logo:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BrandAsset'
        og_image:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BrandAsset'
      type: object
    FieldIssue:
      description: |-
        One field-addressed validation issue (TASK-027, FR-1127).

        A validation error that names the input it belongs to lets a client
        build an error summary that links back to the offending field instead
        of guessing from a flat string. `field` is the request-body path,
        root-relative, with bracketed indices for sequence elements
        (`hostname`, `budget.amount.currency`,
        `ad_groups[2].ads[0].creative.placement`) — the same grammar the
        advertising capability matrix already speaks.
      properties:
        field:
          description: Root-relative path to the offending request field.
          type: string
        message:
          description: |-
            Why this field was rejected. Human-readable; `detail` stays the
            request-level summary and is never a replacement for it.
          type: string
      required:
      - field
      - message
      type: object
    FontSpec:
      description: |-
        A font the theme uses. Self-hosted only — no remote `@import` is ever
        possible through this schema.
      properties:
        family:
          type: string
        source:
          type: string
        subsets:
          items:
            type: string
          type: array
      required:
      - family
      - subsets
      - source
      type: object
    InstallThemeVersionCommand:
      description: |-
        The command a theme artifact resolves to after the publish pipeline
        validated it (manifest schema, token schema, contrast gate).
      properties:
        allow_contrast_warnings:
          description: Explicit override for the contrast gate (recorded, never silent).
          type: boolean
        artifact_digest:
          description: sha256 digest the artifact must match.
          type: string
        artifact_uri:
          description: Content-addressed artifact location.
          type: string
        manifest:
          description: The validated manifest (`theme.json`).
        publisher:
          description: Who published (first-party "sanvi" or a future third party).
          type: string
        required_feature:
          description: 'For premium themes: the entitlement key.'
          type:
          - string
          - 'null'
        tokens:
          description: 'The merged token document `{light: …, dark: …}`.'
        visibility:
          description: '`public` or `premium`.'
          type: string
      required:
      - manifest
      - tokens
      - artifact_uri
      - artifact_digest
      - publisher
      - visibility
      - allow_contrast_warnings
      type: object
    LayoutOverride:
      description: 'A tenant''s layout adjustment: which slots to hide on an unlocked layout.'
      properties:
        hidden_slots:
          items:
            type: string
          type: array
      required:
      - hidden_slots
      type: object
    LayoutSpec:
      description: 'A layout definition: named slots and whether tenants may restructure it.'
      properties:
        locked:
          type: boolean
        slots:
          items:
            type: string
          type: array
      required:
      - slots
      type: object
    LocalizedName:
      description: Localised display names in a manifest.
      properties:
        en:
          type: string
        ja:
          type: string
      required:
      - en
      - ja
      type: object
    PreviewTokenView:
      properties:
        expires_at:
          format: date-time
          type: string
        token:
          type: string
      required:
      - token
      - expires_at
      type: object
    ProblemDetail:
      allOf:
      - description: |-
          RFC 9457 extension members for problem classes that carry
          structured extras (the disconnect conflict names its blockers,
          for example). Flattened onto the JSON object exactly as the RFC
          prescribes; carrying them here keeps the error-enrichment layer
          from stripping them. Absent otherwise.
        type:
        - object
        - 'null'
      - properties:
          detail:
            description: Human-readable explanation of this specific occurrence.
            type: string
          fields:
            description: |-
              The fields a validation rejection names (TASK-027, FR-1127), as an
              RFC 9457 extension member. Present only when the error is
              field-addressed; the human-readable `detail` is never removed from
              an error that grows field addressing.
            items:
              $ref: '#/components/schemas/FieldIssue'
            type:
            - array
            - 'null'
          instance:
            description: URI of the offending resource, if any.
            type:
            - string
            - 'null'
          reason:
            description: |-
              Machine-readable reason for statuses that carry one (e.g. tenant
              suspension); absent otherwise.
            type:
            - string
            - 'null'
          status:
            description: HTTP status code (mirrors the response code).
            format: int32
            minimum: 0
            type: integer
          title:
            description: Short, human-readable, stable title.
            type: string
          trace_id:
            description: |-
              Correlates with the trace in OpenObserve: the W3C trace id of the
              span serving the request (the same trace the `traceparent` response
              header references), falling back to the request id when the request
              ran outside any OpenTelemetry context.
            type:
            - string
            - 'null'
          type:
            description: Stable URI identifying the error class.
            example: https://sanvi.dev/problems/bad-request
            type: string
        required:
        - type
        - title
        - status
        - detail
        type: object
      description: RFC 9457 problem detail. This is the only error body the API produces.
    ResolvedLayout:
      description: A layout after tenant adjustments (hidden slots removed).
      properties:
        slots:
          items:
            type: string
          type: array
      required:
      - slots
      type: object
    ResolvedTheme:
      description: The fully resolved theme document, ready for the frontend.
      properties:
        brand_assets:
          $ref: '#/components/schemas/BrandAssetUrls'
        capabilities:
          items:
            type: string
          type: array
        css_vars:
          description: Precompiled `:root{--…}` block (light + dark media query).
          type: string
        custom_css:
          description: Sanitised tenant CSS, scoped under the storefront wrapper class.
          type:
          - string
          - 'null'
        dark_tokens:
          description: The merged dark token tree, when the theme ships dark mode.
        etag:
          description: 'ETag: hash of (theme, version, revision, locale, api).'
          type: string
        fonts:
          items:
            $ref: '#/components/schemas/FontSpec'
          type: array
        layouts:
          additionalProperties:
            $ref: '#/components/schemas/ResolvedLayout'
          propertyNames:
            type: string
          type: object
        locale:
          type: string
        revision:
          description: 'The live revision this document reflects (draft previews: 0).'
          format: int32
          type: integer
        theme_api:
          type: string
        theme_assets:
          $ref: '#/components/schemas/ThemeAssetUrls'
        theme_key:
          type: string
        theme_version:
          type: string
        tokens:
          description: The merged nested token tree (light mode).
      required:
      - theme_key
      - theme_version
      - theme_api
      - capabilities
      - tokens
      - css_vars
      - layouts
      - fonts
      - theme_assets
      - brand_assets
      - revision
      - locale
      - etag
      type: object
    TenantThemeDraftView:
      properties:
        spec:
          $ref: '#/components/schemas/ThemeSpecView'
        theme:
          $ref: '#/components/schemas/TenantThemeView'
      required:
      - theme
      - spec
      type: object
    TenantThemeView:
      description: The tenant's draft (or live) theme state.
      properties:
        assets:
          $ref: '#/components/schemas/BrandAssets'
        custom_css:
          type:
          - string
          - 'null'
        layout_overrides:
          additionalProperties:
            $ref: '#/components/schemas/LayoutOverride'
          propertyNames:
            type: string
          type: object
        revision:
          format: int32
          type: integer
        state:
          $ref: '#/components/schemas/ThemeState'
        theme_key:
          type: string
        token_overrides:
          additionalProperties:
            $ref: '#/components/schemas/TokenValue'
          propertyNames:
            type: string
          type: object
        updated_at:
          format: date-time
          type: string
        version:
          type: string
      required:
      - state
      - theme_key
      - version
      - token_overrides
      - layout_overrides
      - assets
      - revision
      - updated_at
      type: object
    ThemeAdminView:
      description: A registry entry for the platform control plane.
      properties:
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        key:
          type: string
        publisher:
          type: string
        required_feature:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/ThemeStatus'
        versions:
          items:
            $ref: '#/components/schemas/ThemeVersionAdminView'
          type: array
        visibility:
          $ref: '#/components/schemas/ThemeVisibility'
      required:
      - id
      - key
      - publisher
      - visibility
      - status
      - versions
      type: object
    ThemeAssetUrls:
      description: Theme-provided reference assets (preview/screenshots), resolved to URLs.
      properties:
        preview:
          type:
          - string
          - 'null'
        screenshots:
          items:
            type: string
          type: array
      type: object
    ThemeSpecView:
      description: |-
        Theme reference data surfaced to the tenant UI (fonts/layouts the theme
        ships, so the editor knows what is overridable).
      properties:
        capabilities:
          items:
            type: string
          type: array
        fonts:
          items:
            $ref: '#/components/schemas/FontSpec'
          type: array
        key:
          type: string
        layouts:
          additionalProperties:
            $ref: '#/components/schemas/LayoutSpec'
          propertyNames:
            type: string
          type: object
        overridable:
          items:
            type: string
          type: array
        version:
          type: string
      required:
      - key
      - version
      - overridable
      - layouts
      - fonts
      - capabilities
      type: object
    ThemeState:
      description: Draft or live — the two rows a tenant may hold.
      enum:
      - draft
      - live
      type: string
    ThemeStatus:
      description: Lifecycle status of a theme in the catalog.
      enum:
      - active
      - deprecated
      type: string
    ThemeVersionAdminView:
      description: A version row for the platform control plane.
      properties:
        artifact_digest:
          type: string
        artifact_uri:
          type: string
        published_at:
          format: date-time
          type: string
        semver:
          type: string
        theme_api_range:
          type: string
        yanked_at:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - semver
      - theme_api_range
      - artifact_uri
      - artifact_digest
      - published_at
      type: object
    ThemeVisibility:
      description: Who can see a theme in the catalog.
      enum:
      - public
      - premium
      type: string
    TokenValue:
      additionalProperties: false
      description: A leaf token (`$value` + optional `$type`/`$description`).
      properties:
        $description:
          type:
          - string
          - 'null'
        $type:
          type:
          - string
          - 'null'
        $value: {}
      required:
      - $value
      type: object
    UpdateTenantThemeDraftCommand:
      description: |-
        The edit command. Every field is optional: `None` leaves it unchanged;
        `custom_css: Some(None)` removes custom CSS.
      properties:
        custom_css:
          description: Replacement custom CSS (`Some(None)` clears it).
          type:
          - string
          - 'null'
        layout_overrides:
          additionalProperties:
            $ref: '#/components/schemas/LayoutOverride'
          description: Layout adjustments (hidden slots on unlocked layouts).
          propertyNames:
            type: string
          type:
          - object
          - 'null'
        theme_key:
          description: |-
            Switch theme. When present with no `version`, pins the theme's
            latest published version.
          type:
          - string
          - 'null'
        token_overrides:
          additionalProperties:
            $ref: '#/components/schemas/TokenValue'
          description: Flat token overrides (`color.brand.primary` → `{$value, $type}`).
          propertyNames:
            type: string
          type:
          - object
          - 'null'
        version:
          description: Explicit version pin (a theme upgrade is never implicit).
          type:
          - string
          - 'null'
      type: object
    UploadBrandAssetCommand:
      description: |-
        The upload command: base64 payload with a declared media type (the
        declared type is advisory — the bytes are sniffed and must match).
      properties:
        content_type:
          description: The declared media type (must agree with the sniffed bytes).
          type:
          - string
          - 'null'
        data_base64:
          description: Base64-encoded image bytes.
          type: string
        kind:
          description: '`logo` | `favicon` | `og_image`.'
          type: string
      required:
      - kind
      - data_base64
      type: object
info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/platform/themes:
    get:
      operationId: list_platform_themes
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ThemeAdminView'
                type: array
          description: The full theme registry
      summary: '`GET /api/v1/platform/themes`.'
      tags:
      - theming
    post:
      operationId: install_theme_version
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallThemeVersionCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeVersionAdminView'
          description: Installed version
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Manifest, tokens or contrast validation failed
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Version already exists
      summary: '`POST /api/v1/platform/themes` — install a theme version.'
      tags:
      - theming
  /api/v1/platform/themes/{key}/versions:
    get:
      operationId: list_platform_theme_versions
      parameters:
      - description: Theme key
        in: path
        name: key
        required: true
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last version of the previous page. Absent for
          the first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ThemeVersionAdminView'
                type: array
          description: The theme's version history
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown theme
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout - the request exceeded its budget
      summary: |-
        `GET /api/v1/platform/themes/{key}/versions`.
        Ordered by published_at DESC, id DESC.
      tags:
      - theming
  /api/v1/platform/themes/{key}/versions/{version}/yank:
    post:
      operationId: yank_theme_version
      parameters:
      - description: Theme key
        in: path
        name: key
        required: true
        schema:
          type: string
      - description: Semver to withdraw
        in: path
        name: version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Version withdrawn
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown theme or version
      summary: '`POST /api/v1/platform/themes/{key}/versions/{version}/yank` — withdraw.'
      tags:
      - theming
  /api/v1/public/theme:
    get:
      operationId: get_public_theme
      parameters:
      - description: Host to resolve (defaults to the request Host header)
        in: query
        name: host
        required: false
        schema:
          type: string
      - description: Requested locale (defaults to en)
        in: query
        name: locale
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedTheme'
          description: Resolved theme with css_vars
        '304':
          description: Not modified (ETag match)
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid locale
      summary: |-
        `GET /api/v1/public/theme` — the resolved live theme for the request
        host (or the platform default), ETag-cached. No authentication; tenant
        resolution happens here because public paths skip the tenant middleware.///
        Cache semantics (TASK-022, FR-1111): this operation is deliberately NOT
        served from the server-side SSR cache — its handler is already
        cache-first (the resolved-theme cache + single-flight of TASK-021
        11.2g), and an SSR hit would re-pay the cache key's resolution reads to
        skip a handler that no longer renders anything (measured, see
        `benchmarks/ssr-cache-2026-10-07.md`). The SSR cache covers the
        storefront content reads (locales, messages, plans, privacy
        disclosures), keyed by (tenant, locale, theme revision, device class); a
        theme publish invalidates those entries within ~2 s. This response
        preloads the tenant's brand logo — the largest above-the-fold resource
        the backend knows about — via a `Link; rel=preload` header.
      tags:
      - theming
  /api/v1/tenant/theme/assets:
    post:
      operationId: upload_brand_asset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadBrandAssetCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantThemeView'
          description: Updated draft
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid asset
      summary: '`POST /api/v1/tenant/theme/assets`.'
      tags:
      - theming
  /api/v1/tenant/theme/assets/{kind}:
    delete:
      operationId: remove_brand_asset
      parameters:
      - description: logo | favicon | og_image
        in: path
        name: kind
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantThemeView'
          description: Updated draft
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown asset kind
      summary: '`DELETE /api/v1/tenant/theme/assets/{kind}`.'
      tags:
      - theming
  /api/v1/tenant/theme/draft:
    get:
      operationId: get_tenant_theme_draft
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantThemeDraftView'
          description: The tenant's theme draft
      summary: '`GET /api/v1/tenant/theme/draft`.'
      tags:
      - theming
    put:
      operationId: put_tenant_theme_draft
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantThemeDraftCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantThemeView'
          description: Updated draft
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid draft
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing entitlement
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown theme or version
      summary: '`PUT /api/v1/tenant/theme/draft`.'
      tags:
      - theming
  /api/v1/tenant/theme/preview:
    get:
      operationId: preview_tenant_theme
      parameters:
      - description: Signed preview token
        in: query
        name: token
        required: true
        schema:
          type: string
      - description: Requested locale (defaults to en)
        in: query
        name: locale
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedTheme'
          description: Preview of the draft theme
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid locale
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid or expired preview token
      summary: |-
        `GET /api/v1/tenant/theme/preview` — the draft, rendered through a
        signed short-lived token. Never cached, never indexed.
      tags:
      - theming
  /api/v1/tenant/theme/preview-token:
    post:
      operationId: mint_theme_preview_token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewTokenView'
          description: Signed draft preview token
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Preview signing is not configured
      summary: |-
        `POST /api/v1/tenant/theme/preview-token` — mint a short-lived token for
        the current tenant's draft.
      tags:
      - theming
  /api/v1/tenant/theme/publish:
    post:
      operationId: publish_tenant_theme
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantThemeView'
          description: The new live theme
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Draft failed validation (including contrast)
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No draft to publish
