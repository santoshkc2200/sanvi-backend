info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/platform/audit:
    get:
      description: |-
        Supports filters (`tenant_id`, `actor_id`, `action`, `since`, `until`)
        and cursor pagination (`after` = the `seq` of the last entry of the
        previous page).
      operationId: list_audit
      parameters:
      - description: Restrict to one tenant (decimal Snowflake).
        in: query
        name: tenant_id
        required: false
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Restrict to one actor (decimal Snowflake).
        in: query
        name: actor_id
        required: false
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Exact action name, e.g. tenancy.suspend.
        in: query
        name: action
        required: false
        schema:
          type: string
      - description: Inclusive lower bound.
        in: query
        name: since
        required: false
        schema:
          format: date-time
          type: string
      - description: Exclusive upper bound.
        in: query
        name: until
        required: false
        schema:
          format: date-time
          type: string
      - description: 'Cursor: seq of the last entry of the previous page.'
        in: query
        name: after
        required: false
        schema:
          format: int64
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Page size, clamped to 1..=200; 50 when absent.
          examples:
          - 50
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPageView'
          description: One page of audit entries, newest first
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid filter value
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing platform.audit.read
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout — the request exceeded its budget
      summary: List the platform audit trail (operator console).
      tags:
      - audit
