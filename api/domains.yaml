components:
  schemas:
    AutoRenewCommand:
      properties:
        enabled:
          type: boolean
      required:
      - enabled
      type: object
    ChallengeView:
      description: |-
        The challenge as shown to the tenant (the token itself is the secret
        they must publish; the value is pre-rendered for copy-paste).
      properties:
        challenge_type:
          type: string
        expires_at:
          format: date-time
          type: string
        token:
          type: string
        txt_name:
          type: string
        txt_value:
          type: string
      required:
      - token
      - challenge_type
      - txt_name
      - txt_value
      - expires_at
      type: object
    ClaimCustomDomainCommand:
      properties:
        hostname:
          description: The hostname to claim (`shop.acme.com`).
          type: string
        role:
          description: '`primary` (default when the tenant has none), `alias` or `redirect`.'
          type:
          - string
          - 'null'
      required:
      - hostname
      type: object
    CustomDomainView:
      properties:
        cert_expires_at:
          description: |-
            The active certificate's expiry, when one has been issued. `None`
            while the domain has no active cert (not yet issued, or removed).
          format: date-time
          type:
          - string
          - 'null'
        challenge:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ChallengeView'
        created_at:
          format: date-time
          type: string
        detected_registrar:
          type:
          - string
          - 'null'
        failure:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DomainFailure'
        hostname:
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        kind:
          type: string
        role:
          type: string
        status:
          type: string
        updated_at:
          format: date-time
          type: string
        verified_at:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - id
      - hostname
      - kind
      - role
      - status
      - created_at
      - updated_at
      type: object
    DomainFailure:
      description: Why a domain failed or degraded, as a stable code plus free detail.
      properties:
        code:
          type: string
        detail:
          type: string
        routing_ok:
          description: Same as `txt_ok`, for the routing (CNAME/A) check.
          type:
          - boolean
          - 'null'
        txt_ok:
          description: |-
            The last verification attempt's independent TXT-ownership result.
            `None` when this failure isn't a verification failure, or the check
            didn't run that attempt (not "passed").
          type:
          - boolean
          - 'null'
      required:
      - code
      - detail
      type: object
    DomainQuote:
      description: 'One search hit: a hostname candidate with normalized pricing.'
      properties:
        available:
          type: boolean
        hostname:
          type: string
        premium:
          type: boolean
        register_price:
          $ref: '#/components/schemas/DomainsMoney'
        registrar_id:
          type: string
        renew_price:
          $ref: '#/components/schemas/DomainsMoney'
        tld:
          type: string
      required:
      - hostname
      - tld
      - available
      - premium
      - register_price
      - renew_price
      - registrar_id
      type: object
    DomainSearchView:
      properties:
        query:
          type: string
        registrar_id:
          type: string
        results:
          items:
            $ref: '#/components/schemas/DomainQuote'
          type: array
      required:
      - query
      - registrar_id
      - results
      type: object
    DomainsMoney:
      description: An amount in the currency's minor unit (cents for USD/JPY).
      properties:
        currency:
          type: string
        minor:
          format: int64
          type: integer
      required:
      - minor
      - currency
      type: object
    FieldIssue:
      description: |-
        One field-addressed validation issue (TASK-027, FR-1127).

        A validation error that names the input it belongs to lets a client
        build an error summary that links back to the offending field instead
        of guessing from a flat string. `field` is the request-body path,
        root-relative, with bracketed indices for sequence elements
        (`hostname`, `budget.amount.currency`,
        `ad_groups[2].ads[0].creative.placement`) — the same grammar the
        advertising capability matrix already speaks.
      properties:
        field:
          description: Root-relative path to the offending request field.
          type: string
        message:
          description: |-
            Why this field was rejected. Human-readable; `detail` stays the
            request-level summary and is never a replacement for it.
          type: string
      required:
      - field
      - message
      type: object
    GuideView:
      description: The registrar-specific walkthrough (localized; phase 06).
      properties:
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        steps:
          items:
            type: string
          type: array
        title:
          type: string
      required:
      - id
      - title
      - steps
      type: object
    InstructionRecord:
      description: One instruction record with a localized explanation line.
      properties:
        explanation:
          type: string
        name:
          type: string
        record_type:
          type: string
        ttl:
          format: int32
          minimum: 0
          type: integer
        value:
          type: string
      required:
      - name
      - record_type
      - value
      - ttl
      - explanation
      type: object
    InstructionsView:
      properties:
        domain_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        guide:
          $ref: '#/components/schemas/GuideView'
        hostname:
          type: string
        kind:
          type: string
        records:
          items:
            $ref: '#/components/schemas/InstructionRecord'
          type: array
        role:
          type: string
        status:
          type: string
      required:
      - domain_id
      - hostname
      - kind
      - role
      - status
      - records
      - guide
      type: object
    OrderView:
      properties:
        auto_renew:
          type: boolean
        created_at:
          format: date-time
          type: string
        currency:
          type: string
        expires_at:
          format: date-time
          type:
          - string
          - 'null'
        hostname:
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        price_minor:
          format: int64
          type: integer
        registered_at:
          format: date-time
          type:
          - string
          - 'null'
        status:
          type: string
        term_years:
          format: int32
          minimum: 0
          type: integer
        whois_privacy:
          type: boolean
      required:
      - id
      - hostname
      - term_years
      - price_minor
      - currency
      - status
      - auto_renew
      - whois_privacy
      - created_at
      type: object
    PlaceDomainOrderCommand:
      properties:
        auto_renew:
          description: Renew automatically before expiry (default true).
          type: boolean
        hostname:
          description: 'The hostname to purchase (must be an apex: `acme.com`).'
          type: string
        idempotency_key:
          description: |-
            Client-supplied idempotency key: retrying a purchase returns the
            original order instead of charging twice.
          format: uuid
          type:
          - string
          - 'null'
        registrant_contact:
          $ref: '#/components/schemas/RegistrantContact'
        term_years:
          description: Registration term in years.
          format: int32
          minimum: 0
          type: integer
        whois_privacy:
          description: WHOIS privacy (default true where supported).
          type: boolean
      required:
      - hostname
      - registrant_contact
      type: object
    ProblemDetail:
      allOf:
      - description: |-
          RFC 9457 extension members for problem classes that carry
          structured extras (the disconnect conflict names its blockers,
          for example). Flattened onto the JSON object exactly as the RFC
          prescribes; carrying them here keeps the error-enrichment layer
          from stripping them. Absent otherwise.
        type:
        - object
        - 'null'
      - properties:
          detail:
            description: Human-readable explanation of this specific occurrence.
            type: string
          fields:
            description: |-
              The fields a validation rejection names (TASK-027, FR-1127), as an
              RFC 9457 extension member. Present only when the error is
              field-addressed; the human-readable `detail` is never removed from
              an error that grows field addressing.
            items:
              $ref: '#/components/schemas/FieldIssue'
            type:
            - array
            - 'null'
          instance:
            description: URI of the offending resource, if any.
            type:
            - string
            - 'null'
          reason:
            description: |-
              Machine-readable reason for statuses that carry one (e.g. tenant
              suspension); absent otherwise.
            type:
            - string
            - 'null'
          status:
            description: HTTP status code (mirrors the response code).
            format: int32
            minimum: 0
            type: integer
          title:
            description: Short, human-readable, stable title.
            type: string
          trace_id:
            description: |-
              Correlates with the trace in OpenObserve: the W3C trace id of the
              span serving the request (the same trace the `traceparent` response
              header references), falling back to the request id when the request
              ran outside any OpenTelemetry context.
            type:
            - string
            - 'null'
          type:
            description: Stable URI identifying the error class.
            example: https://sanvi.dev/problems/bad-request
            type: string
        required:
        - type
        - title
        - status
        - detail
        type: object
      description: RFC 9457 problem detail. This is the only error body the API produces.
    RegistrantContact:
      description: |-
        The registrant contact data (purchase journey). Personal data: minimized,
        registered in the phase-05 data map with the registrar as sub-processor,
        and erasable subject to ICANN retention rules.
      properties:
        country_code:
          type: string
        email:
          type: string
        name:
          type: string
        organization:
          type:
          - string
          - 'null'
        phone:
          type: string
      required:
      - name
      - email
      - phone
      - country_code
      type: object
    ReleaseDomainCommand:
      properties:
        reason:
          description: The audited reason for the force-release.
          type: string
      required:
      - reason
      type: object
    TlsAuthorizeResponse:
      properties:
        allowed:
          type: boolean
        reason:
          type: string
      required:
      - allowed
      - reason
      type: object
info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/platform/domains:
    get:
      operationId: list_platform_domains
      parameters:
      - description: Hostname substring.
        in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Page size, clamped to 1..=100; 50 when absent.
          examples:
          - 50
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last domain of the previous page. Absent for
          the first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CustomDomainView'
                type: array
          description: Domains across tenants
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout - the request exceeded its budget
      summary: |-
        `GET /api/v1/platform/domains`.
        Ordered by id DESC.
      tags:
      - domains
  /api/v1/platform/domains/{id}/release:
    post:
      operationId: release_platform_domain
      parameters:
      - description: The domain id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseDomainCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDomainView'
          description: The released domain
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown domain
      summary: '`POST /api/v1/platform/domains/{id}/release`.'
      tags:
      - domains
  /api/v1/tenant/domains:
    get:
      operationId: list_custom_domains
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last domain of the previous page. Absent for
          the first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CustomDomainView'
                type: array
          description: The tenant's domains
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout - the request exceeded its budget
      summary: |-
        `GET /api/v1/tenant/domains`.
        Ordered by id DESC.
      tags:
      - domains
    post:
      operationId: claim_custom_domain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCustomDomainCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDomainView'
          description: The claim and its verification challenge
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid hostname
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'Permission denied, or entitlement missing (reason: domain_entitlement_required)'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Hostname already claimed
      summary: '`POST /api/v1/tenant/domains`.'
      tags:
      - domains
  /api/v1/tenant/domains/orders:
    get:
      operationId: list_domain_orders
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          description: Page size, clamped to 1..=200; 200 when absent.
          examples:
          - 200
          format: int32
          maximum: 200
          minimum: 1
          type: integer
      - description: |-
          Cursor: the id of the last domain of the previous page. Absent for
          the first page; the page is ordered newest first.
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrderView'
                type: array
          description: The tenant's domain orders
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Malformed cursor
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout - the request exceeded its budget
      summary: |-
        `GET /api/v1/tenant/domains/orders`.
        Ordered by id DESC.
      tags:
      - domains
    post:
      operationId: place_domain_order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceDomainOrderCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
          description: The order (the saga may still be in flight; see status)
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid hostname or unsupported TLD
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'Permission denied, or entitlement missing (reason: domain_entitlement_required)'
      summary: '`POST /api/v1/tenant/domains/orders`.'
      tags:
      - domains
  /api/v1/tenant/domains/orders/{id}/auto-renew:
    post:
      operationId: set_order_auto_renew
      parameters:
      - description: The order id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoRenewCommand'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
          description: The updated order
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown order
      summary: '`POST /api/v1/tenant/domains/orders/{id}/auto-renew`.'
      tags:
      - domains
  /api/v1/tenant/domains/search:
    get:
      operationId: search_domains
      parameters:
      - description: Bare term (`acme`) or hostname (`acme.com`)
        in: query
        name: q
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainSearchView'
          description: Availability and normalized pricing
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'Permission denied, or entitlement missing (reason: domain_entitlement_required)'
      summary: '`GET /api/v1/tenant/domains/search`.'
      tags:
      - domains
  /api/v1/tenant/domains/{id}:
    delete:
      operationId: remove_custom_domain
      parameters:
      - description: The domain claim id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDomainView'
          description: The removed domain
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown domain
      summary: '`DELETE /api/v1/tenant/domains/{id}`.'
      tags:
      - domains
  /api/v1/tenant/domains/{id}/instructions:
    get:
      operationId: get_domain_instructions
      parameters:
      - description: The domain claim id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      - description: Requested locale (defaults to the negotiated one)
        in: query
        name: locale
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionsView'
          description: The exact records and the registrar walkthrough
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown domain
      summary: '`GET /api/v1/tenant/domains/{id}/instructions`.'
      tags:
      - domains
  /api/v1/tenant/domains/{id}/promote:
    post:
      operationId: promote_primary_domain
      parameters:
      - description: The domain claim id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDomainView'
          description: The domain is now primary
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown domain
      summary: '`POST /api/v1/tenant/domains/{id}/promote`.'
      tags:
      - domains
  /api/v1/tenant/domains/{id}/verify:
    post:
      operationId: request_domain_verification
      parameters:
      - description: The domain claim id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDomainView'
          description: The domain, now queued for verification
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown domain
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Throttled by the backoff schedule
      summary: '`POST /api/v1/tenant/domains/{id}/verify`.'
      tags:
      - domains
  /internal/tls/authorize:
    get:
      operationId: tls_authorize
      parameters:
      - description: The hostname the edge wants a certificate for
        in: query
        name: host
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsAuthorizeResponse'
          description: Issuance authorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsAuthorizeResponse'
          description: Issuance denied
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The gate is not configured
      summary: |-
        `GET /internal/tls/authorize` — the edge asks before issuing a
        certificate. Self-authenticated: `x-sanvi-internal` shared secret plus
        an optional client-IP allow-list; `/internal` sits outside the authn
        middleware.
      tags:
      - domains
