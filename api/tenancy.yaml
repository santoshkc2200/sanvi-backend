components:
  schemas:
    DimensionUsage:
      properties:
        limit:
          format: int64
          minimum: 0
          type: integer
        used:
          format: int64
          minimum: 0
          type: integer
      required:
      - used
      - limit
      type: object
    FieldIssue:
      description: |-
        One field-addressed validation issue (TASK-027, FR-1127).

        A validation error that names the input it belongs to lets a client
        build an error summary that links back to the offending field instead
        of guessing from a flat string. `field` is the request-body path,
        root-relative, with bracketed indices for sequence elements
        (`hostname`, `budget.amount.currency`,
        `ad_groups[2].ads[0].creative.placement`) — the same grammar the
        advertising capability matrix already speaks.
      properties:
        field:
          description: Root-relative path to the offending request field.
          type: string
        message:
          description: |-
            Why this field was rejected. Human-readable; `detail` stays the
            request-level summary and is never a replacement for it.
          type: string
      required:
      - field
      - message
      type: object
    ProblemDetail:
      allOf:
      - description: |-
          RFC 9457 extension members for problem classes that carry
          structured extras (the disconnect conflict names its blockers,
          for example). Flattened onto the JSON object exactly as the RFC
          prescribes; carrying them here keeps the error-enrichment layer
          from stripping them. Absent otherwise.
        type:
        - object
        - 'null'
      - properties:
          detail:
            description: Human-readable explanation of this specific occurrence.
            type: string
          fields:
            description: |-
              The fields a validation rejection names (TASK-027, FR-1127), as an
              RFC 9457 extension member. Present only when the error is
              field-addressed; the human-readable `detail` is never removed from
              an error that grows field addressing.
            items:
              $ref: '#/components/schemas/FieldIssue'
            type:
            - array
            - 'null'
          instance:
            description: URI of the offending resource, if any.
            type:
            - string
            - 'null'
          reason:
            description: |-
              Machine-readable reason for statuses that carry one (e.g. tenant
              suspension); absent otherwise.
            type:
            - string
            - 'null'
          status:
            description: HTTP status code (mirrors the response code).
            format: int32
            minimum: 0
            type: integer
          title:
            description: Short, human-readable, stable title.
            type: string
          trace_id:
            description: |-
              Correlates with the trace in OpenObserve: the W3C trace id of the
              span serving the request (the same trace the `traceparent` response
              header references), falling back to the request id when the request
              ran outside any OpenTelemetry context.
            type:
            - string
            - 'null'
          type:
            description: Stable URI identifying the error class.
            example: https://sanvi.dev/problems/bad-request
            type: string
        required:
        - type
        - title
        - status
        - detail
        type: object
      description: RFC 9457 problem detail. This is the only error body the API produces.
    ProvisionTenantCommand:
      properties:
        default_locale:
          example: en
          type: string
        display_name:
          example: Acme Corporation
          type: string
        region:
          example: us
          type: string
        slug:
          example: acme
          type: string
      required:
      - slug
      - display_name
      - region
      type: object
    ResolutionSource:
      description: |-
        How the tenant was resolved. Most-specific sources win; the source is
        recorded on the context for observability and debugging.
      enum:
      - internal_header
      - session_claim
      - custom_domain
      - subdomain
      type: string
    SettingsUpdate:
      properties:
        settings:
          additionalProperties: {}
          description: Key → value map to upsert. Values are uninterpreted JSON.
          example:
            checkout.currency: JPY
          propertyNames:
            type: string
          type: object
      required:
      - settings
      type: object
    SlugAvailability:
      description: The bare-boolean answer to a slug availability question.
      properties:
        available:
          type: boolean
      required:
      - available
      type: object
    SuspendTenantRequest:
      description: Request body for suspending a tenant.
      properties:
        reason:
          description: 'Machine-readable reason: billing | abuse | legal | operational.'
          example: billing
          type: string
      required:
      - reason
      type: object
    TenantContext:
      description: |-
        What a tenant looks like at request time — the shape every context reads
        from request extensions.
      properties:
        default_locale:
          type: string
        display_name:
          type: string
        region:
          type: string
        resolution_source:
          $ref: '#/components/schemas/ResolutionSource'
        slug:
          type: string
        status:
          $ref: '#/components/schemas/TenantRuntimeStatus'
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - tenant_id
      - slug
      - display_name
      - status
      - region
      - default_locale
      - resolution_source
      type: object
    TenantListView:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TenantView'
          type: array
        next_cursor:
          description: Cursor for the next page (null on the last page).
          type:
          - string
          - 'null'
      required:
      - items
      type: object
    TenantRuntimeStatus:
      description: |-
        Tenant lifecycle state as observed at runtime. Only `Active` tenants serve
        traffic; every other state returns 423 except on the allow-list, with the
        machine-readable `reason` naming the state (`restoring` included, so the
        shell gates during a single-tenant restore).
      enum:
      - provisioning
      - active
      - suspended
      - archived
      - restoring
      type: string
    TenantSettingsOutput:
      properties:
        settings:
          additionalProperties: {}
          propertyNames:
            type: string
          type: object
      required:
      - settings
      type: object
    TenantUsage:
      properties:
        dimensions:
          additionalProperties:
            $ref: '#/components/schemas/DimensionUsage'
          propertyNames:
            enum:
            - api_requests
            - tracked_conversions
            - storage_bytes
            - custom_domains
            - seats
            - notification_sends
            type: string
          type: object
        period_end:
          format: date-time
          type: string
        period_start:
          format: date-time
          type: string
        plan:
          type: string
      required:
      - plan
      - period_start
      - period_end
      - dimensions
      type: object
    TenantView:
      description: Public representation of a tenant.
      properties:
        archived_at:
          format: date-time
          type:
          - string
          - 'null'
        created_at:
          format: date-time
          type: string
        default_locale:
          type: string
        display_name:
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        region:
          type: string
        slug:
          type: string
        status:
          type: string
        suspended_reason:
          type:
          - string
          - 'null'
        updated_at:
          format: date-time
          type: string
      required:
      - id
      - slug
      - display_name
      - status
      - region
      - default_locale
      - created_at
      - updated_at
      type: object
info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/platform/tenants:
    get:
      operationId: list_tenants
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          description: Page size, clamped to 1..=100; 20 when absent.
          examples:
          - 20
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      - description: 'Cursor: tenant id of the last item of the previous page.'
        in: query
        name: after
        required: false
        schema:
          type: string
      - description: Filter by tenant status.
        in: query
        name: status
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListView'
          description: Tenant page
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid filter
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Statement timeout — the request exceeded its budget
      summary: |-
        `GET /api/v1/platform/tenants` — list tenants (cursor pagination).
        Ordered by created_at DESC, id DESC.
      tags:
      - tenancy
    post:
      operationId: provision_tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionTenantCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantView'
          description: Tenant provisioned
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid input
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Slug unavailable or illegal transition
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: '`POST /api/v1/platform/tenants` — provision a new tenant.'
      tags:
      - tenancy
  /api/v1/platform/tenants/{id}:
    get:
      operationId: get_tenant
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantView'
          description: Tenant
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Tenant not found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: '`GET /api/v1/platform/tenants/{id}` — tenant detail.'
      tags:
      - tenancy
  /api/v1/platform/tenants/{id}/activate:
    post:
      operationId: activate_tenant
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantView'
          description: Tenant activated
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Tenant not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Illegal transition
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: '`POST /api/v1/platform/tenants/{id}/activate` — provisioning → active.'
      tags:
      - tenancy
  /api/v1/platform/tenants/{id}/archive:
    post:
      operationId: archive_tenant
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantView'
          description: Tenant archived
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Tenant not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Illegal transition
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: '`POST /api/v1/platform/tenants/{id}/archive` — active|suspended → archived.'
      tags:
      - tenancy
  /api/v1/platform/tenants/{id}/resume:
    post:
      operationId: resume_tenant
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantView'
          description: Tenant resumed
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Tenant not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Illegal transition
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: '`POST /api/v1/platform/tenants/{id}/resume` — suspended → active.'
      tags:
      - tenancy
  /api/v1/platform/tenants/{id}/suspend:
    post:
      operationId: suspend_tenant
      parameters:
      - description: Tenant id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendTenantRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantView'
          description: Tenant suspended
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Tenant not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Illegal transition
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: '`POST /api/v1/platform/tenants/{id}/suspend` — active → suspended.'
      tags:
      - tenancy
  /api/v1/public/slug-availability:
    get:
      operationId: check_slug_availability
      parameters:
      - description: Candidate slug
        in: query
        name: slug
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugAvailability'
          description: Availability answer
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: '`GET /api/v1/public/slug-availability` — is this slug free? (boolean only.)'
      tags:
      - tenancy
  /api/v1/public/tenant-context:
    get:
      operationId: public_tenant_context
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantContext'
          description: Tenant context for this host
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unknown host
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: |-
        `GET /api/v1/public/tenant-context` — host-based context for the
        storefront SSR bootstrap. Unknown host → 404; suspended tenants answer
        normally (the frontend renders the maintenance page).
      tags:
      - tenancy
  /api/v1/tenant/context:
    get:
      operationId: get_tenant_context
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantContext'
          description: Resolved tenant context
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No tenant resolved
      summary: |-
        `GET /api/v1/tenant/context` — the current tenant's self-description
        (resolved by the middleware; the frontend bootstrap endpoint). Public,
        with the signed-in subject attached when a session exists.
      tags:
      - tenancy
  /api/v1/tenant/settings:
    get:
      operationId: get_tenant_settings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsOutput'
          description: Tenant settings
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No tenant resolved
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: '`GET /api/v1/tenant/settings` — all settings of the current tenant.'
      tags:
      - tenancy
    put:
      operationId: update_tenant_settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsOutput'
          description: Updated settings
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid settings
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No tenant resolved
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Internal error
      summary: '`PUT /api/v1/tenant/settings` — upsert settings of the current tenant.'
      tags:
      - tenancy
  /api/v1/tenant/usage:
    get:
      operationId: get_tenant_usage
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUsage'
          description: Current-period usage and plan limits
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Authentication required
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Usage permission required
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Counters unavailable
      summary: '`POST /api/v1/platform/tenants` — provision a new tenant.'
      tags:
      - tenancy
