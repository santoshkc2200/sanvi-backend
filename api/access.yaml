info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.3.0
openapi: 3.1.0
paths:
  /api/v1/access/permissions:
    get:
      operationId: list_permissions
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PermissionView'
                type: array
          description: Permission registry
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
      summary: |-
        `GET /api/v1/access/permissions` — the central permission registry,
        for the admin/UI contracts. Readable by any authenticated subject.
      tags:
      - access
