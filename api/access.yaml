components:
  schemas:
    CreateRoleRequest:
      properties:
        key:
          type: string
        name:
          type: string
        permissions:
          items:
            type: string
          type: array
      required:
      - key
      - name
      - permissions
      type: object
    DefineFeatureRequest:
      properties:
        default_enabled:
          type: boolean
        default_limit:
          format: int64
          type:
          - integer
          - 'null'
        key:
          type: string
        kind:
          $ref: '#/components/schemas/FeatureKind'
        name:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
      required:
      - key
      - name
      - kind
      type: object
    EntitlementSourceView:
      enum:
      - override
      - subscription
      - plan_default
      - feature_default
      type: string
    FeatureKind:
      description: What an entitlement buys.
      enum:
      - boolean
      - quota
      type: string
    FeatureView:
      description: One catalog feature as exposed by the API.
      properties:
        default_enabled:
          type: boolean
        default_limit:
          format: int64
          type:
          - integer
          - 'null'
        deprecated_at:
          format: date-time
          type:
          - string
          - 'null'
        key:
          type: string
        kind:
          $ref: '#/components/schemas/FeatureKind'
        name:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
      required:
      - key
      - name
      - kind
      - default_enabled
      - visibility
      type: object
    FieldIssue:
      description: |-
        One field-addressed validation issue (TASK-027, FR-1127).

        A validation error that names the input it belongs to lets a client
        build an error summary that links back to the offending field instead
        of guessing from a flat string. `field` is the request-body path,
        root-relative, with bracketed indices for sequence elements
        (`hostname`, `budget.amount.currency`,
        `ad_groups[2].ads[0].creative.placement`) — the same grammar the
        advertising capability matrix already speaks.
      properties:
        field:
          description: Root-relative path to the offending request field.
          type: string
        message:
          description: |-
            Why this field was rejected. Human-readable; `detail` stays the
            request-level summary and is never a replacement for it.
          type: string
      required:
      - field
      - message
      type: object
    PermissionScope:
      description: Who a permission applies to, which decides how the check resolves.
      enum:
      - platform
      - tenant
      - authenticated
      type: string
    PermissionView:
      properties:
        description:
          type: string
        key:
          type: string
        scope:
          $ref: '#/components/schemas/PermissionScope'
      required:
      - key
      - scope
      - description
      type: object
    ProblemDetail:
      allOf:
      - description: |-
          RFC 9457 extension members for problem classes that carry
          structured extras (the disconnect conflict names its blockers,
          for example). Flattened onto the JSON object exactly as the RFC
          prescribes; carrying them here keeps the error-enrichment layer
          from stripping them. Absent otherwise.
        type:
        - object
        - 'null'
      - properties:
          detail:
            description: Human-readable explanation of this specific occurrence.
            type: string
          fields:
            description: |-
              The fields a validation rejection names (TASK-027, FR-1127), as an
              RFC 9457 extension member. Present only when the error is
              field-addressed; the human-readable `detail` is never removed from
              an error that grows field addressing.
            items:
              $ref: '#/components/schemas/FieldIssue'
            type:
            - array
            - 'null'
          instance:
            description: URI of the offending resource, if any.
            type:
            - string
            - 'null'
          reason:
            description: |-
              Machine-readable reason for statuses that carry one (e.g. tenant
              suspension); absent otherwise.
            type:
            - string
            - 'null'
          status:
            description: HTTP status code (mirrors the response code).
            format: int32
            minimum: 0
            type: integer
          title:
            description: Short, human-readable, stable title.
            type: string
          trace_id:
            description: |-
              Correlates with the trace in OpenObserve: the W3C trace id of the
              span serving the request (the same trace the `traceparent` response
              header references), falling back to the request id when the request
              ran outside any OpenTelemetry context.
            type:
            - string
            - 'null'
          type:
            description: Stable URI identifying the error class.
            example: https://sanvi.dev/problems/bad-request
            type: string
        required:
        - type
        - title
        - status
        - detail
        type: object
      description: RFC 9457 problem detail. This is the only error body the API produces.
    ResolvedEntitlementView:
      description: One resolved entitlement as exposed to a tenant.
      properties:
        enabled:
          type: boolean
        expires_at:
          format: date-time
          type:
          - string
          - 'null'
        feature:
          type: string
        kind:
          $ref: '#/components/schemas/FeatureKind'
        limit:
          format: int64
          type:
          - integer
          - 'null'
        source:
          $ref: '#/components/schemas/EntitlementSourceView'
      required:
      - feature
      - kind
      - enabled
      - source
      type: object
    RoleScope:
      description: Where a role applies.
      enum:
      - platform
      - tenant
      type: string
    RoleView:
      description: One role as exposed by the API.
      properties:
        created_at:
          format: date-time
          type: string
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        is_system:
          type: boolean
        key:
          type: string
        name:
          type: string
        permissions:
          items:
            type: string
          type: array
        scope:
          $ref: '#/components/schemas/RoleScope'
        tenant_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      required:
      - id
      - scope
      - key
      - name
      - permissions
      - is_system
      - created_at
      type: object
    UpdateFeatureRequest:
      properties:
        default_enabled:
          type: boolean
        default_limit:
          format: int64
          type:
          - integer
          - 'null'
        name:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
      required:
      - name
      - default_enabled
      type: object
    UpdateRoleRequest:
      properties:
        name:
          type:
          - string
          - 'null'
        permissions:
          items:
            type: string
          type:
          - array
          - 'null'
      type: object
    Visibility:
      description: Whether the feature shows up in tenant-facing catalogs.
      enum:
      - public
      - hidden
      type: string
info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/access/permissions:
    get:
      operationId: list_permissions
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PermissionView'
                type: array
          description: Permission registry
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Not authenticated
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
      summary: |-
        `GET /api/v1/access/permissions` — the central permission registry,
        for the admin/UI contracts. Readable by any authenticated subject.
      tags:
      - access
  /api/v1/platform/features:
    get:
      operationId: list_features
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FeatureView'
                type: array
          description: Feature catalog
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
      summary: '`GET /api/v1/platform/features` — the feature catalog.'
      tags:
      - access
    post:
      operationId: define_feature
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefineFeatureRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureView'
          description: Feature defined
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid definition
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Feature key already exists
      summary: '`POST /api/v1/platform/features` — define a new feature.'
      tags:
      - access
  /api/v1/platform/features/{key}:
    delete:
      operationId: deprecate_feature
      parameters:
      - description: Feature key
        in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureView'
          description: Feature deprecated
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Feature not found
      summary: |-
        `DELETE /api/v1/platform/features/{key}` — deprecate a feature (it stays
        resolvable; it stops appearing in tenant-facing catalogs).
      tags:
      - access
    patch:
      operationId: update_feature
      parameters:
      - description: Feature key
        in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeatureRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureView'
          description: Feature updated
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid definition
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Feature not found
      summary: '`PATCH /api/v1/platform/features/{key}` — update a feature''s defaults.'
      tags:
      - access
  /api/v1/platform/roles:
    get:
      operationId: list_roles_platform
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RoleView'
                type: array
          description: Role catalog
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
      summary: '`GET /api/v1/platform/roles` — the full role catalog (operator console).'
      tags:
      - access
  /api/v1/tenant/entitlements:
    get:
      operationId: list_tenant_entitlements
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ResolvedEntitlementView'
                type: array
          description: Resolved entitlements
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied or feature not enabled
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: No tenant context
      summary: |-
        `GET /api/v1/tenant/entitlements` — the tenant's own resolved
        entitlements (feature-gated on `access.tenant_entitlements`).
      tags:
      - access
  /api/v1/tenant/roles:
    get:
      operationId: list_roles_tenant
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RoleView'
                type: array
          description: Assignable roles
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permission denied
      summary: '`GET /api/v1/tenant/roles` — roles assignable in the current tenant.'
      tags:
      - access
    post:
      operationId: create_role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleView'
          description: Role created
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid role definition
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Escalation or permission denied
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Role key already exists
      summary: |-
        `POST /api/v1/tenant/roles` — create a custom tenant role. The role may
        only grant permissions the caller already holds (no escalation).
      tags:
      - access
  /api/v1/tenant/roles/{id}:
    delete:
      operationId: delete_role
      parameters:
      - description: Role id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '204':
          description: Role deleted
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: System role or permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Role not found
      summary: '`DELETE /api/v1/tenant/roles/{id}` — delete a custom tenant role.'
      tags:
      - access
    patch:
      operationId: update_role
      parameters:
      - description: Role id
        in: path
        name: id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleView'
          description: Role updated
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid role definition
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Escalation or permission denied
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Role not found
      summary: '`PATCH /api/v1/tenant/roles/{id}` — update a custom tenant role.'
      tags:
      - access
