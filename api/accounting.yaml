components:
  schemas:
    AccountMappings:
      additionalProperties: false
      description: Provider account mappings are immutable once a destination is used.
      properties:
        clearing_account:
          type: string
        refund_account:
          type: string
        revenue_account:
          type: string
        tax_codes:
          additionalProperties:
            type: string
          propertyNames:
            type: string
          type: object
      required:
      - revenue_account
      - refund_account
      - clearing_account
      - tax_codes
      type: object
    AccountingConnectionView:
      properties:
        credential_status:
          $ref: '#/components/schemas/CredentialStatusView'
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        mappings:
          $ref: '#/components/schemas/AccountMappings'
        organization_id:
          type: string
        provider:
          $ref: '#/components/schemas/AccountingProvider'
      required:
      - id
      - provider
      - organization_id
      - mappings
      - credential_status
      type: object
    AccountingProvider:
      enum:
      - freee
      - money_forward
      - xero
      type: string
    ActivateBookRequest:
      additionalProperties: false
      properties:
        connection_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        starts_at:
          format: date-time
          type: string
      required:
      - connection_id
      - starts_at
      type: object
    BookView:
      properties:
        connections:
          items:
            $ref: '#/components/schemas/AccountingConnectionView'
          type: array
        id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        legal_entity_key:
          type: string
        periods:
          items:
            $ref: '#/components/schemas/PeriodView'
          type: array
        revision:
          format: int64
          type: integer
        scheduled_switch:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PeriodView'
      required:
      - id
      - legal_entity_key
      - revision
      - connections
      - periods
      type: object
    CompleteAuthorizationRequest:
      additionalProperties: false
      properties:
        code:
          type: string
        state:
          type: string
      required:
      - state
      - code
      type: object
    CreateBookRequest:
      additionalProperties: false
      properties:
        legal_entity_key:
          type: string
      required:
      - legal_entity_key
      type: object
    CredentialStatusView:
      enum:
      - none
      - active
      - reauthorization_required
      - revoked
      type: string
    FieldIssue:
      description: |-
        One field-addressed validation issue (TASK-027, FR-1127).

        A validation error that names the input it belongs to lets a client
        build an error summary that links back to the offending field instead
        of guessing from a flat string. `field` is the request-body path,
        root-relative, with bracketed indices for sequence elements
        (`hostname`, `budget.amount.currency`,
        `ad_groups[2].ads[0].creative.placement`) — the same grammar the
        advertising capability matrix already speaks.
      properties:
        field:
          description: Root-relative path to the offending request field.
          type: string
        message:
          description: |-
            Why this field was rejected. Human-readable; `detail` stays the
            request-level summary and is never a replacement for it.
          type: string
      required:
      - field
      - message
      type: object
    PeriodStateView:
      enum:
      - active
      - scheduled
      - draining
      - closed
      type: string
    PeriodView:
      properties:
        connection_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        ends_at:
          format: date-time
          type:
          - string
          - 'null'
        starts_at:
          format: date-time
          type: string
        state:
          $ref: '#/components/schemas/PeriodStateView'
      required:
      - connection_id
      - starts_at
      - state
      type: object
    ProblemDetail:
      allOf:
      - description: |-
          RFC 9457 extension members for problem classes that carry
          structured extras (the disconnect conflict names its blockers,
          for example). Flattened onto the JSON object exactly as the RFC
          prescribes; carrying them here keeps the error-enrichment layer
          from stripping them. Absent otherwise.
        type:
        - object
        - 'null'
      - properties:
          detail:
            description: Human-readable explanation of this specific occurrence.
            type: string
          fields:
            description: |-
              The fields a validation rejection names (TASK-027, FR-1127), as an
              RFC 9457 extension member. Present only when the error is
              field-addressed; the human-readable `detail` is never removed from
              an error that grows field addressing.
            items:
              $ref: '#/components/schemas/FieldIssue'
            type:
            - array
            - 'null'
          instance:
            description: URI of the offending resource, if any.
            type:
            - string
            - 'null'
          reason:
            description: |-
              Machine-readable reason for statuses that carry one (e.g. tenant
              suspension); absent otherwise.
            type:
            - string
            - 'null'
          status:
            description: HTTP status code (mirrors the response code).
            format: int32
            minimum: 0
            type: integer
          title:
            description: Short, human-readable, stable title.
            type: string
          trace_id:
            description: |-
              Correlates with the trace in OpenObserve: the W3C trace id of the
              span serving the request (the same trace the `traceparent` response
              header references), falling back to the request id when the request
              ran outside any OpenTelemetry context.
            type:
            - string
            - 'null'
          type:
            description: Stable URI identifying the error class.
            example: https://sanvi.dev/problems/bad-request
            type: string
        required:
        - type
        - title
        - status
        - detail
        type: object
      description: RFC 9457 problem detail. This is the only error body the API produces.
    RegisterConnectionRequest:
      additionalProperties: false
      properties:
        mappings:
          $ref: '#/components/schemas/AccountMappings'
        organization_id:
          type: string
        provider:
          $ref: '#/components/schemas/AccountingProvider'
      required:
      - provider
      - organization_id
      - mappings
      type: object
    ScheduleSwitchRequest:
      additionalProperties: false
      properties:
        connection_id:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
        cutover_at:
          format: date-time
          type: string
      required:
      - connection_id
      - cutover_at
      type: object
    StartAuthorizationResponse:
      properties:
        authorization_url:
          type: string
      required:
      - authorization_url
      type: object
info:
  description: Multi-tenant SaaS platform API (v1)
  license:
    identifier: MIT
    name: MIT
  title: Sanvi API
  version: 0.10.0
openapi: 3.1.0
paths:
  /api/v1/tenant/accounting/authorization/callback:
    post:
      operationId: complete_accounting_authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAuthorizationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookView'
          description: Authorization completed; updated book returned
          headers:
            ETag:
              description: Entity tag carrying the book's current revision
              schema:
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Authorization rejected (state invalid, expired, already consumed, or organization mismatch)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing tenant.accounting.manage permission or accounting.freee entitlement
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: freee is not configured
      tags:
      - accounting
  /api/v1/tenant/accounting/books:
    get:
      operationId: list_accounting_books
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BookView'
                type: array
          description: Every accounting book in the tenant, ordered by ID
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing tenant.accounting.read permission or accounting.freee entitlement
      tags:
      - accounting
    post:
      operationId: create_accounting_book
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookView'
          description: Book created
          headers:
            ETag:
              description: Entity tag carrying the book's initial revision
              schema:
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid book parameters or unknown body fields
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing tenant.accounting.manage permission or accounting.freee entitlement
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Legal entity key already exists for this tenant
      tags:
      - accounting
  /api/v1/tenant/accounting/books/{book_id}:
    get:
      operationId: get_accounting_book
      parameters:
      - description: Decimal Snowflake book ID
        in: path
        name: book_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookView'
          description: Book details
          headers:
            ETag:
              description: Entity tag carrying the book's current revision
              schema:
                type: string
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing tenant.accounting.read permission or accounting.freee entitlement
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Book not found
      tags:
      - accounting
  /api/v1/tenant/accounting/books/{book_id}/activation:
    post:
      operationId: activate_accounting_book
      parameters:
      - description: Decimal Snowflake book ID
        in: path
        name: book_id
        required: true
        schema:
          type: string
      - description: Required. The book's current revision entity tag (e.g. "1").
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateBookRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookView'
          description: Book destination activated; updated book returned
          headers:
            ETag:
              description: Updated revision entity tag
              schema:
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing or malformed If-Match header, or invalid start time
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing tenant.accounting.manage permission, missing accounting.freee entitlement, or fresh MFA missing
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Book or connection not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale If-Match revision, or book already activated
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: provider verification failed
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: freee is not configured
      tags:
      - accounting
  /api/v1/tenant/accounting/books/{book_id}/connections:
    post:
      operationId: register_accounting_connection
      parameters:
      - description: Decimal Snowflake book ID
        in: path
        name: book_id
        required: true
        schema:
          type: string
      - description: Required. The book's current revision entity tag (e.g. "1").
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterConnectionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookView'
          description: Connection registered; book returned with updated revision
          headers:
            ETag:
              description: Updated revision entity tag
              schema:
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing or malformed If-Match header, or invalid connection payload
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing tenant.accounting.manage permission or accounting.freee entitlement
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Book not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale If-Match revision, or conflicting provider connection
      tags:
      - accounting
  /api/v1/tenant/accounting/books/{book_id}/connections/{connection_id}/authorization:
    delete:
      operationId: revoke_accounting_authorization
      parameters:
      - description: Decimal Snowflake book ID
        in: path
        name: book_id
        required: true
        schema:
          type: string
      - description: Decimal Snowflake connection ID
        in: path
        name: connection_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '204':
          description: Provider authorization revoked locally
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing tenant.accounting.manage permission, missing accounting.freee entitlement, or fresh MFA missing
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Book or connection not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The connection is an active, scheduled or draining destination
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: freee is not configured
      tags:
      - accounting
    post:
      operationId: start_accounting_authorization
      parameters:
      - description: Decimal Snowflake book ID
        in: path
        name: book_id
        required: true
        schema:
          type: string
      - description: Decimal Snowflake connection ID
        in: path
        name: connection_id
        required: true
        schema:
          examples:
          - '873698342314721281'
          format: snowflake-id
          pattern: ^[1-9][0-9]{0,18}$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAuthorizationResponse'
          description: Provider authorization URL issued
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing tenant.accounting.manage permission, missing accounting.freee entitlement, or fresh MFA missing
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Book or connection not found
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: freee is not configured
      tags:
      - accounting
  /api/v1/tenant/accounting/books/{book_id}/switch:
    delete:
      operationId: cancel_accounting_switch
      parameters:
      - description: Decimal Snowflake book ID
        in: path
        name: book_id
        required: true
        schema:
          type: string
      - description: Required. The book's current revision entity tag (e.g. "1").
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookView'
          description: Scheduled switch canceled; updated book returned
          headers:
            ETag:
              description: Updated revision entity tag
              schema:
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing or malformed If-Match header
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing tenant.accounting.manage permission or accounting.freee entitlement
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Book not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale If-Match revision, or no switch is scheduled
      tags:
      - accounting
    put:
      operationId: schedule_accounting_switch
      parameters:
      - description: Decimal Snowflake book ID
        in: path
        name: book_id
        required: true
        schema:
          type: string
      - description: Required. The book's current revision entity tag (e.g. "1").
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSwitchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookView'
          description: Switch scheduled; updated book returned
          headers:
            ETag:
              description: Updated revision entity tag
              schema:
                type: string
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing or malformed If-Match header, or invalid cutover time
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing tenant.accounting.manage permission, missing accounting.freee entitlement, or fresh MFA missing
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Book or connection not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Stale If-Match revision, or switch already pending
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: provider verification failed
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: freee is not configured
      tags:
      - accounting
