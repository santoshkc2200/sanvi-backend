[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/platform/telemetry",
    "crates/platform/persistence",
    "crates/platform/messaging",
    "crates/platform/cache",
    "crates/platform/http",
    "crates/contexts/system",
    "crates/contexts/tenancy",
    "crates/contexts/identity",
    "crates/contexts/access",
    "crates/contexts/audit",
    "crates/contexts/platform_admin",
    "crates/contexts/billing",
    "crates/contexts/privacy",
    "crates/contexts/localization",
    "crates/contexts/theming",
    "crates/contexts/domains",
    "apps/api",
    "apps/worker",
    "apps/cli",
]
default-members = ["apps/api", "apps/worker", "apps/cli"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/sanvi/sanvi-backend"
authors = ["Sanvi Team"]
# Internal application crates, never published to crates.io. Also lets
# cargo-deny's `allow-wildcard-paths` apply: it only trusts unversioned path
# deps between workspace members once they're marked unpublishable, since
# crates.io itself would reject a published crate with such a dependency.
publish = false

[workspace.dependencies]
sanvi-kernel = { path = "crates/kernel" }
sanvi-telemetry = { path = "crates/platform/telemetry" }
sanvi-persistence = { path = "crates/platform/persistence" }
sanvi-messaging = { path = "crates/platform/messaging" }
sanvi-cache = { path = "crates/platform/cache" }
sanvi-http = { path = "crates/platform/http" }
sanvi-system = { path = "crates/contexts/system" }
sanvi-tenancy = { path = "crates/contexts/tenancy" }
sanvi-identity = { path = "crates/contexts/identity" }
sanvi-access = { path = "crates/contexts/access" }
sanvi-audit = { path = "crates/contexts/audit" }
sanvi-platform-admin = { path = "crates/contexts/platform_admin" }
sanvi-billing = { path = "crates/contexts/billing" }
sanvi-privacy = { path = "crates/contexts/privacy" }
sanvi-localization = { path = "crates/contexts/localization" }
sanvi-theming = { path = "crates/contexts/theming" }
sanvi-domains = { path = "crates/contexts/domains" }
sanvi-api = { path = "apps/api" }

actix-web = "4"
actix-cors = "0.7"
actix-http = "3"
actix-service = "2"
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
figment = { version = "0.10", features = ["toml", "env"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
idna = "1"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics"] }
opentelemetry-prometheus = "0.32"
opentelemetry-semantic-conventions = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
pbkdf2 = "0.12"
prometheus = { version = "0.14", features = ["process"] }
psl = "2"
rand = "0.8"
redis = { version = "1.5", default-features = false, features = ["tokio-comp", "aio", "connection-manager", "script", "streams"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
    "ipnetwork",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs", "io-util"] }
# Only for `tonic::metadata` (the OTLP auth headers OpenObserve requires).
# Must stay on the same major as opentelemetry-otlp's own tonic, or the
# MetadataMap we build is a different type from the one it accepts.
tonic = { version = "0.14", default-features = false }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
unicode-normalization = "0.1"
utoipa = { version = "5", features = ["uuid", "chrono"] }
utoipa-scalar = { version = "0.3", features = ["actix-web"] }
uuid = { version = "1", features = ["v7", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

proptest = "1"
# Pinned to what testcontainers-modules 0.15 (latest) depends on; bumping past
# 0.27 conflicts on the transitive `bollard-stubs` version until modules 0.16 ships.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
