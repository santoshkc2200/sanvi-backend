[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/platform/telemetry",
    "crates/platform/persistence",
    "crates/platform/messaging",
    "crates/platform/http",
    "crates/contexts/system",
    "apps/api",
    "apps/worker",
    "apps/cli",
]
default-members = ["apps/api", "apps/worker", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/sanvi/sanvi-backend"
authors = ["Sanvi Team"]

[workspace.dependencies]
sanvi-kernel = { path = "crates/kernel" }
sanvi-telemetry = { path = "crates/platform/telemetry" }
sanvi-persistence = { path = "crates/platform/persistence" }
sanvi-messaging = { path = "crates/platform/messaging" }
sanvi-http = { path = "crates/platform/http" }
sanvi-system = { path = "crates/contexts/system" }
sanvi-api = { path = "apps/api" }

actix-web = "4"
actix-cors = "0.7"
actix-http = "3"
actix-service = "2"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
futures-util = "0.3"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics"] }
opentelemetry-prometheus = "0.32"
opentelemetry-semantic-conventions = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
prometheus = { version = "0.14", features = ["process"] }
redis = { version = "0.29", default-features = false, features = ["tokio-comp", "aio", "connection-manager", "script", "streams"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs", "io-util"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
utoipa = "5"
utoipa-scalar = { version = "0.3", features = ["actix-web"] }
uuid = { version = "1", features = ["v7", "serde"] }

proptest = "1"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
