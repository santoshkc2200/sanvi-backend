# Production overlay. Secrets via the platform secret manager, exposed to the
# process as SANVI__* environment variables. Reviewed by the platform team on
# every change.

[ids]
# One replica's node. Every concurrently running replica needs its own value.
node_id = 201

[server.cors]
allowed_origins = ["https://app.sanvi.dev", "https://admin.sanvi.dev"]

[database]
ssl_mode = "require"
max_connections = 50
min_connections = 10
acquire_timeout_secs = 5

[server.rate_limit]
enabled = true
burst = 120
per_second = 20
# TASK-023: Redis outages continue through the reduced admission ceiling.
fail_open = true

# NFR-1114: HSTS on the API host (and its subdomains — none exist today,
# so the directive costs nothing) for a year. Preload submission is an
# operations decision and stays off.
[server.security.hsts]
max_age_secs = 31536000
include_sub_domains = true

[telemetry]
log_format = "json"
environment = "production"

[telemetry.otlp]
enabled = true
endpoint = "http://openobserve:5081"
organization = "sanvi"
stream = "production"
# auth_token via SANVI__TELEMETRY__OTLP__AUTH_TOKEN (secret manager).
