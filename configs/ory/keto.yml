version: v26.2.0

dsn: postgres://postgres:postgres-local-dev@postgres:5432/postgres

serve:
  read:
    host: 0.0.0.0
    port: 4466
  write:
    host: 0.0.0.0
    port: 4467

log:
  level: info
  format: text

# Phase 02 defines the real namespaces. Tuple shapes:
#   role:{tenant_id|platform}:{key}#member@user:{user_id}
#   tenant:{tenant_id}#member@user:{user_id}
#   permission:{permission_key}#granted@role:{...}#member
# Later phases add their resource namespaces.
namespaces:
  - id: 0
    name: user
  - id: 1
    name: tenant
  - id: 2
    name: role
  - id: 3
    name: permission
  - id: 4
    name: subscription
  - id: 5
    name: domain
  - id: 6
    name: campaign
  - id: 7
    name: theme
