# Staging overlay. Secrets via the platform secret manager, exposed to the
# process as SANVI__* environment variables.

[ids]
# One replica's node. Each additional API or worker replica must override
# SANVI__IDS__NODE_ID with a distinct value.
node_id = 101

[server.cors]
allowed_origins = ["https://app.staging.sanvi.dev", "https://admin.staging.sanvi.dev"]

[database]
ssl_mode = "require"
max_connections = 25
min_connections = 5

[telemetry]
log_format = "json"
environment = "staging"

[telemetry.otlp]
enabled = true
endpoint = "http://openobserve:5081"
organization = "sanvi"
stream = "staging"
# auth_token via SANVI__TELEMETRY__OTLP__AUTH_TOKEN (secret manager).
