# Local development stack.
#
# Default (no profile): the `core` services — Postgres + Redis.
# `./scripts/dev.sh up --full` adds Ory Kratos/Keto, Mailpit, MinIO,
# OpenObserve.
# `docker compose up` also starts the API and worker with distinct local
# Snowflake nodes from docker-compose.override.yml.
#
# Ory containers run from day one but nothing consumes them until phase 02.
#
# Every image below is pinned to an explicit tag (never :latest) so a fresh
# `docker compose pull` can't silently change what's running. Kratos/Keto/
# Mailpit/OpenObserve/MinIO were all re-verified live against this repo's
# actual configs when last bumped — see git history for what broke and why.

name: sanvi

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-dev
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 stores data in a major-version-specific subdirectory and
      # requires the mount at the parent (`/var/lib/postgresql`), not at
      # `data/` — mounting data/ directly refuses to start.
      - pgdata:/var/lib/postgresql
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://postgres:postgres-local-dev@postgres:5432/postgres
    volumes:
      - ./configs/ory:/etc/config/kratos:ro
    command: migrate sql -e --yes

  kratos:
    image: oryd/kratos:v26.2.0
    profiles: ["full"]
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    ports:
      - "4433:4433"
      - "4434:4434"
    extra_hosts:
      # The API runs on the host; webhooks reach it through the gateway.
      - "host.docker.internal:host-gateway"
    environment:
      DSN: postgres://postgres:postgres-local-dev@postgres:5432/postgres
      LOG_LEVEL: trace
      # OIDC provider secrets: v26 reads them from configx environment
      # overrides (underscores separate nesting, arrays are indexed), not
      # from ${VAR} substitution in the file — empty by default (OIDC
      # buttons fail until filled). See docs/runbooks/add-oidc-provider.md.
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    volumes:
      - ./configs/ory:/etc/config/kratos:ro
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier

  keto-migrate:
    image: oryd/keto:v26.2.0
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://postgres:postgres-local-dev@postgres:5432/postgres
    # v26.2.0 requires a config file for `migrate up` too, unlike v0.16.0
    # which only needed DSN.
    volumes:
      - ./configs/ory/keto.yml:/etc/config/keto/keto.yml:ro
    command: migrate up -y -c /etc/config/keto/keto.yml

  keto:
    image: oryd/keto:v26.2.0
    profiles: ["full"]
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    ports:
      - "4466:4466"
      - "4467:4467"
    environment:
      DSN: postgres://postgres:postgres-local-dev@postgres:5432/postgres
    volumes:
      - ./configs/ory/keto.yml:/etc/config/keto/keto.yml:ro
    command: serve -c /etc/config/keto/keto.yml

  # stripe-mock: a local HTTP stand-in for the Stripe API (no real charges,
  # no real keys). Point SANVI__BILLING__STRIPE_API_BASE at it
  # (http://localhost:12111) to exercise checkout/portal/webhook flows in
  # local development.
  stripe-mock:
    image: stripe/stripe-mock:v0.195.0
    profiles: ["billing"]
    ports:
      - "12111:12111"
      - "12112:12112"

  # stripe-cli: forwards test-mode Stripe webhooks to the API container.
  # Usage: stripe listen --forward-to host.docker.internal:8081/internal/webhooks/stripe/platform
  # (run with `docker compose run --rm stripe-cli ...` after docker login).
  stripe-cli:
    image: stripe/stripe-cli:v1.35.0
    profiles: ["billing"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/stripe"]

  # mailhog is unmaintained (no releases since 2020); mailpit is the active,
  # drop-in-compatible successor (same SMTP :1025 / web UI :8025 defaults).
  mailpit:
    image: axllent/mailpit:v1.30.7
    profiles: ["full"]
    ports:
      - "1025:1025"
      - "8025:8025"

  # minio/minio on Docker Hub was archived in Feb 2026 (community edition is
  # source-only now); Chainguard publishes an actively-maintained,
  # zero-CVE-focused build that's a verified drop-in (same env vars, same
  # `server /data --console-address :9001` command, same ports). Chainguard's
  # free tier only offers a rolling :latest, not pinned numeric tags.
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-local-dev
      MINIO_ROOT_PASSWORD: minio-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # OpenObserve replaces Jaeger: one single-binary backend for traces, metrics
  # and logs instead of a traces-only UI. It is its own OTLP receiver — no
  # collector in front — but it does not use the standard OTLP ports: gRPC is
  # :5081 and HTTP/UI share :5080 (traces POST to /api/<org>/v1/traces).
  #
  # Ingestion is authenticated, unlike Jaeger's open OTLP port: every request
  # carries `authorization: Basic <base64(email:password)>` plus `organization`
  # and `stream-name` metadata. The root credentials below are read on first
  # start only — they are baked into the volume, so changing them here after
  # the fact does nothing until `./scripts/dev.sh reset`.
  #
  # The default org for a fresh root user is literally named `default`; that's
  # what configs/base.toml points at.
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.92.1
    profiles: ["full"]
    environment:
      ZO_ROOT_USER_EMAIL: root@sanvi.local
      # Rejected at boot unless it has upper, lower, digit and symbol.
      ZO_ROOT_USER_PASSWORD: OpenObserve-local-dev1
      ZO_DATA_DIR: /data
      # Off by default it phones home usage events on every start.
      ZO_TELEMETRY: "false"
    ports:
      - "5080:5080"
      - "5081:5081"
    volumes:
      - openobservedata:/data

volumes:
  pgdata:
  miniodata:
  openobservedata:
