worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;
events { worker_connections 4096; }
http {
    access_log /dev/stdout;
    client_max_body_size 1m;
    # Empty by default. A provisioned outer TLS proxy requires an exact
    # SANVI_TRUSTED_EDGE_CIDR; arbitrary forwarding headers remain untrusted.
    include /etc/nginx/sanvi/trusted-realip.conf;
    # No forced worker shutdown: the deploy script waits for old workers
    # to finish before reusing their API slot.
    include /etc/nginx/sanvi/active.conf;
}
