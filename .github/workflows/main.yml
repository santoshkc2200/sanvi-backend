name: main — build, sign, deploy staging

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Image tag to roll back to, e.g. sha-<40-char-sha> or a semver tag
          from a previous successful `build` run. Find one with
          `gh api /orgs/sanvi/packages/container/sanvi-backend-api/versions`
          or in the registry UI.
        required: true

permissions:
  contents: read
  id-token: write # keyless signing
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build & sign image
    runs-on: ubuntu-latest
    # migrate/deploy/smoke all `needs` this transitively and are skipped
    # automatically when it is; `rollback` is the only job that runs on
    # workflow_dispatch, so this excludes it from that trigger explicitly.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: set up QEMU + Buildx
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: sign image (keyless)
        uses: sigstore/cosign-installer@v4
      - run: |
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}-api@${{ steps.build.outputs.digest }}"

  migrate:
    name: run migrations (pre-deploy)
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker run --rm \
            -e SANVI__DATABASE__HOST="${{ secrets.STAGING_DB_HOST }}" \
            -e SANVI__DATABASE__PORT="${{ secrets.STAGING_DB_PORT }}" \
            -e SANVI__DATABASE__NAME="${{ secrets.STAGING_DB_NAME }}" \
            -e SANVI__DATABASE__USER="${{ secrets.STAGING_DB_MIGRATOR_USER }}" \
            -e SANVI__DATABASE__PASSWORD="${{ secrets.STAGING_DB_MIGRATOR_PASSWORD }}" \
            -e SANVI__DATABASE__SSL_MODE=require \
            -v "$PWD/migrations:/app/migrations:ro" \
            "${REGISTRY}/${IMAGE_NAME}-api:sha-${{ github.sha }}" \
            /usr/local/bin/sanvi-cli migrate up

  deploy:
    name: deploy staging (reversible)
    runs-on: ubuntu-latest
    needs: migrate
    environment: staging
    steps:
      - name: deploy via SSH (docker compose pull + up)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          # ${{ }} expressions are rendered by Actions before this script is
          # sent over SSH, so the image reference is fully resolved here —
          # the remote shell never needs REGISTRY/IMAGE_NAME in its own env.
          # This pins deploy to the exact image `migrate` just ran against;
          # docker-compose.staging.yml's `${API_IMAGE:-...:latest}` fallback
          # is only for a manual `docker compose up` outside this pipeline.
          script: |
            set -e
            cd /opt/sanvi
            export API_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:sha-${{ github.sha }}"
            export WORKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:sha-${{ github.sha }}"
            docker compose -f docker-compose.staging.yml pull api worker
            docker compose -f docker-compose.staging.yml up -d --no-deps api worker
            docker compose -f docker-compose.staging.yml ps

  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: smoke against staging
        run: |
          for endpoint in healthz readyz api/v1/system/version; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 15 "https://${{ secrets.STAGING_HOSTNAME }}/$endpoint")
            echo "/$endpoint -> $status"
            [ "$status" = "200" ] || exit 1
          done

  rollback:
    name: rollback (manual)
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: revert to the requested image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          # Pins to the operator-supplied `image_tag` input, not whatever
          # `:latest` currently resolves to — a "rollback" that redeploys
          # the same floating tag isn't a rollback.
          script: |
            set -e
            cd /opt/sanvi
            CURRENT="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$(docker ps -aq --filter name=sanvi-api)" 2>/dev/null || echo unknown)"
            export API_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.event.inputs.image_tag }}"
            export WORKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.event.inputs.image_tag }}"
            echo "currently running revision: $CURRENT"
            echo "rolling back to: $API_IMAGE"
            docker compose -f docker-compose.staging.yml pull api worker
            docker compose -f docker-compose.staging.yml up -d --no-deps api worker
            docker compose -f docker-compose.staging.yml ps
