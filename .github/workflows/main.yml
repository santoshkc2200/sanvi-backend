name: main — build, sign, deploy staging

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_digest:
        description: >-
          Exact sha256:<64 hex> digest of a sanvi-hardened-v1 image or newer
          with the current schema's applied migrations. Pre-hardening images
          are unsupported; this operation never downgrades the database.
        required: true
      deployment_mode:
        description: Rolling deploy or an explicit downtime window for incompatible migrations
        required: true
        type: choice
        options: [rolling, maintenance]
        default: rolling

permissions:
  contents: read
  id-token: write # keyless signing
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  build:
    name: build & sign image
    runs-on: ubuntu-latest
    # migrate/deploy/smoke all `needs` this transitively and are skipped
    # automatically when it is; `rollback` is the only job that runs on
    # workflow_dispatch, so this excludes it from that trigger explicitly.
    if: github.event_name == 'push'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long

      - name: set up QEMU + Buildx
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: sign image (keyless)
        uses: sigstore/cosign-installer@v4
      - run: |
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}-api@${{ steps.build.outputs.digest }}"

  deploy:
    name: migrate and deploy staging (serialized, exact image)
    runs-on: ubuntu-latest
    needs: build
    if: always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: copy deployment controller and proxy configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.staging.yml,deployment/nginx.conf,scripts/deploy-staging.sh,scripts/check-deployment-migrations.py,scripts/write-trusted-edge.py"
          target: /opt/sanvi
      - name: deploy via SSH (health-gated traffic switch)
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_DIGEST: ${{ needs.build.outputs.digest || inputs.image_digest }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode || 'rolling' }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: DEPLOY_DIGEST,DEPLOYMENT_MODE
          # Migrations, classification, and traffic switch share one host lock.
          # Host-managed secrets never cross GitHub Actions or SSH arguments.
          script: |
            set -eu
            cd /opt/sanvi
            [[ "$DEPLOY_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 2
            export API_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api@$DEPLOY_DIGEST"
            export WORKER_IMAGE="$API_IMAGE"
            export SANVI_RUNTIME_ENV_FILE=/opt/sanvi/secrets/runtime.env
            export SANVI_MIGRATOR_ENV_FILE=/opt/sanvi/secrets/migrator.env
            # Optional, non-secret, host-owned exact trusted TLS-proxy CIDR.
            # Keep it outside the runtime secret file (never source secrets).
            if [[ -f /opt/sanvi/secrets/trusted-edge-cidr ]]; then
              export SANVI_TRUSTED_EDGE_CIDR="$(cat /opt/sanvi/secrets/trusted-edge-cidr)"
            fi
            bash scripts/deploy-staging.sh
            docker compose -f docker-compose.staging.yml ps

  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: smoke against staging
        run: |
          for endpoint in healthz readyz api/v1/system/version; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 15 "https://${{ secrets.STAGING_HOSTNAME }}/$endpoint")
            echo "/$endpoint -> $status"
            [ "$status" = "200" ] || exit 1
          done
