name: PR gates

on:
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # Incremental compilation only pays off across edits to the same tree. A
  # runner gets a fresh checkout every time, so the artifacts are never
  # reused — they just make the build slower to write and the cache that
  # `Swatinem/rust-cache` saves and restores much larger.
  CARGO_INCREMENTAL: "0"

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup (preinstalled on the runner) auto-installs the exact
      # toolchain — and, per rust-toolchain.toml's `components`, rustfmt —
      # pinned in rust-toolchain.toml the first time cargo/rustc runs here.
      # A `dtolnay/rust-toolchain@stable` step would install whatever is
      # current stable *instead*, silently ignoring that pin.
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - run: cargo fmt --check

  clippy:
    name: cargo clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      # No crate defines [features] (check with: rg -n '^\[features\]' -g '**/Cargo.toml' before re-adding it); --all-features omitted to save resolver overhead.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  layering:
    name: architecture lint (+ self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-layering.sh
      - run: ./scripts/check-layering.sh --self-test

  connect-invariants:
    name: Stripe Connect invariants (+ self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-connect-invariants.sh
      - run: ./scripts/check-connect-invariants.sh --self-test

  test:
    name: cargo test (unit + application, SQLx offline)
    runs-on: ubuntu-latest
    services:
      # One server for the whole job. The suites clone a private database per
      # test from a pre-migrated template instead of starting a container
      # each — `nextest` runs a process per test, so a container each would
      # mean hundreds of them.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SANVI_TEST_PG_PORT: 5432
      SANVI_TEST_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # resilience-tests is Docker-backed (the dependency-matrix injection
      # suite, TASK-023) and runs in the integration job's derived crate
      # list below — not here, where it would run twice.
      - run: cargo nextest run --profile ci --workspace --exclude sanvi-persistence --exclude sanvi-messaging --exclude sanvi-tenancy --exclude resilience-tests
        env:
          SQLX_OFFLINE: "true"

  sqlx-prepare:
    name: SQLx query cache is in sync
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prep
          POSTGRES_PASSWORD: prep
          POSTGRES_DB: prep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@sqlx-cli
      - name: prepare schema
        run: |
          PGPASSWORD=prep psql -h 127.0.0.1 -U prep -d prep -c "CREATE ROLE sanvi_app LOGIN PASSWORD 'app' NOBYPASSRLS;"
          for f in migrations/*.sql; do case "$f" in *.down.sql) continue;; esac; PGPASSWORD=prep psql -h 127.0.0.1 -U prep -d prep -q -f "$f"; done
      - name: check query cache
        run: cargo sqlx prepare --workspace --check
        env:
          DATABASE_URL: postgres://prep:prep@127.0.0.1:5432/prep

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      # One server for the whole job. The suites clone a private database per
      # test from a pre-migrated template instead of starting a container
      # each — `nextest` runs a process per test, so a container each would
      # mean hundreds of them.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SANVI_TEST_PG_PORT: 5432
      SANVI_TEST_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The crate list is derived from the workspace at run time (TASK-031):
      # every member whose tests use the Docker-backed harness. The list this
      # replaces was maintained by hand, and a hand-written list is the defect
      # itself — a crate missing from it was tested by nothing, and a job that
      # runs no tests still passes. `ci-test-coverage` fails the PR if any
      # member with a tests/ directory is left uncovered by both jobs.
      # The empty guard is load-bearing: a failed derivation must fail the
      # step, not leave `args` empty for nextest to run unscoped.
      - name: derive the Docker-dependent crate list
        id: integration_packages
        run: |
          args="$(./scripts/check-ci-test-coverage.sh --integration-packages)"
          if [[ -z "$args" ]]; then
            echo "no packages derived; refusing to run nextest without an explicit crate list" >&2
            exit 1
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - run: cargo nextest run --profile ci ${{ steps.integration_packages.outputs.args }}

  ci-test-coverage:
    name: CI test coverage (+ self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      # The check fail-closes when jq or ripgrep is missing. Both ship on
      # the runner image today, but image contents are not a contract —
      # install them so the gate fails here, not on an image refresh.
      - name: install jq and ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -qq -y jq ripgrep
      - run: ./scripts/check-ci-test-coverage.sh
      - run: ./scripts/check-ci-test-coverage.sh --self-test

  sast:
    name: SAST (clippy security groups + semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      # The general clippy job denies all warnings but is blind to any crate
      # carrying a blanket `#[allow(...)]` attribute; group-level denies on
      # the command line pierce crate-level allows. That is this step's
      # signal, not duplication: on introduction it found two real defects in
      # sanvi-payments that the -D warnings job could not see. The artifacts
      # are shared with the main clippy job, so the cost is a re-lint, not a
      # second build.
      - name: clippy security lint groups
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious -D clippy::perf
      # Rules are the vendored snapshot in .semgrep/rust.yaml, not a
      # registry fetch: an upstream rule change must not redden unrelated
      # PRs, and a scan must be reproducible from the tree.
      - name: semgrep (vendored Rust ruleset)
        run: |
          python -m pip install --quiet "semgrep==1.176.1"
          semgrep scan --config .semgrep/rust.yaml --error --metrics=off

  secret-scan:
    name: Secret field enumeration (+ self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: taiki-e/install-action@nextest
      - run: ./scripts/check-secret-scan.sh
      - run: ./scripts/check-secret-scan.sh --self-test

  route-matrix:
    name: Route security matrix (+ mutation tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - run: ./scripts/generate-route-matrix.sh
      - run: ./scripts/generate-route-matrix.sh --self-test

  openapi:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-openapi.sh

  resilience-gates:
    name: Resilience gates (+ self-tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # TASK-023: the dependency-matrix manifest gate (both directions),
      # the no-unbounded-client gate, and the expand/contract migration
      # gate, each with the self-test proving it fails on a planted
      # violation. The injection suite itself (`-p resilience-tests`) runs
      # in the integration job's derived crate list. The rolling-restart
      # dry-run validates the compose restart-readiness the live drill
      # (staging host only) depends on.
      - run: ./scripts/check-dependency-matrix.sh
      - run: ./scripts/check-dependency-matrix.sh --self-test
      - run: ./scripts/check-timeouts.sh
      - run: ./scripts/check-timeouts.sh --self-test
      - run: ./scripts/check-migration-expand-contract.sh
      - run: ./scripts/check-migration-expand-contract.sh --self-test
      - run: ./scripts/rolling-restart.sh --dry-run
      - run: python3 scripts/test-restart-result.py
      - run: python3 scripts/test-deploy-staging.py

  i18n:
    name: i18n catalog gate (100 % ja coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p sanvi-cli -- i18n check

  audit:
    name: cargo audit (+ accepted-finding expiry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # TASK-024: an accepted advisory is a loan with a due date. deny.toml
      # is the ledger; this check fails when an acceptance is missing its
      # expires: date or the date has passed. Bash-only, no toolchain needed.
      - run: ./scripts/check-audit-acceptances.sh
      - run: ./scripts/check-audit-acceptances.sh --self-test

  deny:
    name: cargo deny (licenses, bans, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  secrets:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # v2 runs on the Node 20 runtime GitHub is retiring: opt-out required
      # from 2026-06-02, and it stops working entirely on 2026-09-16. v3 is
      # a behavior-identical Node 24 rebuild (no input/output changes).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required for organization-owned repos, not personal
          # accounts; harmless if GITLEAKS_LICENSE is unset.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - name: generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --all --format json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          # cargo-cyclonedx writes one document per crate, next to each
          # Cargo.toml -- not into the repo root.
          path: "**/*.cdx.json"

  trivy:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a release tag, not @master: trivy-action suffered a real
      # supply-chain compromise (credential-stealing code injected via
      # imposter commits, affecting all tags up to v0.34.2) discovered in
      # March 2026. @master would have tracked that compromised history
      # directly. v0.36.0 postdates the project's remediation.
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
