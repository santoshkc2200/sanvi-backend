name: PR gates

on:
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup (preinstalled on the runner) auto-installs the exact
      # toolchain — and, per rust-toolchain.toml's `components`, rustfmt —
      # pinned in rust-toolchain.toml the first time cargo/rustc runs here.
      # A `dtolnay/rust-toolchain@stable` step would install whatever is
      # current stable *instead*, silently ignoring that pin.
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - run: cargo fmt --check

  clippy:
    name: cargo clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  layering:
    name: architecture lint (+ self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-layering.sh
      - run: ./scripts/check-layering.sh --self-test

  test:
    name: cargo test (unit + application, SQLx offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --exclude sanvi-persistence --exclude sanvi-messaging --exclude sanvi-tenancy
        env:
          SQLX_OFFLINE: "true"

  sqlx-prepare:
    name: SQLx query cache is in sync
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prep
          POSTGRES_PASSWORD: prep
          POSTGRES_DB: prep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@sqlx-cli
      - name: prepare schema
        run: |
          PGPASSWORD=prep psql -h 127.0.0.1 -U prep -d prep -c "CREATE ROLE sanvi_app LOGIN PASSWORD 'app' NOBYPASSRLS;"
          for f in migrations/*.sql; do case "$f" in *.down.sql) continue;; esac; PGPASSWORD=prep psql -h 127.0.0.1 -U prep -d prep -q -f "$f"; done
      - name: check query cache
        run: cargo sqlx prepare --workspace --check
        env:
          DATABASE_URL: postgres://prep:prep@127.0.0.1:5432/prep

  integration:
    name: integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p sanvi-persistence -p sanvi-messaging -p sanvi-tenancy -p sanvi-billing

  openapi:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p sanvi-cli -- openapi --check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny (licenses, bans, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  secrets:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # v2 runs on the Node 20 runtime GitHub is retiring: opt-out required
      # from 2026-06-02, and it stops working entirely on 2026-09-16. v3 is
      # a behavior-identical Node 24 rebuild (no input/output changes).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required for organization-owned repos, not personal
          # accounts; harmless if GITLEAKS_LICENSE is unset.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      - name: generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --all --format json --output-format json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "*.cdx.json"

  trivy:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a release tag, not @master: trivy-action suffered a real
      # supply-chain compromise (credential-stealing code injected via
      # imposter commits, affecting all tags up to v0.34.2) discovered in
      # March 2026. @master would have tracked that compromised history
      # directly. v0.36.0 postdates the project's remediation.
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  coverage:
    name: coverage (ratchets upward)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain (rust-toolchain.toml)
        run: cargo --version
      # Not part of rust-toolchain.toml's components (that file is shared
      # with every dev machine; llvm-tools is only needed for coverage), so
      # add it to whichever toolchain the step above just activated.
      - name: add llvm-tools-preview
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: test with coverage
        run: |
          cargo llvm-cov nextest --workspace \
            --exclude sanvi-persistence --exclude sanvi-messaging --exclude sanvi-tenancy \
            --ignore-filename-regex 'apps/.*/src/main\.rs' \
            --fail-under-lines 70 \
            --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
