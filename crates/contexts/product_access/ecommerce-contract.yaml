      summary: Read one product of an active store, in any status.
      operationId: ecommerce_get_product
      parameters:
      - name: store_id
        in: path
        description: An active store of the caller's tenant (decimal Snowflake)
        required: true
        schema:
          type: string
      - name: product_id
        in: path
        description: A product of that store (decimal Snowflake)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductBody'
