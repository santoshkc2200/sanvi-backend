    post:
      tags:
      - product_access
      summary: Refund part or all of a payment.
      description: |-
        The money goes back the way the payment came. A manual payment's refund
        is recorded at once (201). A provider payment's refund is asked of the
        payment provider (202, a refund request); the refund is recorded when the
        provider confirms, and until then the money still stands paid. Retrying
        with the same `Idempotency-Key` and body returns what the first request
        did, with `Idempotency-Replayed: true`.
      operationId: ecommerce_refund_payment
      parameters:
      - name: store_id
        in: path
        description: An active store of the caller's tenant (decimal Snowflake)
        required: true
        schema:
          type: string
      - name: order_id
        in: path
        description: An order of that store (decimal Snowflake)
        required: true
        schema:
          type: string
      - name: payment_id
        in: path
        description: A payment of that order (decimal Snowflake)
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: 1 to 255 visible ASCII characters, unique per store
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentRequest'
        required: true
      responses:
        '201':
          description: Refunded (a manual payment), or replayed for a repeated key
          headers:
            Idempotency-Replayed:
              schema:
                type: string
              description: '`true` when replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBody'
        '202':
          description: Asked of the payment provider (a provider payment), or replayed for a repeated key
          headers:
            Idempotency-Replayed:
              schema:
                type: string
              description: '`true` when replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBody'
        '400':
          description: Invalid fields or a missing Idempotency-Key
          content:
