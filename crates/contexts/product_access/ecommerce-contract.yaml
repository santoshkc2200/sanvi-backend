  /api/v1/tenant/ecommerce/stores/{store_id}/products/{product_id}/update:
    post:
      tags:
      - product_access
      summary: Edit, archive or restore a product.
      description: |-
        The body replaces every editable field and names the `version` it was
        based on. An edit that changes nothing returns the product, so a retry of
        an applied edit succeeds.
      operationId: ecommerce_update_product
      parameters:
      - name: store_id
        in: path
        description: An active store of the caller's tenant (decimal Snowflake)
        required: true
        schema:
          type: string
      - name: product_id
        in: path
        description: A product of that store (decimal Snowflake)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
        required: true
      responses:
        '200':
          description: The product after the edit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductBody'
        '400':
          description: Invalid fields
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: |-
            Missing `ecommerce.product.manage` (the service's refusal), or the
            platform refused the request: the tenant lacks
            `products.ecommerce.enabled`, or the user holds no `ecommerce.*`
            permission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No active store, or no such product in it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: A newer version exists (`ecommerce/version-conflict`), a SKU is taken, or the edit changes imported fields without `acknowledge_import_overwrite` (`ecommerce/import-overwrite-warning`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: ecommerce-service rejected the platform's credentials or answered unusably
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: ecommerce-service is not configured or unreachable, or its database is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
