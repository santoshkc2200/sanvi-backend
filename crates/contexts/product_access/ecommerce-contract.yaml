# The ecommerce surface the platform's `/api/v1/tenant/ecommerce` proxy
# forwards to ecommerce-service, enumerated for contract publication.
#
# The runtime stays the frozen `{tail}` passthrough; this file exists so the
# merged OpenAPI document (and, from it, the frontend's generated types)
# carries typed request/response schemas for the routes the admin console
# uses — the accounting mirror precedent (phase 12). Schemas are copied from
# `ecommerce-service/api/openapi.yaml` v0.1.0 and must stay in step with it;
# paths are the service's `/v1/...` shapes under the platform prefix, with
# the service's problem documents passing through unchanged (the shared
# `ProblemDetail` shape here; extension members such as `current_version`
# travel but are not re-declared).
#
# Phase-13 surface: stores (incl. tax, archive, locations read), products
# with variants and prices, and read-only stock. Phase-15 adds the staff
# orders surface (list, read, cancel, guarded placement) and the tenant-level
# customers surface (records, addresses — add and archive only, no edit
# exists — export and erase). The ecommerce platform adoption (2026-11-04)
# adds the checkout quote, shipping methods, and the order's fulfillment,
# return, payment and refund recording, with the staff discount object.
# Reservations and hosted payment attempts stay un-mirrored (attempts are
# the public shopper surface; manual payments and refunds are mirrored).
# The proxy forwards GET and POST only; every update is a POST to
# `.../update`.
components:
  schemas:
    AddressBody:
      type: object
      description: A stored address. Erased addresses read with null fields.
      required:
      - id
      - customer_id
      - status
      - created_at
      properties:
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it was archived.
        city:
          type:
          - string
          - 'null'
          description: City.
          example: Shibuya-ku
        country:
          type:
          - string
          - 'null'
          description: ISO 3166-1 alpha-2 country code.
          example: JP
        created_at:
          type: string
          format: date-time
          description: Creation time.
        customer_id:
          type: string
          description: The customer it belongs to.
          example: '7401234567890120000'
        erased_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it was erased.
        id:
          type: string
          description: Address id (decimal Snowflake).
          example: '7401234567890120000'
        line1:
          type:
          - string
          - 'null'
          description: Street line.
          example: 1-2-3 Shibuya
        line2:
          type:
          - string
          - 'null'
          description: Second street line.
        phone:
          type:
          - string
          - 'null'
          description: Delivery contact in E.164 form.
        postal_code:
          type:
          - string
          - 'null'
          description: Postal code.
          example: 150-0002
        recipient:
          type:
          - string
          - 'null'
          description: Who receives the parcel.
          example: Aiko Tanaka
        region:
          type:
          - string
          - 'null'
          description: State, prefecture or province.
          example: Tokyo
        status:
          $ref: '#/components/schemas/AddressStatusBody'
          description: Lifecycle status.
    AddressPageBody:
      type: object
      description: One page of addresses, newest first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AddressBody'
          description: Addresses on this page.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page; absent on the last page.
    AddressStatusBody:
      type: string
      description: Address lifecycle status.
      enum:
      - active
      - archived
      - erased
    ArchiveAddressRequest:
      type: object
      description: An archive request has no fields; send `{}`.
      additionalProperties: false
    CancelOrderRequest:
      type: object
      description: A request to cancel an order.
      required:
      - version
      - reason
      properties:
        reason:
          type: string
          description: '`customer_request`, `out_of_stock`, `fraud_suspected` or `other`.'
          example: customer_request
        version:
          type: integer
          format: int64
          description: The version the caller read.
          example: 1
      additionalProperties: false
    CreateAddressRequest:
      type: object
      description: |-
        A new address. Addresses are never edited: to correct one, add the corrected
        address and archive the old one.
      properties:
        city:
          type:
          - string
          - 'null'
          description: City, 1 to 100 characters.
          example: Shibuya-ku
        country:
          type:
          - string
          - 'null'
          description: ISO 3166-1 alpha-2 country code.
          example: JP
        line1:
          type:
          - string
          - 'null'
          description: Street line, 1 to 200 characters.
          example: 1-2-3 Shibuya
        line2:
          type:
          - string
          - 'null'
          description: Second street line, 1 to 200 characters.
          example: Room 401
        phone:
          type:
          - string
          - 'null'
          description: Delivery contact in E.164 form.
          example: '+819012345678'
        postal_code:
          type:
          - string
          - 'null'
          description: Postal code, 1 to 20 characters; stored uppercased.
          example: 150-0002
        recipient:
          type:
          - string
          - 'null'
          description: Who receives the parcel, 1 to 120 characters.
          example: Aiko Tanaka
        region:
          type:
          - string
          - 'null'
          description: State, prefecture or province, 1 to 100 characters.
          example: Tokyo
      additionalProperties: false
    CreateCustomerRequest:
      type: object
      description: A new customer. At least one field is required.
      properties:
        email:
          type:
          - string
          - 'null'
          description: Email address, unique among the tenant's active customers ignoring case.
          example: aiko@example.jp
        name:
          type:
          - string
          - 'null'
          description: Display name, 1 to 120 characters.
          example: Aiko Tanaka
        phone:
          type:
          - string
          - 'null'
          description: Phone number in E.164 form.
          example: '+819012345678'
      additionalProperties: false
    CreateProductRequest:
      type: object
      description: A new product.
      required:
      - title
      - variants
      properties:
        description:
          type:
          - string
          - 'null'
          description: Long description, at most 10000 characters.
        status:
          type:
          - string
          - 'null'
          description: '`draft` (default) or `active`.'
          example: draft
        tax_class:
          type:
          - string
          - 'null'
          description: |-
            `standard` (default), `reduced` or `exempt`: the store rate orders
            charge on its sales.
          example: standard
        title:
          type: string
          description: Display title, 1 to 255 characters.
          example: Linen shirt
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantRequest'
          description: 1 to 100 variants sharing the store's currency and one set of option names.
      additionalProperties: false
    CreateStoreRequest:
      type: object
      description: A new store.
      required:
      - name
      - slug
      - currency
      - timezone
      properties:
        currency:
          type: string
          description: Upper-case ISO 4217 code every price in the store uses. Fixed once set.
          example: JPY
        name:
          type: string
          description: Display name, 1 to 120 characters.
          example: Tokyo flagship
        slug:
          type: string
          description: 3 to 63 lower-case letters, digits or hyphens, unique in the tenant.
          example: tokyo
        timezone:
          type: string
          description: IANA timezone name.
          example: Asia/Tokyo
      additionalProperties: false
    CustomerBody:
      type: object
      description: A stored customer. Erased customers read with null contact fields.
      required:
      - id
      - status
      - version
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
          description: Creation time.
        email:
          type:
          - string
          - 'null'
          description: Email address as given.
          example: aiko@example.jp
        erased_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the personal data was erased.
        id:
          type: string
          description: Customer id (decimal Snowflake).
          example: '7401234567890120000'
        name:
          type:
          - string
          - 'null'
          description: Display name.
          example: Aiko Tanaka
        phone:
          type:
          - string
          - 'null'
          description: Phone number in E.164 form.
          example: '+819012345678'
        status:
          $ref: '#/components/schemas/CustomerStatusBody'
          description: Lifecycle status.
        updated_at:
          type: string
          format: date-time
          description: Time of the last change, or the creation time.
        version:
          type: integer
          format: int64
          description: Starts at 1 and grows with every change; edits send the version they read.
          example: 1
    CustomerExportBody:
      type: object
      description: 'Everything held about a customer: the record, their addresses and a page

  of their orders.'
      required:
      - customer
      - addresses
      - orders
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressBody'
          description: 'Every address of the customer in every status, oldest first; the

  same on every page.'
        customer:
          $ref: '#/components/schemas/CustomerBody'
          description: The customer.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page of orders; absent on the last page.
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderBody'
          description: 'Their orders in every store of the tenant, archived stores included,

  oldest first.'
    CustomerPageBody:
      type: object
      description: One page of customers, newest first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerBody'
          description: Customers on this page.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page; absent on the last page.
    CustomerStatusBody:
      type: string
      description: Customer lifecycle status.
      enum:
      - active
      - erased
    DiscountRequest:
      type: object
      description: |-
        A staff-approved fixed merchandise discount. Quoting or placing with it
        requires the `ecommerce.order.discount` permission on the acting identity.
      required:
      - amount_minor
      - reason
      properties:
        amount_minor:
          type: integer
          format: int64
          description: |-
            1 to 999999999999999 minor units, and no more than the reservation's
            locked merchandise subtotal. Zero is not a discount: leave the object
            out for none.
          example: 150
        reason:
          type: string
          description: '`promotion`, `goodwill`, `price_match` or `other`.'
          example: promotion
      additionalProperties: false
    EraseCustomerRequest:
      type: object
      description: An erasure request has no fields; send `{}`.
      additionalProperties: false
    FulfillmentBody:
      type: object
      description: |-
        Goods recorded as handed over for an order. Immutable: a mistaken
        handover needs a returns workflow, not an edit.
      required:
      - id
      - store_id
      - order_id
      - method
      - lines
      - recorded_at
      properties:
        id:
          type: string
          description: Fulfillment identifier.
          example: '7401234567890120000'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentLineBody'
          description: Lines in position order.
        method:
          type: string
          description: How the goods left.
          example: pickup
        order_id:
          type: string
          description: The order fulfilled.
          example: '7401234567890120000'
        recorded_at:
          type: string
          format: date-time
          description: When the handover was recorded.
        store_id:
          type: string
          description: Store identifier.
          example: '7401234567890120000'
    FulfillmentLineBody:
      type: object
      description: One line of a fulfillment.
      required:
      - line_position
      - quantity
      properties:
        line_position:
          type: integer
          format: int32
          description: Zero-based position of the order line.
          example: 0
        quantity:
          type: integer
          format: int64
          description: Units handed over.
          example: 2
    FulfillmentLineRequest:
      type: object
      description: One line of a handover.
      required:
      - line_position
      - quantity
      properties:
        line_position:
          type: integer
          format: int32
          description: Zero-based position of the order line, as the API returns it.
          example: 0
        quantity:
          type: integer
          format: int64
          description: Units handed over, 1 to 10000.
          example: 2
      additionalProperties: false
    FulfillmentPageBody:
      type: object
      description: One page of an order's fulfillments, newest first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentBody'
          description: Fulfillments on this page.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page; absent on the last page.
    LocationBody:
      type: object
      description: A stored stock location.
      required:
      - id
      - store_id
      - name
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
          description: Creation time.
        id:
          type: string
          description: Location identifier (decimal Snowflake).
          example: '7401234567890120000'
        name:
          type: string
          description: Display name.
        store_id:
          type: string
          description: Store identifier.
          example: '7401234567890120000'
    LocationPageBody:
      type: object
      description: One page of locations.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LocationBody'
          description: Locations on this page.
        next_after:
          type:
          - string
          - 'null'
          description: Cursor for the next page.
    MoneyBody:
      type: object
      description: An amount in minor units with its currency.
      required:
      - amount_minor
      - currency
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Non-negative amount in the currency's minor unit.
          example: 4500
        currency:
          type: string
          description: Upper-case ISO 4217 code.
          example: JPY
      additionalProperties: false
    OrderBody:
      type: object
      description: A stored order.
      required:
      - id
      - store_id
      - reservation_id
      - status
      - channel
      - currency
      - subtotal_minor
      - shipping_minor
      - discount_minor
      - tax_minor
      - total_minor
      - tax_mode
      - tax_lines
      - lines
      - placed_at
      - payment
      - fulfillment
      - returns
      - version
      - updated_at
      properties:
        billing_address_id:
          type:
          - string
          - 'null'
          description: The customer's address it bills to; null when none was named.
          example: '7401234567890120000'
        cancel_reason:
          type:
          - string
          - 'null'
          description: Why it was cancelled.
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Cancellation time.
        channel:
          type: string
          description: '`web` or `pos`.'
          example: pos
        currency:
          type: string
          description: The store currency.
          example: JPY
        customer_id:
          type:
          - string
          - 'null'
          description: The customer who bought it; null for an anonymous sale.
          example: '7401234567890120000'
        discount_minor:
          type: integer
          format: int64
          description: 'Fixed merchandise discount fixed at placement; 0 when none was

  granted.'
          example: 150
        discount_reason:
          type:
          - string
          - 'null'
          description: |-
            Why the discount was granted: `promotion`, `goodwill`, `price_match` or
            `other`; null when none was granted.
          example: promotion
        fulfillment:
          $ref: '#/components/schemas/OrderFulfillmentBody'
          description: |-
            Where the order stands with its goods, from its fulfillments. Fulfillments
            do not change the order's `version`.
        id:
          type: string
          description: Order identifier.
          example: '7401234567890120000'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineBody'
          description: Sold lines with their prices at placement.
        payment:
          $ref: '#/components/schemas/OrderPaymentBody'
          description: Where the order stands with its money, from its payments and refunds.
        placed_at:
          type: string
          format: date-time
          description: Placement time.
        reservation_id:
          type: string
          description: The reservation it committed.
          example: '7401234567890120000'
        returns:
          $ref: '#/components/schemas/OrderReturnsBody'
          description: |-
            Where the order stands with its returned goods, from its fulfillments and
            returns. Returns do not change the order's `version` either.
        shipping:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/OrderShippingBody'
            description: Selected shipping service snapshotted at placement; null when no method was selected.
        shipping_address_id:
          type:
          - string
          - 'null'
          description: |-
            The customer's address it ships to; null when none was named. Read it
            through the customer's address routes.
          example: '7401234567890120000'
        shipping_minor:
          type: integer
          format: int64
          description: Flat shipping charge, or 0 when no method was selected.
          example: 500
        status:
          type: string
          description: '`placed` or `cancelled`.'
          example: placed
        store_id:
          type: string
          description: Store identifier.
          example: '7401234567890120000'
        subtotal_minor:
          type: integer
          format: int64
          description: Sum of line totals, in minor units.
          example: 3600
        tax_destination:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TaxDestinationBody'
            description: |-
              Where it was taxed; null when `tax_mode` is `none`. Kept after the
              customer's erasure as a tax record.
        tax_lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderTaxLineBody'
          description: |-
            Tax owed per class, `standard`, then `reduced`, then `exempt`; empty when
            `tax_mode` is `none`.
        tax_minor:
          type: integer
          format: int64
          description: |-
            Tax owed, in minor units: added to the net subtotal when `tax_mode` is
            `exclusive`, already inside it when `inclusive`, 0 when `none`.
          example: 266
        tax_mode:
          type: string
          description: '`none`, `exclusive` or `inclusive`: the store''s setting at placement.'
          example: inclusive
        tax_rounding:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RoundingBody'
            description: The store's rounding rule at placement; null when `tax_mode` is `none`.
        terminal_ref:
          type:
          - string
          - 'null'
          description: Opaque terminal reference, POS only.
        total_minor:
          type: integer
          format: int64
          description: |-
            Amount due: the subtotal, less `discount_minor`, plus `shipping_minor`, plus
            `tax_minor` when `tax_mode` is `exclusive`.
          example: 3600
        updated_at:
          type: string
          format: date-time
          description: Time of the last change.
        version:
          type: integer
          format: int64
          description: Starts at 1; name it when cancelling. Payments do not change it.
    OrderFulfillmentBody:
      type: object
      description: An order's fulfillment status, as `OrderBody` carries it.
      required:
      - status
      - lines
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderFulfillmentLineBody'
          description: Progress per order line, in position order.
        status:
          type: string
          description: |-
            `unfulfilled`, `partially_fulfilled`, `fulfilled`, or `not_required` (a
            cancelled order nothing was handed over for).
          example: partially_fulfilled
    OrderFulfillmentLineBody:
      type: object
      description: One order line's fulfillment progress.
      required:
      - line_position
      - fulfilled_quantity
      - remaining_quantity
      properties:
        fulfilled_quantity:
          type: integer
          format: int64
          description: Units handed over so far.
          example: 2
        line_position:
          type: integer
          format: int32
          description: Zero-based position of the order line.
          example: 0
        remaining_quantity:
          type: integer
          format: int64
          description: Units still to hand over; 0 once the order is cancelled.
          example: 1
    OrderLineBody:
      type: object
      description: One sold line, as the catalog read at placement.
      required:
      - position
      - product_id
      - variant_id
      - location_id
      - product_title
      - options
      - unit_price_minor
      - quantity
      - line_total_minor
      - discount_minor
      - net_line_total_minor
      properties:
        discount_minor:
          type: integer
          format: int64
          description: The fixed discount allocated to this line; 0 when none was granted.
          example: 100
        line_total_minor:
          type: integer
          format: int64
          description: |-
            `unit_price_minor × quantity`, the gross merchandise amount before any
            discount and before exclusive tax.
        location_id:
          type: string
          description: Location the stock left.
          example: '7401234567890120000'
        net_line_total_minor:
          type: integer
          format: int64
          description: '`line_total_minor - discount_minor`, the amount tax was charged on.'
          example: 3500
        options:
          type: object
          description: Options at placement.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        position:
          type: integer
          format: int32
          description: 'Zero-based position of the line in the order: name it when

  fulfilling part of the order.'
          example: 0
        product_id:
          type: string
          description: Product sold.
          example: '7401234567890120000'
        product_title:
          type: string
          description: Product title at placement.
        quantity:
          type: integer
          format: int64
          description: Units sold.
        sku:
          type:
          - string
          - 'null'
          description: SKU at placement.
        tax_class:
          type:
          - string
          - 'null'
          description: The product's tax class at placement; null when the store charged no tax.
          example: reduced
        tax_rate_ppm:
          type:
          - integer
          - 'null'
          format: int32
          description: The class's rate in parts per million; null when the store charged no tax.
          example: 80000
        unit_price_minor:
          type: integer
          format: int64
          description: Unit price at placement, in minor units.
        variant_id:
          type: string
          description: Variant sold.
          example: '7401234567890120000'
    OrderPageBody:
      type: object
      description: One page of orders, newest first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderBody'
          description: Orders on this page.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page; absent on the last page.
    OrderPaymentBody:
      type: object
      description: An order's payment state.
      required:
      - status
      - paid_minor
      - refunded_minor
      - due_minor
      - pending_minor
      - pending_refund_minor
      - overpaid_minor
      properties:
        due_minor:
          type: integer
          format: int64
          description: 'Still owed: `total_minor` less payments net of refunds; 0 once the

  order is cancelled.'
          example: 0
        overpaid_minor:
          type: integer
          format: int64
          description: |-
            Paid beyond the total; only an online payment that arrived late can cause
            it, and it is refunded automatically.
          example: 0
        paid_minor:
          type: integer
          format: int64
          description: Sum of payments, in minor units.
          example: 1800
        pending_minor:
          type: integer
          format: int64
          description: 'Of what is due, what a pending online payment attempt holds: no

  other payment may take it.'
          example: 0
        pending_refund_minor:
          type: integer
          format: int64
          description: |-
            Money on its way back through the payment provider; it still stands paid
            until the provider confirms.
          example: 0
        refunded_minor:
          type: integer
          format: int64
          description: Sum of refunds, in minor units.
          example: 0
        status:
          type: string
          description: |-
            `unpaid`, `partially_paid`, `paid` (the whole total stands paid, or nothing
            is owed), `partially_refunded` or `refunded` (every payment returned in
            full).
          example: paid
    OrderReturnLineBody:
      type: object
      description: One order line's return progress.
      required:
      - line_position
      - returned_quantity
      - restocked_quantity
      - returnable_quantity
      properties:
        line_position:
          type: integer
          format: int32
          description: Zero-based position of the order line.
          example: 0
        restocked_quantity:
          type: integer
          format: int64
          description: Units of them back in saleable stock.
          example: 1
        returnable_quantity:
          type: integer
          format: int64
          description: 'Units still returnable: handed over but not yet returned; 0 once

  the order is cancelled.'
          example: 1
        returned_quantity:
          type: integer
          format: int64
          description: Units received back so far.
          example: 2
    OrderReturnsBody:
      type: object
      description: An order's return summary, as `OrderBody` carries it.
      required:
      - lines
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderReturnLineBody'
          description: Progress per order line, in position order.
    OrderShippingBody:
      type: object
      description: A selected shipping method snapshotted on an order or quote.
      required:
      - method_id
      - name
      properties:
        method_id:
          type: string
          description: Selected method id.
          example: '7401234567890120000'
        name:
          type: string
          description: Display name at quote or placement.
        tax_class:
          type:
          - string
          - 'null'
          description: The method's tax class; null in untaxed mode.
          example: standard
        tax_rate_ppm:
          type:
          - integer
          - 'null'
          format: int32
          description: The class's rate in parts per million; null in untaxed mode.
          example: 100000
    OrderTaxLineBody:
      type: object
      description: The tax an order owes on one class.
      required:
      - tax_class
      - rate_ppm
      - amount_minor
      - tax_minor
      properties:
        amount_minor:
          type: integer
          format: int64
          description: |-
            The class's line totals as priced, including any selected shipping charge in
            its class, tax included when `tax_mode` is `inclusive`.
          example: 3600
        rate_ppm:
          type: integer
          format: int32
          description: The rate in parts per million.
          example: 80000
        tax_class:
          type: string
          description: '`standard`, `reduced` or `exempt`.'
          example: reduced
        tax_minor:
          type: integer
          format: int64
          description: Tax owed on them.
          example: 266
    PaymentBody:
      type: object
      description: A recorded payment with the refunds taken from it.
      required:
      - id
      - order_id
      - method
      - source
      - amount_minor
      - currency
      - recorded_at
      - refunds
      - refundable_minor
      - pending_refund_minor
      - refund_requests
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Amount received, in minor units.
          example: 1800
        attempt_id:
          type:
          - string
          - 'null'
          description: The payment attempt a provider payment settled; null for manual ones.
          example: null
        currency:
          type: string
          description: The order's currency.
          example: JPY
        external_ref:
          type:
          - string
          - 'null'
          description: The reference given when it was recorded; null when none was.
          example: APPROVAL-123456
        id:
          type: string
          description: Payment identifier.
          example: '7401234567890120000'
        method:
          type: string
          description: How it was taken.
          example: cash
        order_id:
          type: string
          description: The order paid for.
          example: '7401234567890120000'
        pending_refund_minor:
          type: integer
          format: int64
          description: Of it, what is on its way back through the provider.
          example: 0
        recorded_at:
          type: string
          format: date-time
          description: When it was recorded.
        refund_requests:
          type: array
          items:
            $ref: '#/components/schemas/RefundRequestBody'
          description: |-
            Refunds asked of the provider for a provider payment, in any status;
            a succeeded one is also in `refunds`.
        refundable_minor:
          type: integer
          format: int64
          description: |-
            What may still be refunded from it, in minor units: its amount less
            its refunds and pending refund requests.
          example: 1800
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/RefundBody'
          description: Refunds taken from it, oldest first.
        source:
          type: string
          description: |-
            `manual` (a person recorded it) or `provider` (the payment provider
            reported it; method `online`).
          example: manual
    PaymentListBody:
      type: object
      description: |-
        Every payment of an order, oldest first. An order has at most 100, so
        the list is never paged.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentBody'
          description: The payments, each with its refunds.
    PlaceOrderRequest:
      type: object
      description: |-
        A request to turn a held reservation into an order. Lines and prices come
        from the reservation and the catalog, never from the client.
      required:
      - reservation_id
      - channel
      properties:
        billing_address_id:
          type:
          - string
          - 'null'
          description: An active address of that customer to bill to; needs `customer_id`.
          example: '7401234567890120000'
        channel:
          type: string
          description: '`web` or `pos`.'
          example: pos
        customer_id:
          type:
          - string
          - 'null'
          description: |-
            An active customer of the tenant buying; leave out for an anonymous
            sale. Only the id is kept with the order.
          example: '7401234567890120000'
        discount:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DiscountRequest'
            description: |-
              Staff-approved fixed merchandise discount to allocate across the
              reservation's lines before tax. Requires the
              `ecommerce.order.discount` permission. Leave out or send null for
              none; it never reduces shipping.
        expected_pricing_fingerprint:
          type:
          - string
          - 'null'
          description: |-
            The `pricing_fingerprint` a quote returned for the same reservation
            and customer/address context. Leave it out or send null to place at
            current prices with no precondition, as before.
          example: v1:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        reservation_id:
          type: string
          description: A held, unexpired reservation of the store.
          example: '7401234567890120000'
        shipping_address_id:
          type:
          - string
          - 'null'
          description: |-
            An active address of that customer to ship to; needs `customer_id`.
            Only the id is kept with the order.
          example: '7401234567890120000'
        shipping_method_id:
          type:
          - string
          - 'null'
          description: |-
            An active shipping method of the store. Requires `customer_id` and
            `shipping_address_id`. Leave out or send null to place with no shipping.
          example: '7401234567890120000'
        terminal_ref:
          type:
          - string
          - 'null'
          description: Opaque terminal reference, 1 to 64 characters; `pos` only.
          example: till-1
      additionalProperties: false
    ProductBody:
      type: object
      description: A stored product.
      required:
      - id
      - store_id
      - title
      - status
      - tax_class
      - variants
      - created_at
      - version
      - updated_at
      - import_overrides
      properties:
        created_at:
          type: string
          format: date-time
          description: Creation time.
        description:
          type:
          - string
          - 'null'
          description: Long description.
        id:
          type: string
          description: Product id (decimal Snowflake).
          example: '7401234567890123456'
        import_overrides:
          type: array
          items:
            type: string
          description: |-
            Field paths a merchant changed that the next connector re-import will
            replace. Empty for first-party products.
        status:
          $ref: '#/components/schemas/ProductStatusBody'
          description: Lifecycle status.
        store_id:
          type: string
          description: Store id (decimal Snowflake).
          example: '7401234567890120000'
        tax_class:
          type: string
          description: '`standard`, `reduced` or `exempt`.'
          example: standard
        title:
          type: string
          description: Display title.
        updated_at:
          type: string
          format: date-time
          description: Time of the last change, or the creation time.
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantBody'
          description: Variants in display order.
        version:
          type: integer
          format: int64
          description: Starts at 1 and grows with every change; edits send the version they read.
          example: 1
    ProductPageBody:
      type: object
      description: One page of products, newest first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductBody'
          description: Products on this page.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page; absent on the last page.
    ProductStatusBody:
      type: string
      description: Product lifecycle status.
      enum:
      - draft
      - active
      - archived
    QuoteBody:
      type: object
      description: |-
        What placing a held reservation would cost right now. A current
        observation of live data: requote for fresh terms.
      required:
      - store_id
      - reservation_id
      - expires_at
      - currency
      - lines
      - subtotal_minor
      - shipping_minor
      - discount_minor
      - tax_minor
      - total_minor
      - tax_mode
      - tax_lines
      - pricing_fingerprint
      properties:
        currency:
          type: string
          description: The store currency.
          example: JPY
        discount_minor:
          type: integer
          format: int64
          description: |-
            Fixed merchandise discount the quote prices; 0 when none was
            requested.
          example: 150
        discount_reason:
          type:
          - string
          - 'null'
          description: |-
            Why the discount was granted: `promotion`, `goodwill`, `price_match`
            or `other`; null when none was requested.
          example: promotion
        expires_at:
          type: string
          format: date-time
          description: The hold's deadline; the quote's only limit.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineBody'
          description: The sale's lines with their current prices.
        pricing_fingerprint:
          type: string
          description: |-
            Send back as `expected_pricing_fingerprint` to place the order on
            exactly these terms.
          example: v1:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        reservation_id:
          type: string
          description: The priced hold.
          example: '7401234567890120000'
        shipping:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/OrderShippingBody'
            description: Selected shipping service snapshotted at quote; null when no method was selected.
        shipping_minor:
          type: integer
          format: int64
          description: Flat shipping charge, or 0 when no method was selected.
          example: 500
        store_id:
          type: string
          description: Store that would sell.
          example: '7401234567890120000'
        subtotal_minor:
          type: integer
          format: int64
          description: Sum of line totals, in minor units.
          example: 3600
        tax_destination:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TaxDestinationBody'
            description: Where the sale would be taxed; null when `tax_mode` is `none`.
        tax_lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderTaxLineBody'
          description: |-
            Tax owed per class, `standard`, then `reduced`, then `exempt`; empty
            when `tax_mode` is `none`.
        tax_minor:
          type: integer
          format: int64
          description: Tax owed, in minor units.
          example: 266
        tax_mode:
          type: string
          description: '`none`, `exclusive` or `inclusive`: the store''s current setting.'
          example: inclusive
        tax_rounding:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RoundingBody'
            description: The store's current rounding rule; null when `tax_mode` is `none`.
        total_minor:
          type: integer
          format: int64
          description: |-
            Amount due: the subtotal, less `discount_minor`, plus `shipping_minor`,
            plus `tax_minor` when `tax_mode` is `exclusive`.
          example: 3600
    QuoteOrderRequest:
      type: object
      description: |-
        A request to price a held reservation as placing it would. Lines and
        prices come from the reservation and the catalog, never from the client;
        channel and terminal metadata change no price and are not accepted.
      required:
      - reservation_id
      properties:
        billing_address_id:
          type:
          - string
          - 'null'
          description: |-
            An active address of that customer to bill to, used only when
            nothing is shipped; needs `customer_id`.
          example: '7401234567890120000'
        customer_id:
          type:
          - string
          - 'null'
          description: |-
            An active customer of the tenant buying; leave out for an anonymous
            sale. A quote writes nothing; only the prices depend on this.
          example: '7401234567890120000'
        discount:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DiscountRequest'
            description: |-
              Staff-approved fixed merchandise discount to allocate across the
              reservation's lines before tax. Requires the
              `ecommerce.order.discount` permission. Leave out or send null for
              none; it never reduces shipping.
        reservation_id:
          type: string
          description: A held, unexpired reservation of the store.
          example: '7401234567890120000'
        shipping_address_id:
          type:
          - string
          - 'null'
          description: An active address of that customer to ship to; needs `customer_id`.
          example: '7401234567890120000'
        shipping_method_id:
          type:
          - string
          - 'null'
          description: |-
            An active shipping method of the store. Requires `customer_id` and
            `shipping_address_id`. Leave out or send null to quote with no shipping.
          example: '7401234567890120000'
      additionalProperties: false
    RecordFulfillmentRequest:
      type: object
      description: |-
        A request to record goods handed over for an order. Quantities name
        order-line positions the API returned; nothing else about the lines is
        taken from the client.
      required:
      - method
      - lines
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentLineRequest'
          description: |-
            Lines handed over: at least one, at most one per order line, each
            within what that line still owes.
        method:
          type: string
          description: |-
            `shipping` (handed to a carrier; not confirmed delivery) or `pickup`
            (collected by the buyer, including at a POS counter).
          example: pickup
      additionalProperties: false
    RecordPaymentRequest:
      type: object
      description: Money received for an order. The currency is always the order's.
      required:
      - method
      - amount_minor
      properties:
        amount_minor:
          type: integer
          format: int64
          description: |-
            Amount received, in minor units of the order's currency; at most what
            the order still owes.
          example: 1800
        external_ref:
          type:
          - string
          - 'null'
          description: |-
            Opaque reference, 1 to 64 characters: a terminal's approval code or a
            bank reference. Not for card numbers or other personal data.
          example: APPROVAL-123456
        method:
          type: string
          description: |-
            `cash`, `card_terminal` (a standalone card machine), `bank_transfer`
            or `other`.
          example: cash
      additionalProperties: false
    RecordReturnRequest:
      type: object
      description: |-
        A request to record goods received back for an order. Quantities name
        order-line positions the API returned; nothing else about the lines is
        taken from the client.
      required:
      - reason
      - lines
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReturnLineRequest'
          description: |-
            Lines received back: at least one, at most one per order line, each
            within what that line still has returnable.
        reason:
          type: string
          description: '`customer_request`, `damaged`, `incorrect_item` or `other`.'
          example: customer_request
      additionalProperties: false
    RefundBody:
      type: object
      description: Money returned from a payment, the way it was taken.
      required:
      - id
      - payment_id
      - order_id
      - amount_minor
      - currency
      - reason
      - recorded_at
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Amount returned, in minor units.
          example: 500
        currency:
          type: string
          description: The order's currency.
          example: JPY
        id:
          type: string
          description: Refund identifier.
          example: '7401234567890120000'
        order_id:
          type: string
          description: The order the payment was for.
          example: '7401234567890120000'
        payment_id:
          type: string
          description: The payment refunded.
          example: '7401234567890120000'
        reason:
          type: string
          description: |-
            `customer_request`, `returned_goods`, `order_cancelled`, `duplicate`,
            `fraud` or `other`.
          example: order_cancelled
        recorded_at:
          type: string
          format: date-time
          description: When it was recorded.
    RefundPaymentRequest:
      type: object
      description: Money returned from one payment, the way it was taken.
      required:
      - amount_minor
      - reason
      properties:
        amount_minor:
          type: integer
          format: int64
          description: |-
            Amount returned, in minor units of the order's currency; at most what
            is left of the payment.
          example: 1800
        reason:
          type: string
          description: |-
            `customer_request`, `returned_goods`, `order_cancelled`, `duplicate`,
            `fraud` or `other`.
          example: order_cancelled
      additionalProperties: false
    RefundRequestBody:
      type: object
      description: |-
        A refund of a provider payment asked of the provider. The money stands
        paid until the provider confirms; then a refund records it.
      required:
      - id
      - payment_id
      - order_id
      - amount_minor
      - currency
      - reason
      - status
      - created_at
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Amount asked back, in minor units.
          example: 500
        created_at:
          type: string
          format: date-time
          description: When it was asked.
        currency:
          type: string
          description: The order's currency.
          example: JPY
        failure_code:
          type:
          - string
          - 'null'
          description: Why the provider refused it, when it did.
          example: null
        id:
          type: string
          description: Request identifier.
          example: '7401234567890120000'
        order_id:
          type: string
          description: The order the payment was for.
          example: '7401234567890120000'
        payment_id:
          type: string
          description: The payment refunded.
          example: '7401234567890120000'
        reason:
          type: string
          description: Why.
          example: customer_request
        settled_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the provider settled it.
        status:
          type: string
          description: '`pending`, `succeeded` or `failed`.'
          example: pending
    ReturnBody:
      type: object
      description: |-
        Goods recorded as received back for an order. Immutable: what arrived
        is a fact; correcting a restock needs a manual stock adjustment, not an
        edit of the receipt.
      required:
      - id
      - store_id
      - order_id
      - reason
      - lines
      - recorded_at
      properties:
        id:
          type: string
          description: Return identifier.
          example: '7401234567890120000'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReturnLineBody'
          description: Lines in position order.
        order_id:
          type: string
          description: The order the goods came back for.
          example: '7401234567890120000'
        reason:
          type: string
          description: Why they came back.
          example: customer_request
        recorded_at:
          type: string
          format: date-time
          description: When the receipt was recorded.
        store_id:
          type: string
          description: Store identifier.
          example: '7401234567890120000'
    ReturnLineBody:
      type: object
      description: One line of a return.
      required:
      - line_position
      - quantity
      - restock_quantity
      properties:
        line_position:
          type: integer
          format: int32
          description: Zero-based position of the order line.
          example: 0
        quantity:
          type: integer
          format: int64
          description: Units received back.
          example: 2
        restock_location_id:
          type:
          - string
          - 'null'
          description: Where the restocked units landed; absent when nothing was restocked.
          example: '7401234567890120000'
        restock_quantity:
          type: integer
          format: int64
          description: Units of them back in saleable stock.
          example: 1
    ReturnLineRequest:
      type: object
      description: One line of a receipt.
      required:
      - line_position
      - quantity
      - restock_quantity
      properties:
        line_position:
          type: integer
          format: int32
          description: Zero-based position of the order line, as the API returns it.
          example: 0
        quantity:
          type: integer
          format: int64
          description: Units received back, 1 to 10000.
          example: 2
        restock_location_id:
          type:
          - string
          - 'null'
          description: |-
            Where the restocked units land: any stock location of the store,
            not only the line's original one. Required when and only when
            `restock_quantity` is positive.
          example: '7401234567890120000'
        restock_quantity:
          type: integer
          format: int64
          description: Units of them that go back into saleable stock, 0 to `quantity`.
          example: 1
      additionalProperties: false
    ReturnPageBody:
      type: object
      description: One page of an order's returns, newest first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReturnBody'
          description: Returns on this page.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page; absent on the last page.
    RoundingBody:
      type: object
      description: How tax is rounded.
      required:
      - level
      - mode
      properties:
        level:
          type: string
          description: '`line` rounds each line''s tax; `order` rounds once per tax class.'
          example: order
        mode:
          type: string
          description: '`half_up` or `down`.'
          example: down
      additionalProperties: false
    SetStoreTaxRequest:
      type: object
      description: A store's tax settings, replacing the stored ones.
      required:
      - version
      - mode
      properties:
        mode:
          type: string
          description: |-
            `none`, `exclusive` (tax added on top of prices) or `inclusive`
            (prices contain the tax).
          example: inclusive
        rates_ppm:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TaxRatesBody'
            description: Required unless `mode` is `none`, and refused when it is.
        rounding:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RoundingBody'
            description: Required unless `mode` is `none`, and refused when it is.
        version:
          type: integer
          format: int64
          description: The `version` the change is based on, as last read.
          example: 1
      additionalProperties: false
    ShippingMethodBody:
      type: object
      description: A stored shipping method.
      required:
      - id
      - store_id
      - name
      - currency
      - amount_minor
      - tax_class
      - status
      - version
      - created_at
      - updated_at
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Flat charge in minor units.
          example: 500
        created_at:
          type: string
          format: date-time
          description: Creation time.
        currency:
          type: string
          description: Store's currency.
          example: USD
        id:
          type: string
          description: Shipping method id (decimal Snowflake).
          example: '7401234567890120000'
        name:
          type: string
          description: Display name.
          example: Standard delivery
        status:
          $ref: '#/components/schemas/ShippingMethodStatusBody'
          description: Lifecycle status.
        store_id:
          type: string
          description: Store id.
          example: '7401234567890120001'
        tax_class:
          type: string
          description: Tax class for rate application.
          example: standard
        updated_at:
          type: string
          format: date-time
          description: Time of the last change, or the creation time.
        version:
          type: integer
          format: int64
          description: Starts at 1 and grows with every change.
          example: 1
    ShippingMethodPageBody:
      type: object
      description: One page of shipping methods, newest first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShippingMethodBody'
          description: Methods on this page.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page; absent on the last page.
    ShippingMethodStatusBody:
      type: string
      description: Shipping method lifecycle status.
      enum:
      - active
      - archived
    StockLevelBody:
      type: object
      description: Stock level for a variant at a location.
      required:
      - location_id
      - variant_id
      - on_hand
      - safety_stock
      - held
      - available
      properties:
        available:
          type: integer
          format: int64
          description: Available stock.
        held:
          type: integer
          format: int64
          description: Quantity held by active reservations.
        location_id:
          type: string
          description: Location id.
        on_hand:
          type: integer
          format: int64
          description: On-hand balance.
        safety_stock:
          type: integer
          format: int64
          description: Safety buffer.
        variant_id:
          type: string
          description: Variant id.
    StockPageBody:
      type: object
      description: One page of stock levels.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StockLevelBody'
          description: Stock levels on this page.
        next_after:
          type:
          - string
          - 'null'
          description: Cursor for the next page.
    StoreBody:
      type: object
      description: A stored store.
      required:
      - id
      - name
      - slug
      - currency
      - timezone
      - status
      - tax
      - created_at
      - version
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
          description: Creation time.
        currency:
          type: string
          description: Currency of every price in the store.
        id:
          type: string
          description: Store id (decimal Snowflake).
          example: '7401234567890120000'
        name:
          type: string
          description: Display name.
        slug:
          type: string
          description: URL-safe handle, unique in the tenant.
        status:
          $ref: '#/components/schemas/StoreStatusBody'
          description: Lifecycle status.
        tax:
          $ref: '#/components/schemas/StoreTaxBody'
          description: Tax settings orders are placed under.
        timezone:
          type: string
          description: IANA timezone name.
        updated_at:
          type: string
          format: date-time
          description: Time of the last change, or the creation time.
        version:
          type: integer
          format: int64
          description: Starts at 1 and grows with every change; edits send the version they read.
          example: 1
    StorePageBody:
      type: object
      description: One page of stores, newest first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoreBody'
          description: Stores on this page.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` for the next page; absent on the last page.
    StoreStatusBody:
      type: string
      description: Store lifecycle status.
      enum:
      - active
      - archived
    StoreTaxBody:
      type: object
      description: A store's tax settings.
      required:
      - mode
      properties:
        mode:
          type: string
          description: '`none`, `exclusive` or `inclusive`.'
          example: inclusive
        rates_ppm:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TaxRatesBody'
            description: Absent when `mode` is `none`.
        rounding:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RoundingBody'
            description: Absent when `mode` is `none`.
    StoreVersionRequest:
      type: object
      description: The version an archive or restore is based on.
      required:
      - version
      properties:
        version:
          type: integer
          format: int64
          description: The `version` as last read.
          example: 1
      additionalProperties: false
    TaxDestinationBody:
      type: object
      description: Where an order was taxed.
      required:
      - zone
      properties:
        country:
          type:
          - string
          - 'null'
          description: The destination country; null when the order named no address.
          example: US
        region:
          type:
          - string
          - 'null'
          description: |-
            The region of the zone that decided the rates, as the store names it (never
            the address's own text); null unless a regional zone matched.
          example: CA
        source:
          type:
          - string
          - 'null'
          description: |-
            `shipping` or `billing`: the address whose place decided the rates; null
            when the order named none.
          example: shipping
        zone:
          type: string
          description: |-
            `zone` (a zone covered the destination), `outside` (none did; the store's
            `outside_zones` rule applied) or `store` (no address; the store's own rates
            applied).
          example: zone
    TaxRatesBody:
      type: object
      description: Tax rates in parts per million (10% is `100000`); `exempt` is always 0.
      required:
      - standard
      - reduced
      properties:
        reduced:
          type: integer
          format: int64
          description: |-
            Rate of the `reduced` class, 0 to 500000; the standard rate when the
            store has no reduced rate.
          example: 80000
        standard:
          type: integer
          format: int64
          description: Rate of the `standard` class, 0 to 500000.
          example: 100000
      additionalProperties: false
    UpdateCustomerRequest:
      type: object
      description: |-
        New contact fields for a customer. They replace all three stored ones: a
        field left out or null is cleared. At least one is required.
      required:
      - version
      properties:
        email:
          type:
          - string
          - 'null'
          description: Email address, unique among the tenant's active customers ignoring case.
          example: aiko@example.jp
        name:
          type:
          - string
          - 'null'
          description: Display name, 1 to 120 characters.
          example: Aiko Tanaka
        phone:
          type:
          - string
          - 'null'
          description: Phone number in E.164 form.
          example: '+819012345678'
        version:
          type: integer
          format: int64
          description: The `version` the edit is based on, as last read.
          example: 1
      additionalProperties: false
    UpdateProductRequest:
      type: object
      description: A full replacement of a product's editable fields.
      required:
      - version
      - title
      - status
      - variants
      properties:
        acknowledge_import_overwrite:
          type: boolean
          description: |-
            Apply changes to fields a connector re-import will replace. Without it,
            such an edit is refused with `ecommerce/import-overwrite-warning`.
        description:
          type:
          - string
          - 'null'
          description: Long description; leaving it out clears it.
        status:
          type: string
          description: '`draft`, `active` or `archived`.'
          example: active
        tax_class:
          type:
          - string
          - 'null'
          description: '`standard`, `reduced` or `exempt`; leaving it out keeps the current class.'
          example: reduced
        title:
          type: string
          description: Display title, 1 to 255 characters.
        variants:
          type: array
          items:
            $ref: '#/components/schemas/UpdateVariantRequest'
          description: Every existing variant by `id`, plus new ones without an `id`.
        version:
          type: integer
          format: int64
          description: The `version` the edit is based on, as last read.
          example: 1
      additionalProperties: false
    UpdateStoreRequest:
      type: object
      description: New values for a store's editable fields. The slug and currency are fixed.
      required:
      - version
      - name
      - timezone
      properties:
        name:
          type: string
          description: Display name, 1 to 120 characters.
          example: Tokyo flagship
        timezone:
          type: string
          description: IANA timezone name.
          example: Asia/Tokyo
        version:
          type: integer
          format: int64
          description: The `version` the edit is based on, as last read.
          example: 1
      additionalProperties: false
    UpdateVariantRequest:
      type: object
      description: An edited or new variant.
      required:
      - price
      properties:
        archived:
          type: boolean
          description: Withdraw the variant from sale; existing holds still commit.
        id:
          type:
          - string
          - 'null'
          description: The variant edited; leave out for a new variant.
          example: '7401234567890123457'
        options:
          type: object
          description: Up to 3 option names mapped to values.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        price:
          $ref: '#/components/schemas/MoneyBody'
          description: Unit price, in the store's currency.
        sku:
          type:
          - string
          - 'null'
          description: Up to 64 characters without whitespace, unique within the store.
      additionalProperties: false
    VariantBody:
      type: object
      description: A stored variant.
      required:
      - id
      - options
      - price
      - archived
      properties:
        archived:
          type: boolean
          description: Withdrawn from sale; existing holds may still be committed.
        id:
          type: string
          description: Variant id (decimal Snowflake).
        options:
          type: object
          description: Option name to value.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        price:
          $ref: '#/components/schemas/MoneyBody'
          description: Unit price.
        sku:
          type:
          - string
          - 'null'
          description: Stock-keeping unit.
    VariantRequest:
      type: object
      description: A new variant.
      required:
      - price
      properties:
        options:
          type: object
          description: Up to 3 option names mapped to values.
          additionalProperties:
            type: string
          propertyNames:
            type: string
          example:
            size: M
        price:
          $ref: '#/components/schemas/MoneyBody'
          description: Unit price.
        sku:
          type:
          - string
          - 'null'
          description: Up to 64 characters without whitespace, unique within the store.
          example: SHIRT-M
      additionalProperties: false
paths:
  /api/v1/tenant/ecommerce/customers:
    get:
      tags:
      - product_access
      summary: List the tenant's customers in every status, newest first.
      operationId: ecommerce_list_customers
      parameters:
      - name: email
        in: query
        description: Only customers with exactly this email, ignoring case.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1 to 100 (default 50).
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPageBody'
        '400':
          description: Invalid paging parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: |-
            Missing `ecommerce.customer.read` (the service's refusal), or the platform
            refused the request: the tenant lacks `products.ecommerce.enabled`, or the
            user holds no `ecommerce.*` permission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: ecommerce-service rejected the platform's credentials or answered unusably
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: ecommerce-service is not configured or unreachable, or its database is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags:
      - product_access
      summary: Create a customer of the tenant.
      description: |-
        Retrying with the same `Idempotency-Key` and body returns the customer the
        first request created, with `Idempotency-Replayed: true`.
      operationId: ecommerce_create_customer
      parameters:
      - name: Idempotency-Key
        in: header
        description: 1 to 255 visible ASCII characters, unique per tenant
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
        required: true
      responses:
        '201':
          description: Created, or replayed for a repeated key
          headers:
            Idempotency-Replayed:
              schema:
                type: string
              description: '`true` when replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBody'
        '400':
          description: Invalid fields or a missing Idempotency-Key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: |-
            Missing `ecommerce.customer.manage` (the service's refusal), or the platform
            refused the request: the tenant lacks `products.ecommerce.enabled`, or the
            user holds no `ecommerce.*` permission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Another active customer uses the email (`ecommerce/customer-email-taken`, `customer_id`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Idempotency-Key reused with a different body, or after the customer was erased
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: ecommerce-service rejected the platform's credentials or answered unusably
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: ecommerce-service is not configured or unreachable, or its database is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/tenant/ecommerce/customers/{customer_id}:
    get:
      tags:
      - product_access
      summary: Read one of the tenant's customers, in any status.
      operationId: ecommerce_get_customer
      parameters:
      - name: customer_id
        in: path
        description: A customer of the caller's tenant (decimal Snowflake)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBody'
        '403':
          description: |-
            Missing `ecommerce.customer.read` (the service's refusal), or the platform
            refused the request: the tenant lacks `products.ecommerce.enabled`, or the
            user holds no `ecommerce.*` permission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No customer with this id in the tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: ecommerce-service rejected the platform's credentials or answered unusably
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: ecommerce-service is not configured or unreachable, or its database is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/tenant/ecommerce/customers/{customer_id}/addresses:
    get:
      tags:
      - product_access
      summary: 'List a customer''s addresses, newest first: the active ones by default.'
      operationId: ecommerce_list_customer_addresses
      parameters:
      - name: customer_id
        in: path
        description: A customer of the caller's tenant (decimal Snowflake)
        required: true
        schema:
          type: string
      - name: status
        in: query
        description: '`active` (the default), `archived`, `erased` or `all`.'
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1 to 100 (default 50, more than the active limit of 20).
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: cursor
        in: query
        description: '`next_cursor` from the previous page.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressPageBody'
        '400':
          description: Invalid status or paging parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: |-
            Missing `ecommerce.customer.read` (the service's refusal), or the platform
            refused the request: the tenant lacks `products.ecommerce.enabled`, or the
            user holds no `ecommerce.*` permission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No customer with this id in the tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: ecommerce-service rejected the platform's credentials or answered unusably
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: ecommerce-service is not configured or unreachable, or its database is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags:
      - product_access
      summary: Add an address to a customer.
      description: |-
        A customer has at most 20 active addresses. Retrying with the same
        `Idempotency-Key` and body returns the address the first request added, with
        `Idempotency-Replayed: true`.
      operationId: ecommerce_add_customer_address
      parameters:
      - name: customer_id
        in: path
        description: A customer of the caller's tenant (decimal Snowflake)
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: 1 to 255 visible ASCII characters, unique per tenant
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
        required: true
      responses:
        '201':
          description: Added, or replayed for a repeated key
          headers:
            Idempotency-Replayed:
              schema:
                type: string
              description: '`true` when replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressBody'
        '400':
          description: Invalid fields or a missing Idempotency-Key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: |-
            Missing `ecommerce.customer.manage` (the service's refusal), or the platform
            refused the request: the tenant lacks `products.ecommerce.enabled`, or the
            user holds no `ecommerce.*` permission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No customer with this id in the tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |-
            The customer was erased (`ecommerce/customer-erased`) or has 20 active
            addresses (`ecommerce/address-limit-reached`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Idempotency-Key reused with a different request, or after the customer was erased
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: ecommerce-service rejected the platform's credentials or answered unusably
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: ecommerce-service is not configured or unreachable, or its database is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/tenant/ecommerce/customers/{customer_id}/addresses/{address_id}:
    get:
      tags:
      - product_access
      summary: Read one of a customer's addresses, in any status.
      operationId: ecommerce_get_customer_address
      parameters:
      - name: customer_id
        in: path
        description: A customer of the caller's tenant (decimal Snowflake)
        required: true
        schema:
          type: string
      - name: address_id
        in: path
        description: An address of that customer (decimal Snowflake)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressBody'
        '403':
          description: |-
            Missing `ecommerce.customer.read` (the service's refusal), or the platform
            refused the request: the tenant lacks `products.ecommerce.enabled`, or the
            user holds no `ecommerce.*` permission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: The customer has no address with this id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: ecommerce-service rejected the platform's credentials or answered unusably
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: ecommerce-service is not configured or unreachable, or its database is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/tenant/ecommerce/customers/{customer_id}/addresses/{address_id}/archive:
    post:
      tags:
      - product_access
      summary: Archive one of a customer's addresses.
      description: |-
        It stays readable, and orders that name it keep it; new orders cannot name
        it. Archiving an archived address returns it unchanged.
      operationId: ecommerce_archive_customer_address
      parameters:
      - name: customer_id
        in: path
        description: A customer of the caller's tenant (decimal Snowflake)
        required: true
        schema:
          type: string
      - name: address_id
        in: path
        description: An address of that customer (decimal Snowflake)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveAddressRequest'
        required: true
      responses:
        '200':
          description: The archived address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressBody'
        '403':
          description: |-
            Missing `ecommerce.customer.manage` (the service's refusal), or the platform
            refused the request: the tenant lacks `products.ecommerce.enabled`, or the
            user holds no `ecommerce.*` permission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: The customer has no address with this id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: The customer was erased (`ecommerce/customer-erased`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: ecommerce-service rejected the platform's credentials or answered unusably
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: ecommerce-service is not configured or unreachable, or its database is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/tenant/ecommerce/customers/{customer_id}/erase:
    post:
      tags:
      - product_access
      summary: Erase a customer's personal data, for an erasure request.
      description: |-
        Blanks the name, email and phone and every address, and marks the customer
        and its addresses `erased`. Their orders stay, still linked to the customer
        id and address ids. Erasing an erased customer returns it unchanged. This
        cannot be undone.
      operationId: ecommerce_erase_customer
      parameters:
      - name: customer_id
        in: path
        description: A customer of the caller's tenant (decimal Snowflake)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EraseCustomerRequest'
        required: true
      responses:
        '200':
          description: The erased customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBody'
        '403':
          description: |-
            Missing `ecommerce.customer.privacy` (the service's refusal), or the
            platform refused the request: the tenant lacks `products.ecommerce.enabled`,
            or the user holds no `ecommerce.*` permission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No customer with this id in the tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: ecommerce-service rejected the platform's credentials or answered unusably
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: ecommerce-service is not configured or unreachable, or its database is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/tenant/ecommerce/customers/{customer_id}/export:
    get:
      tags:
      - product_access
      summary: Export everything held about a customer, for an access request.
      description: |-
        Returns the record, every address in every status, and their orders in every
        store of the tenant, archived stores included, a page at a time. An erased
        customer exports with null contact and address fields and their orders.
      operationId: ecommerce_export_customer
      parameters:
      - name: customer_id
        in: path
        description: A customer of the caller's tenant (decimal Snowflake)
        required: true
        schema:
          type: string
      - name: limit
